<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Bilingue + Caméra flottante</title>
<style>
    :root { --en:#d9534f; --fr:#0275d8; --rec:#e53935; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background:#fff; color:#333; margin:0; padding:16px;
           display:flex; flex-direction:column; align-items:center; }
    .wrap { width:100%; max-width:820px; }
    textarea { width:100%; height:90px; background:#fafafa; border:1px solid #ddd; padding:12px;
               border-radius:10px; font-size:15px; resize:none; outline:none; }
    .controls { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
    button { padding:10px 16px; border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:13px; }
    button:hover:not(:disabled){ opacity:.9; }
    button:disabled{ opacity:.25; cursor:not-allowed; }
    #loadBtn{background:#eee;color:#555;} #playBtn{background:#e00;color:#fff;}
    #pauseBtn{background:#f0ad4e;color:#fff;display:none;} #stopBtn{background:#333;color:#fff;}
    #loopBtn{background:#eee;color:#555;} #loopBtn.active{background:#28a745;color:#fff;}
    #recordBtn{background:var(--rec);color:#fff;} #recordBtn.recording{background:#b71c1c;}
    select { padding:9px; border-radius:8px; border:1px solid #ddd; background:#eee; font-weight:600; font-size:13px; }
    .stage { width:100%; max-width:820px; aspect-ratio:16/9; background:#fff; border-radius:14px;
             overflow:hidden; position:relative; box-shadow:0 8px 30px rgba(0,0,0,.08); border:1px solid #eee; margin-top:10px; }
    #scroller { position:absolute; width:100%; top:50%; transition:transform .35s cubic-bezier(.19,1,.22,1); }
    .sentence-item { height:150px; display:flex; align-items:center; justify-content:center; text-align:center;
                     padding:0 50px; font-size:38px; font-weight:700; opacity:.05; transition:opacity .4s, transform .4s; }
    .sentence-item.active { opacity:1; transform:scale(1.06); }
    .english{color:var(--en);} .french{color:var(--fr);}
    .timer { display:none; align-items:center; gap:6px; background:#b71c1c; color:#fff;
             padding:10px 12px; border-radius:8px; font-family:monospace; font-size:12px; font-weight:700; }
    .timer.active{display:flex;}
    .timer .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:blink 1s infinite;}
    @keyframes blink{50%{opacity:.2;}}

    .cam { position:fixed; bottom:24px; right:24px; width:130px; height:130px; border-radius:50%;
           overflow:hidden; box-shadow:0 10px 25px rgba(0,0,0,.35); border:3px solid #fff;
           background:#111; z-index:1000; cursor:grab; touch-action:none; user-select:none; }
    .cam.recording { border-color:#f33; animation:ring 1.4s infinite; }
    @keyframes ring{50%{box-shadow:0 0 0 8px rgba(255,51,51,.15),0 10px 25px rgba(0,0,0,.35);}}
    .cam video { width:100%; height:100%; object-fit:cover; display:block; background:#000;
                 transform:scaleX(-1); filter:brightness(1.03) contrast(1.06) saturate(1.1); }
    .cam .btns { position:absolute; bottom:5px; left:50%; transform:translateX(-50%);
                 display:flex; gap:4px; opacity:.8; z-index:5; }
    .cam .btns button { background:rgba(0,0,0,.6); color:#fff; border-radius:50%; width:24px; height:24px;
                        font-size:12px; padding:0; display:flex; align-items:center; justify-content:center; }
    .cam .btns .rec { width:28px; height:28px; font-size:14px; background:rgba(255,255,255,.85); color:#111; }
    .cam .btns .rec.active { background:#f33; color:#fff; }
    .cam .btns .torch.on { background:#ffd54f; color:#111; }
    .cam .btns .torch.unsupported { opacity:.35; }
    .cam .rec-tag { position:absolute; top:6px; left:50%; transform:translateX(-50%);
                    background:rgba(229,57,53,.9); color:#fff; font-size:9px; font-weight:700;
                    padding:2px 8px; border-radius:12px; display:none; z-index:5; }
    .cam.recording .rec-tag { display:block; }
    .cam.torch-on { border-color:#ffd54f; box-shadow:0 0 30px 6px rgba(255,213,79,.55), 0 10px 25px rgba(0,0,0,.35); }
    .cam.torch-front-on { border-color:#4fc3f7; box-shadow:0 0 30px 6px rgba(79,195,247,.55), 0 10px 25px rgba(0,0,0,.35); }

    .preview { display:none; width:100%; max-width:820px; margin-top:14px; background:#0d1117;
               border-radius:12px; padding:10px; border:1px solid #30363d; }
    .preview.active{ display:block; }
    .preview h4 { margin:0 0 8px; color:#e6edf3; font-size:11px; font-weight:600;
                  display:flex; align-items:center; gap:6px; }
    .preview h4 .dot{width:7px;height:7px;background:#f33;border-radius:50%;animation:blink 1s infinite;}
    .preview canvas { width:100%; height:auto; display:block; border-radius:6px; background:#fff; aspect-ratio:16/9; }

    .torch-info { position:fixed; bottom:170px; right:24px; background:rgba(0,0,0,.85); color:#fff;
                  padding:6px 10px; border-radius:8px; font-size:11px; max-width:230px; z-index:999;
                  display:none; }
    .torch-info.show { display:block; }

    /* ===== VIDEO GALLERY ===== */
    .gallery { width:100%; max-width:820px; margin-top:20px; }
    .gallery h3 { font-size:14px; margin:0 0 10px; color:#555; display:flex;
                  align-items:center; justify-content:space-between; }
    .gallery h3 .count { background:#eee; color:#555; padding:2px 8px; border-radius:10px; font-size:11px; }
    .gallery-list { display:flex; flex-direction:column; gap:10px; }
    .gallery-empty { padding:24px; text-align:center; color:#aaa; font-size:13px;
                     background:#fafafa; border:1px dashed #ddd; border-radius:10px; }
    .video-card { display:flex; gap:12px; background:#fafafa; border:1px solid #eee;
                  border-radius:12px; padding:12px; align-items:center; }
    .video-card video { width:140px; height:79px; border-radius:8px; background:#000; object-fit:cover; flex-shrink:0; }
    .video-info { flex:1; min-width:0; }
    .video-info .name { font-weight:700; font-size:13px; margin-bottom:3px;
                        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .video-info .meta { font-size:11px; color:#888; display:flex; gap:8px; flex-wrap:wrap; }
    .video-info .meta .badge { padding:1px 6px; border-radius:6px; background:#e8e8e8; color:#555; font-weight:600; }
    .video-info .meta .badge.mp4 { background:#c8e6c9; color:#2e7d32; }
    .video-info .meta .badge.webm { background:#ffe0b2; color:#e65100; }
    .video-info .meta .badge.converting { background:#bbdefb; color:#1565c0; }
    .video-info .meta .badge.failed { background:#ffcdd2; color:#c62828; }
    .video-actions { display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
    .video-actions button { padding:7px 12px; font-size:11px; }
    .video-actions .btn-download { background:#28a745; color:#fff; }
    .video-actions .btn-delete { background:#eee; color:#c62828; }
    .video-card .progress { width:100%; height:4px; background:#e0e0e0; border-radius:2px; overflow:hidden; margin-top:6px; }
    .video-card .progress > i { display:block; height:100%; width:0%; background:#0275d8; transition:width .3s; }

    .conv-banner { position:fixed; top:16px; left:50%; transform:translateX(-50%);
                   background:rgba(20,20,20,.95); color:#fff; padding:12px 18px; border-radius:10px;
                   font-size:13px; font-weight:600; z-index:2000; display:none;
                   box-shadow:0 8px 30px rgba(0,0,0,.35); min-width:260px; text-align:center; }
    .conv-banner.show { display:block; }
    .conv-banner .bar { margin-top:8px; height:6px; background:rgba(255,255,255,.15); border-radius:3px; overflow:hidden; }
    .conv-banner .bar > i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#4fc3f7,#81c784); transition:width .3s; }
    .conv-banner .sub { font-weight:400; font-size:11px; opacity:.75; margin-top:4px; }

    @media (max-width:600px){ .cam{width:100px;height:100px;bottom:12px;right:12px;}
                              .sentence-item{font-size:26px;padding:0 24px;height:120px;}
                              .video-card video{width:100px;height:56px;} }
</style>
</head>
<body>

<div class="wrap">
    <textarea id="textInput" placeholder="Anglais&#10;Français&#10;Anglais..."></textarea>
    <div class="controls">
        <button id="loadBtn">1. Charger</button>
        <button id="playBtn" disabled>▶ Lire</button>
        <button id="pauseBtn">⏸ Pause</button>
        <button id="stopBtn">⏹ Stop</button>
        <button id="loopBtn">🔁 Boucle</button>
        <button id="recordBtn">⏺ Enregistrer</button>
        <select id="qualitySelect">
            <option value="720" selected>720p</option>
            <option value="1080">1080p</option>
        </select>
        <div class="timer" id="timer"><span class="dot"></span><span id="time">00:00</span></div>
    </div>
</div>

<div class="stage" id="stage"><div id="scroller"></div></div>

<div class="preview" id="previewPanel">
    <h4><span class="dot"></span>REC — Aperçu (contenu de la vidéo)</h4>
    <canvas id="previewCanvas"></canvas>
</div>

<!-- ===== IN-APP VIDEO GALLERY ===== -->
<div class="gallery">
    <h3>📁 Mes vidéos <span class="count" id="galleryCount">0</span></h3>
    <div class="gallery-list" id="galleryList">
        <div class="gallery-empty">Aucune vidéo enregistrée pour le moment.</div>
    </div>
</div>

<div class="torch-info" id="torchInfo"></div>

<div class="conv-banner" id="convBanner">
    <div id="convText">Conversion en MP4…</div>
    <div class="bar"><i id="convBar"></i></div>
    <div class="sub" id="convSub">Préparation…</div>
</div>

<div class="cam" id="cam">
    <video id="camVideo" autoplay playsinline muted></video>
    <div class="rec-tag">REC</div>
    <div class="btns">
        <button class="rec" id="camRec" title="Enregistrer">📷</button>
        <button id="camSwitch" title="Changer">🔄</button>
        <button class="torch" id="camTorch" title="Torche">🔦</button>
    </div>
</div>

<script>
// ============ QUALITY ============
const PRESETS = {
    '720':  { w:1280, h:720,  fps:30, bitrate:2_500_000, label:'720p'  },
    '1080': { w:1920, h:1080, fps:30, bitrate:4_500_000, label:'1080p' }
};
let quality = PRESETS['720'];
document.getElementById('qualitySelect').onchange = e => quality = PRESETS[e.target.value];

// ============ TTS ============
const synth = speechSynthesis;
let data = [], idx = 0, rep = 0, playing = false, paused = false, looping = false;
const H = 150;

function processText() {
    stopSpeech();
    const scroller = document.getElementById('scroller');
    const lines = document.getElementById('textInput').value.split('\n').map(s=>s.trim()).filter(Boolean);
    scroller.innerHTML = ''; data = [];
    lines.forEach((line, i) => {
        const isEN = i % 2 === 0;
        const div = document.createElement('div');
        div.className = 'sentence-item ' + (isEN ? 'english' : 'french');
        div.innerText = line;
        scroller.appendChild(div);
        data.push({ text: line, lang: isEN ? 'en-US' : 'fr-FR', el: div, max: isEN ? 2 : 1 });
    });
    if (data.length) {
        scroller.style.transform = `translateY(${-H/2}px)`;
        document.getElementById('playBtn').disabled = false;
    }
}

function updateDisplay(i) {
    data.forEach(s => s.el.classList.remove('active'));
    if (!data[i]) return;
    data[i].el.classList.add('active');
    document.getElementById('scroller').style.transform = `translateY(${-i*H - H/2}px)`;
}

function speakStep() {
    if (!playing || paused) return;
    if (idx >= data.length) {
        if (looping) { idx = 0; rep = 0; speakStep(); }
        else stopSpeech();
        return;
    }
    const item = data[idx];
    updateDisplay(idx);
    const u = new SpeechSynthesisUtterance(item.text);
    u.lang = item.lang;
    const v = synth.getVoices().find(x => x.lang.startsWith(item.lang));
    if (v) u.voice = v;
    u.onend = () => {
        if (!playing || paused) return;
        rep++;
        if (rep < item.max) speakStep();
        else { idx++; rep = 0; speakStep(); }
    };
    u.onerror = () => playing && stopSpeech();
    synth.speak(u);
}

function startPlayAll() {
    if (!data.length) return;
    synth.cancel();
    playing = true; paused = false; idx = 0; rep = 0;
    document.getElementById('playBtn').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'flex';
    document.getElementById('pauseBtn').innerText = '⏸ Pause';
    speakStep();
}

function togglePause() {
    if (!playing) return;
    paused = !paused;
    const btn = document.getElementById('pauseBtn');
    if (paused) { synth.pause(); btn.innerText = '▶ Reprendre'; }
    else { btn.innerText = '⏸ Pause'; synth.paused ? synth.resume() : speakStep(); }
}

function stopSpeech() {
    playing = false; paused = false; synth.cancel();
    document.getElementById('playBtn').style.display = 'flex';
    document.getElementById('playBtn').disabled = !data.length;
    document.getElementById('pauseBtn').style.display = 'none';
}

document.getElementById('loadBtn').onclick = processText;
document.getElementById('playBtn').onclick = startPlayAll;
document.getElementById('pauseBtn').onclick = togglePause;
document.getElementById('stopBtn').onclick = stopSpeech;
document.getElementById('loopBtn').onclick = e => {
    looping = !looping;
    e.target.classList.toggle('active', looping);
    e.target.innerText = looping ? '🔁 ON' : '🔁 Boucle';
};
speechSynthesis.onvoiceschanged = () => synth.getVoices();

// ============ CAMERA + REAL LED TORCH ============
const camEl = document.getElementById('cam');
const videoEl = document.getElementById('camVideo');
const torchBtn = document.getElementById('camTorch');
const torchInfo = document.getElementById('torchInfo');
let stream = null, facing = 'user', dragging = false, sx, sy, sl, st;
let torchOn = false;
const torchCapability = { user: null, environment: null };

function showTorchInfo(msg, ms = 2500) {
    torchInfo.textContent = msg;
    torchInfo.classList.add('show');
    clearTimeout(showTorchInfo._t);
    showTorchInfo._t = setTimeout(() => torchInfo.classList.remove('show'), ms);
}

function currentTrackSupportsTorch() {
    if (!stream) return false;
    const track = stream.getVideoTracks()[0];
    if (!track || typeof track.getCapabilities !== 'function') return false;
    try { return !!track.getCapabilities().torch; } catch (e) { return false; }
}

async function applyRealTorch(on) {
    if (!stream) return false;
    const track = stream.getVideoTracks()[0];
    if (!track) return false;
    try {
        await track.applyConstraints({ advanced: [{ torch: on }] });
        return true;
    } catch (e) { console.warn('Torch apply failed:', e); return false; }
}

function updateTorchVisual() {
    camEl.classList.toggle('torch-on', torchOn && facing === 'environment');
    camEl.classList.toggle('torch-front-on', torchOn && facing === 'user');
    torchBtn.classList.toggle('on', torchOn);
}

function refreshTorchButtonState() {
    const capable = torchCapability[facing] === true;
    torchBtn.classList.toggle('unsupported', !capable);
    torchBtn.title = capable
        ? (facing === 'environment' ? 'LED arrière disponible' : 'LED avant disponible')
        : (facing === 'environment' ? 'Pas de LED arrière' : 'Pas de LED avant');
}

async function startCam(mode) {
    if (torchOn) { await applyRealTorch(false); torchOn = false; updateTorchVisual(); }
    if (stream) stream.getTracks().forEach(t => t.stop());

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: mode, width:{ideal:640}, height:{ideal:640}, frameRate:{ideal:24} },
            audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();
        videoEl.style.transform = mode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
        const supports = currentTrackSupportsTorch();
        if (torchCapability[mode] == null) torchCapability[mode] = supports;
        refreshTorchButtonState();
    } catch (e) { console.warn('Camera error', e); }
}

async function toggleTorch() {
    if (!stream) return;
    if (torchCapability[facing] == null) {
        torchCapability[facing] = currentTrackSupportsTorch();
        refreshTorchButtonState();
    }
    if (torchCapability[facing] !== true) {
        showTorchInfo(facing === 'environment' ? "🔦 Pas de LED arrière détectée" : "🔦 Pas de LED avant détectée");
        return;
    }
    const wantOn = !torchOn;
    const ok = await applyRealTorch(wantOn);
    if (!ok) { showTorchInfo("⚠️ Impossible de piloter la LED", 2000); return; }
    torchOn = wantOn;
    updateTorchVisual();
    showTorchInfo(torchOn ? `🔦 LED ${facing === 'environment' ? 'arrière' : 'avant'} allumée` : `🔦 LED éteinte`, 1500);
}

document.getElementById('camSwitch').onclick = async e => {
    e.stopPropagation();
    if (torchOn) { await applyRealTorch(false); torchOn = false; updateTorchVisual(); }
    facing = facing === 'user' ? 'environment' : 'user';
    startCam(facing);
};
torchBtn.onclick = e => { e.stopPropagation(); toggleTorch(); };

function setPos(l, t) {
    const r = camEl.getBoundingClientRect();
    l = Math.max(0, Math.min(l, innerWidth - r.width));
    t = Math.max(0, Math.min(t, innerHeight - r.height));
    camEl.style.left = l + 'px'; camEl.style.top = t + 'px';
    camEl.style.right = 'auto'; camEl.style.bottom = 'auto';
}
camEl.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    dragging = true;
    const r = camEl.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; sl = r.left; st = r.top;
    camEl.style.cursor = 'grabbing'; camEl.setPointerCapture(e.pointerId);
});
camEl.addEventListener('pointermove', e => { if (dragging) setPos(sl + e.clientX - sx, st + e.clientY - sy); });
camEl.addEventListener('pointerup', () => { dragging = false; camEl.style.cursor = 'grab'; });

requestAnimationFrame(() => { const r = camEl.getBoundingClientRect(); setPos(r.left, r.top); });

document.addEventListener('visibilitychange', async () => {
    if (document.hidden && stream) {
        if (torchOn) await applyRealTorch(false);
        torchOn = false;
        stream.getTracks().forEach(t => t.stop());
    } else if (!document.hidden && !stream) startCam(facing);
});

startCam('user');

// ============ RECORDING ============
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
const previewCanvas = document.getElementById('previewCanvas');
const previewCtx = previewCanvas.getContext('2d');
const stage = document.getElementById('stage');

function applyQuality() {
    canvas.width = quality.w; canvas.height = quality.h;
    previewCanvas.width = quality.w / 2; previewCanvas.height = quality.h / 2;
}
applyQuality();
document.getElementById('qualitySelect').addEventListener('change', () => { if (!recording) applyQuality(); });

let recorder = null, chunks = [], recording = false;
let rafId = null, timerId = null, t0 = 0;
let micStream = null, audioCtx = null, analyser = null;
const MAX_CHUNKS = 400;

function draw(targetCtx, W, Hh, fast) {
    targetCtx.imageSmoothingQuality = fast ? 'low' : 'medium';
    targetCtx.fillStyle = '#fff';
    targetCtx.fillRect(0, 0, W, Hh);

    const active = document.querySelector('.sentence-item.active');
    if (active) {
        const color = active.classList.contains('english') ? '#d9534f' : '#0275d8';
        const text = active.innerText;
        const fs = Math.round(Hh * 0.12);
        targetCtx.font = `700 ${fs}px system-ui, sans-serif`;
        targetCtx.fillStyle = color;
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        const maxW = W * 0.82;
        const words = text.split(' ');
        const lines = []; let cur = '';
        for (const w of words) {
            const t = cur ? cur + ' ' + w : w;
            if (targetCtx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; }
            else cur = t;
        }
        if (cur) lines.push(cur);
        const lh = fs * 1.15;
        const y0 = Hh / 2 - (lines.length - 1) * lh / 2;
        lines.forEach((l, i) => targetCtx.fillText(l, W / 2, y0 + i * lh));
    }

    if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
        const br = camEl.getBoundingClientRect();
        const sr = stage.getBoundingClientRect();
        const kx = W / sr.width, ky = Hh / sr.height;
        const cx = (br.left - sr.left + br.width / 2) * kx;
        const cy = (br.top - sr.top + br.height / 2) * ky;
        const rad = (br.width / 2) * kx;

        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.arc(cx, cy, rad, 0, Math.PI * 2);
        targetCtx.clip();
        targetCtx.translate(cx, cy);
        if (facing === 'user') targetCtx.scale(-1, 1);
        const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
        const side = Math.min(vw, vh);
        const sxv = (vw - side) / 2, syv = (vh - side) / 2;
        targetCtx.drawImage(videoEl, sxv, syv, side, side, -rad, -rad, rad * 2, rad * 2);
        targetCtx.restore();

        targetCtx.beginPath();
        targetCtx.arc(cx, cy, rad, 0, Math.PI * 2);
        targetCtx.lineWidth = Math.max(3, rad * 0.06);
        targetCtx.strokeStyle = torchOn ? (facing === 'environment' ? '#ffd54f' : '#4fc3f7') : '#fff';
        targetCtx.stroke();
    }
}

let lastFrame = 0, lastPreview = 0;
function loop(now) {
    rafId = requestAnimationFrame(loop);
    if (now - lastFrame < 33) return;
    lastFrame = now;
    draw(ctx, canvas.width, canvas.height, true);
    if (now - lastPreview > 125) {
        draw(previewCtx, previewCanvas.width, previewCanvas.height, true);
        lastPreview = now;
    }
    if (analyser) {
        const d = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(d);
        let s = 0; for (let i = 0; i < 20; i++) s += d[i];
        const lvl = Math.min(1, s / 20 / 90);
        document.querySelector('#timer .dot').style.opacity = 0.4 + lvl * 0.6;
    }
}

function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function pickRecorderMime() {
    const candidates = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm',
        'video/mp4'
    ];
    for (const m of candidates) if (MediaRecorder.isTypeSupported(m)) return m;
    return '';
}

function timestamp() {
    return new Date().toISOString().slice(0, 19).replace(/[:.]/g, '-');
}

// ============================================================
// ============ FFMPEG.WASM — AUTO MP4 CONVERSION =============
// ============================================================
let ffmpegInstance = null;
let ffmpegLoading = null;

async function loadFFmpeg(onProgress) {
    if (ffmpegInstance) return ffmpegInstance;
    if (ffmpegLoading) return ffmpegLoading;

    ffmpegLoading = (async () => {
        onProgress && onProgress('Téléchargement du convertisseur…', 5);

        if (!window.FFmpegWASM) {
            await new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js';
                s.onload = resolve;
                s.onerror = () => reject(new Error('ffmpeg.js load failed'));
                document.head.appendChild(s);
            });
        }
        if (!window.FFmpegUtil) {
            await new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js';
                s.onload = resolve;
                s.onerror = () => reject(new Error('ffmpeg util load failed'));
                document.head.appendChild(s);
            });
        }

        const { FFmpeg } = window.FFmpegWASM;
        const { toBlobURL } = window.FFmpegUtil;
        const ff = new FFmpeg();

        onProgress && onProgress('Chargement du noyau…', 15);

        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
        await ff.load({
            coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
            wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm')
        });

        ffmpegInstance = ff;
        return ff;
    })();

    return ffmpegLoading;
}

// Convert a WebM blob → MP4 blob
async function convertWebmToMp4(webmBlob, onProgress) {
    onProgress && onProgress('Chargement du convertisseur…', 5);
    const ff = await loadFFmpeg(onProgress);

    // ffmpeg progress event
    const progressHandler = ({ progress }) => {
        const pct = Math.max(20, Math.min(95, 20 + (progress || 0) * 75));
        onProgress && onProgress('Encodage H.264…', pct);
    };
    ff.on('progress', progressHandler);

    const { fetchFile } = window.FFmpegUtil;
    const input = 'input.webm';
    const output = 'output.mp4';

    onProgress && onProgress('Préparation…', 20);
    ff.writeFile(input, await fetchFile(webmBlob));

    onProgress && onProgress('Encodage H.264…', 30);
    await ff.exec([
        '-i', input,
        '-c:v', 'libx264',
        '-preset', 'ultrafast',
        '-crf', '23',
        '-pix_fmt', 'yuv420p',
        '-c:a', 'aac',
        '-b:a', '128k',
        '-movflags', '+faststart',
        output
    ]);

    onProgress && onProgress('Finalisation…', 96);
    const data = ff.readFile(output);
    const mp4Blob = new Blob([data.buffer], { type: 'video/mp4' });

    try { ff.deleteFile(input); ff.deleteFile(output); } catch(e){}
    ff.off && ff.off('progress', progressHandler);

    return mp4Blob;
}

const convBanner = document.getElementById('convBanner');
const convText = document.getElementById('convText');
const convBar = document.getElementById('convBar');
const convSub = document.getElementById('convSub');

function showConv(text, sub = '', progress = 0) {
    convText.textContent = text;
    convSub.textContent = sub;
    convBar.style.width = Math.max(0, Math.min(100, progress)) + '%';
    convBanner.classList.add('show');

    setTimeout(() => convBanner.classList.remove('show'), delay);
}

// ============================================================
// ============ INDEXEDDB STORAGE =============================
// ============================================================
const DB_NAME = 'tts-cam-videos';
const DB_VERSION = 1;
const STORE = 'videos';
let dbPromise = null;

function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE)) {
                const store = db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
                store.createIndex('createdAt', 'createdAt');
            }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
    return dbPromise;
}

async function dbAdd(record) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        const req = tx.objectStore(STORE).add(record);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function dbUpdate(id, patch) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        const store = tx.objectStore(STORE);
        const getReq = store.get(id);
        getReq.onsuccess = () => {
            const rec = getReq.result;
            if (!rec) return reject(new Error('Not found'));
            Object.assign(rec, patch);
            const putReq = store.put(rec);
            putReq.onsuccess = () => resolve(putReq.result);
            putReq.onerror = () => reject(putReq.error);
        };
        getReq.onerror = () => reject(getReq.error);
    });
}

async function dbDelete(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        const req = tx.objectStore(STORE).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
    });
}

async function dbGetAll() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
    });
}

// ============================================================
// ============ GALLERY UI ====================================
// ============================================================
const galleryList = document.getElementById('galleryList');
const galleryCount = document.getElementById('galleryCount');
const objectUrls = new Map();

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' o';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' Ko';
    return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
}

function formatDate(ts) {
    return new Date(ts).toLocaleString('fr-FR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
    });
}

// status: 'converting' | 'ready' | 'failed'
function renderCard(rec) {
    const url = objectUrls.get(rec.id);
    const isMp4 = rec.mime.includes('mp4');
    const ext = isMp4 ? 'mp4' : 'webm';
    const status = rec.status || 'ready';

    const badgeClass = status === 'converting' ? 'converting'
                     : status === 'failed' ? 'failed'
                     : isMp4 ? 'mp4' : 'webm';
    const badgeText = status === 'converting' ? 'CONVERSION…'
                    : status === 'failed' ? 'ÉCHEC MP4'
                    : ext.toUpperCase();

    const card = document.createElement('div');
    card.className = 'video-card';
    card.dataset.id = rec.id;

    card.innerHTML = `
        <video src="${url}" controls preload="metadata" playsinline></video>
        <div class="video-info">
            <div class="name">${rec.name}</div>
            <div class="meta">
                <span class="badge ${badgeClass}">${badgeText}</span>
                <span>${formatSize(rec.size)}</span>
                <span>${rec.quality}</span>
                <span>${formatDate(rec.createdAt)}</span>
            </div>
            ${status === 'converting' ? '<div class="progress"><i></i></div>' : ''}
        </div>
        <div class="video-actions">
            <button class="btn-download" data-action="download">⬇ Download</button>
            <button class="btn-delete" data-action="delete">🗑 Supprimer</button>
        </div>
    `;

    card.querySelector('[data-action="download"]').onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = rec.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
    };

    card.querySelector('[data-action="delete"]').onclick = async () => {
        if (!confirm(`Supprimer "${rec.name}" ?`)) return;
        await dbDelete(rec.id);
        const u = objectUrls.get(rec.id);
        if (u) { URL.revokeObjectURL(u); objectUrls.delete(rec.id); }
        renderGallery();
    };

    return card;
}

async function renderGallery() {
    const records = (await dbGetAll()).sort((a, b) => b.createdAt - a.createdAt);
    galleryCount.textContent = records.length;

    for (const url of objectUrls.values()) URL.revokeObjectURL(url);
    objectUrls.clear();

    if (!records.length) {
        galleryList.innerHTML = '<div class="gallery-empty">Aucune vidéo enregistrée pour le moment.</div>';
        return;
    }

    galleryList.innerHTML = '';
    for (const rec of records) {
        const url = URL.createObjectURL(rec.blob);
        objectUrls.set(rec.id, url);
        galleryList.appendChild(renderCard(rec));
    }
}

// ============================================================
// ============ RECORDING CONTROL =============================
// ============================================================
function pickNativeMp4() {
    const mp4 = [
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/mp4;codecs=h264,aac',
        'video/mp4'
    ].find(m => MediaRecorder.isTypeSupported(m));
    return mp4 || null;
}

async function startRec() {
    if (recording) return;
    applyQuality();

    try {
        micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
        });
    } catch (e) { alert('Microphone requis.'); return; }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    src.connect(analyser);

    const combined = new MediaStream();
    canvas.captureStream(quality.fps).getVideoTracks().forEach(t => combined.addTrack(t));
    micStream.getAudioTracks().forEach(t => combined.addTrack(t));

    // Try native MP4 first (Safari), else WebM
    const nativeMp4Mime = pickNativeMp4();
    const mime = nativeMp4Mime || pickRecorderMime();

    try {
        recorder = new MediaRecorder(combined, {
            ...(mime && { mimeType: mime }),
            videoBitsPerSecond: quality.bitrate,
            audioBitsPerSecond: 128_000
        });
    } catch (e) { alert('Enregistrement indisponible.'); cleanup(); return; }

    recorder._nativeMp4 = !!nativeMp4Mime;

    chunks = [];
    recorder.ondataavailable = e => {
        if (e.data.size > 0) {
            chunks.push(e.data);
            if (chunks.length > MAX_CHUNKS) chunks.shift();
        }
    };

    recorder.onstop = async () => {
        const isNativeMp4 = recorder._nativeMp4;
        const srcMime = isNativeMp4 ? 'video/mp4' : 'video/webm';
        const srcBlob = new Blob(chunks, { type: srcMime });
        chunks = [];

        const ts = timestamp();
        const baseName = `lecon-${quality.label}-${ts}`;

        if (isNativeMp4) {
            // Safari: already MP4, just store
            const id = await dbAdd({
                name: `${baseName}.mp4`,
                blob: srcBlob,
                mime: 'video/mp4',
                size: srcBlob.size,
                quality: quality.label,
                createdAt: Date.now(),
                status: 'ready'
            });
            await renderGallery();
        } else {
            // Chrome/Firefox/Edge: store WebM first, then auto-convert
            const id = await dbAdd({
                name: `${baseName}.webm`,
                blob: srcBlob,
                mime: 'video/webm',
                size: srcBlob.size,
                quality: quality.label,
                createdAt: Date.now(),
                status: 'converting'
            });
            await renderGallery();

            // Auto-convert in background
            autoConvertToMp4(id, srcBlob, baseName);
        }
    };

    document.getElementById('previewPanel').classList.add('active');
    recording = true;
    t0 = Date.now();
    document.getElementById('recordBtn').classList.add('recording');
    document.getElementById('recordBtn').innerText = '⏹ Stop';
    document.getElementById('camRec').classList.add('active');
    document.getElementById('camRec').innerText = '⏹';
    camEl.classList.add('recording');
    document.getElementById('timer').classList.add('active');

    loop(performance.now());
    recorder.start(2000);
    timerId = setInterval(() => {
        document.getElementById('time').textContent = fmt(Date.now() - t0);
    }, 500);

    // Preload ffmpeg in background so conversion is fast
    if (!nativeMp4Mime) loadFFmpeg().catch(() => {});
}

// Auto-convert a stored WebM record into MP4, replacing the blob
async function autoConvertToMp4(id, webmBlob, baseName) {
    showConv('Conversion MP4 automatique…', 'Préparation…', 5);
    try {
        const mp4Blob = await convertWebmToMp4(webmBlob, (msg, pct) => {
            showConv('Conversion MP4 automatique…', msg, pct);
        });

        // Replace blob + mime + name + size in DB
        const newName = `${baseName}.mp4`;
        await dbUpdate(id, {
            blob: mp4Blob,
            mime: 'video/mp4',
            size: mp4Blob.size,
            name: newName,
            status: 'ready'
        });

        // Revoke old URL, refresh gallery
        const oldUrl = objectUrls.get(id);
        if (oldUrl) { URL.revokeObjectURL(oldUrl); objectUrls.delete(id); }
        await renderGallery();

        showConv('✅ MP4 prêt', 'Converti automatiquement', 100);
        hideConv(1800);
    } catch (err) {
        console.error('Auto-conversion failed:', err);
        await dbUpdate(id, { status: 'failed' });
        await renderGallery();
        showConv('⚠️ Conversion échouée', 'Le WebM reste disponible', 100);
        hideConv(2500);
    }
}

function cleanup() {
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
    analyser = null;
}

function stopRec() {
    if (!recording) return;
    recording = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    try { recorder.stop(); } catch(e){}
    cleanup();

    document.getElementById('recordBtn').classList.remove('recording');
    document.getElementById('recordBtn').innerText = '⏺ Enregistrer';
    document.getElementById('camRec').classList.remove('active');
    document.getElementById('camRec').innerText = '📷';
    camEl.classList.remove('recording');
    document.getElementById('timer').classList.remove('active');
    setTimeout(() => document.getElementById('previewPanel').classList.remove('active'), 500);
}

document.getElementById('recordBtn').onclick = () => recording ? stopRec() : startRec();
document.getElementById('camRec').onclick = e => {
    e.stopPropagation();
    recording ? stopRec() : startRec();
};

// Default text
window.addEventListener('load', async () => {
    const ta = document.getElementById('textInput');
    if (!ta.value) ta.value =
        "Hello, how are you?\nBonjour, comment allez-vous ?\nI am learning English.\nJ'apprends l'anglais.";
    await renderGallery();
});
