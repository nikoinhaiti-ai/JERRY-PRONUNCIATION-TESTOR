<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprentissage Bilingue TTS + Caméra flottante</title>
    <style>
        :root {
            --en-red: #d9534f;
            --fr-blue: #0275d8;
            --border-color: #eeeeee;
            --success-green: #28a745;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .input-section {
            width: 100%;
            max-width: 850px;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #fafafa;
            color: #333;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #loadBtn { background: #f0f0f0; color: #555; }
        #playBtn { background: #ff0000; color: white; }
        #pauseBtn { background: #f0ad4e; color: white; display: none; }
        #stopBtn { background: #333; color: white; }
        #loopBtn { background: #f0f0f0; color: #555; border: 2px solid transparent; }
        
        #loopBtn.active { 
            background: var(--success-green); 
            color: white; 
            border-color: #1e7e34;
        }

        button:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.9; }
        button:disabled { opacity: 0.2; cursor: not-allowed; }

        /* CONTENEUR FORMAT YOUTUBE (16:9) */
        .stage {
            width: 100%;
            max-width: 850px;
            aspect-ratio: 16 / 9;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }

        #scroller {
            position: absolute;
            width: 100%;
            top: 50%; 
            left: 0;
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            will-change: transform;
        }

        .sentence-item {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 60px;
            font-size: 40px;
            font-weight: 700;
            box-sizing: border-box;
            transition: opacity 0.5s, transform 0.5s;
            opacity: 0.05; 
        }

        .sentence-item.active {
            opacity: 1;
            transform: scale(1.08);
        }

        .english { color: var(--en-red); }
        .french { color: var(--fr-blue); }

        .center-guide {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 1px;
            background: rgba(0,0,0,0.02);
            pointer-events: none;
            transform: translateY(-50%);
        }

        /* --- FLOATING CAMERA WIDGET (small, draggable, with flash/filter) --- */
        .camera-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 220px;
            height: 165px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            border: 3px solid #fff;
            background: #111;
            z-index: 1000;
            cursor: grab;
            transition: box-shadow 0.2s;
            user-select: none;
        }

        .camera-float:active {
            cursor: grabbing;
            box-shadow: 0 18px 40px rgba(0,0,0,0.5);
        }

        .camera-float video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
            transform: scaleX(-1); /* mirror for front camera, adjusted dynamically */
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: brightness(1.05) contrast(1.05) saturate(1.1) blur(0.3px); /* smooth face filter */
        }

        /* Flash overlay */
        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
            z-index: 10;
            mix-blend-mode: overlay;
        }

        .flash-overlay.active {
            opacity: 0.8;
        }

        /* tiny status light / label */
        .camera-badge {
            position: absolute;
            top: 8px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 9px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 20;
        }

        .camera-badge::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e676;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Camera control buttons */
        .camera-controls {
            position: absolute;
            bottom: 8px;
            right: 10px;
            display: flex;
            gap: 6px;
            z-index: 30;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .camera-controls:hover {
            opacity: 1;
        }

        .cam-btn {
            background: rgba(0,0,0,0.6);
            border: none;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s, transform 0.1s;
            padding: 0;
        }

        .cam-btn:hover {
            background: rgba(0,0,0,0.9);
            transform: scale(1.1);
        }

        .cam-btn.flash-active {
            background: #ffaa00;
            color: #000;
        }

        /* On small screens, adapt size */
        @media (max-width: 600px) {
            .camera-float {
                width: 150px;
                height: 112px;
                bottom: 15px;
                right: 15px;
            }
            .cam-btn {
                width: 24px;
                height: 24px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="input-section">
        <textarea id="textInput" placeholder="Ligne 1 : Anglais&#10;Ligne 2 : Français&#10;Ligne 3 : Anglais..."></textarea>
        <div class="controls">
            <button id="loadBtn" onclick="processText()">1. Charger la liste</button>
            <button id="playBtn" onclick="startPlayAll()" disabled>▶ Lire tout</button>
            <button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
            <button id="stopBtn" onclick="stopSpeech()">⏹ Arrêter</button>
            <button id="loopBtn" onclick="toggleLoop()">🔁 Boucle : OFF</button>
        </div>
    </div>

    <div class="stage">
        <div class="center-guide"></div>
        <div id="scroller"></div>
    </div>

    <!-- Floating camera widget with flash, switch, filter -->
    <div class="camera-float" id="cameraFloat" tabindex="0">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="camera-badge" id="cameraBadge">CAM LIVE</div>
        
        <div class="camera-controls">
            <button class="cam-btn" id="switchCamBtn" title="Changer caméra avant/arrière">🔄</button>
            <button class="cam-btn" id="flashBtn" title="Flash">⚡</button>
            <button class="cam-btn" id="filterBtn" title="Filtre lissant">✨</button>
        </div>
    </div>

    <script>
        // ---------- TTS LOGIC ----------
        const synth = window.speechSynthesis;
        let sentenceData = [];
        let currentIndex = 0;
        let repeatCounter = 0;
        let isPlaying = false;
        let isPaused = false;
        let isLooping = false;
        const ITEM_HEIGHT = 150; 

        function processText() {
            stopSpeech();
            const input = document.getElementById('textInput').value;
            const scroller = document.getElementById('scroller');
            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== "");

            scroller.innerHTML = "";
            sentenceData = [];

            lines.forEach((line, index) => {
                const isEnglish = index % 2 === 0;
                const langCode = isEnglish ? 'en-US' : 'fr-FR';
                const colorClass = isEnglish ? 'english' : 'french';
                const totalRepeats = isEnglish ? 3 : 2; 

                const div = document.createElement('div');
                div.className = `sentence-item ${colorClass}`;
                div.innerText = line;
                scroller.appendChild(div);

                sentenceData.push({ 
                    text: line, 
                    lang: langCode, 
                    element: div,
                    isEnglish: isEnglish,
                    maxRepeats: totalRepeats
                });
            });

            if (sentenceData.length > 0) {
                scroller.style.transform = `translateY(${-ITEM_HEIGHT / 2}px)`;
                document.getElementById('playBtn').disabled = false;
            }
        }

        function updateDisplay(index) {
            sentenceData.forEach(s => s.element.classList.remove('active'));
            const item = sentenceData[index];
            if (item) {
                item.element.classList.add('active');
                const offset = -(index * ITEM_HEIGHT) - (ITEM_HEIGHT / 2);
                document.getElementById('scroller').style.transform = `translateY(${offset}px)`;
            }
        }

        function speakStep() {
            if (!isPlaying || isPaused) return;

            if (currentIndex >= sentenceData.length) {
                if (isLooping) {
                    currentIndex = 0;
                    repeatCounter = 0;
                    setTimeout(speakStep, 1000);
                } else {
                    stopSpeech();
                }
                return;
            }

            const currentItem = sentenceData[currentIndex];
            updateDisplay(currentIndex);

            const utterance = new SpeechSynthesisUtterance(currentItem.text);
            utterance.lang = currentItem.lang;

            const voices = synth.getVoices();
            const voice = voices.find(v => v.lang.startsWith(currentItem.lang));
            if (voice) utterance.voice = voice;

            utterance.onend = () => {
                if (!isPlaying || isPaused) return;

                repeatCounter++;
                if (repeatCounter < currentItem.maxRepeats) {
                    setTimeout(speakStep, 400); 
                } else {
                    currentIndex++;
                    repeatCounter = 0;
                    setTimeout(speakStep, 800); 
                }
            };

            utterance.onerror = () => {
                if (isPlaying) stopSpeech();
            };

            synth.speak(utterance);
        }

        function startPlayAll() {
            if (sentenceData.length === 0) return;
            synth.cancel(); 
            isPlaying = true;
            isPaused = false;
            currentIndex = 0;
            repeatCounter = 0;
            
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'flex';
            document.getElementById('pauseBtn').innerText = "⏸ Pause";
            
            speakStep();
        }

        function togglePause() {
            if (!isPlaying) return;

            if (!isPaused) {
                isPaused = true;
                synth.pause();
                document.getElementById('pauseBtn').innerText = "▶ Reprendre";
            } else {
                isPaused = false;
                document.getElementById('pauseBtn').innerText = "⏸ Pause";
                if (synth.paused) {
                    synth.resume();
                } else {
                    speakStep();
                }
            }
        }

        function stopSpeech() {
            isPlaying = false;
            isPaused = false;
            synth.cancel();
            document.getElementById('playBtn').style.display = 'flex';
            document.getElementById('playBtn').disabled = (sentenceData.length === 0);
            document.getElementById('pauseBtn').style.display = 'none';
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = document.getElementById('loopBtn');
            if (isLooping) {
                btn.classList.add('active');
                btn.innerText = "🔁 Boucle : ON";
            } else {
                btn.classList.remove('active');
                btn.innerText = "🔁 Boucle : OFF";
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => synth.getVoices();
        }

        // ---------- FLOATING CAMERA with FLASH, SWITCH, FILTER ----------
        (function initFloatingCamera() {
            const videoEl = document.getElementById('cameraVideo');
            const floatContainer = document.getElementById('cameraFloat');
            const flashOverlay = document.getElementById('flashOverlay');
            const switchCamBtn = document.getElementById('switchCamBtn');
            const flashBtn = document.getElementById('flashBtn');
            const filterBtn = document.getElementById('filterBtn');
            
            let currentStream = null;
            let currentFacingMode = 'user'; // 'user' or 'environment'
            let flashEnabled = false; // flash effect (screen overlay)
            let filterEnabled = true; // smooth skin filter default ON
            let isDragging = false;
            let startX, startY, startLeft, startTop;
            let cameraAvailable = false;

            // ----- Camera management -----
            async function startCamera(facingMode = 'user') {
                // Stop previous stream
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }

                try {
                    const constraints = {
                        video: {
                            facingMode: facingMode,
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        },
                        audio: false
                    };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    currentStream = stream;
                    videoEl.srcObject = stream;
                    await videoEl.play();
                    cameraAvailable = true;
                    
                    // Apply mirror based on facing mode
                    if (facingMode === 'user') {
                        videoEl.style.transform = 'scaleX(-1)';
                    } else {
                        videoEl.style.transform = 'scaleX(1)';
                    }
                    
                    // Hide fallback if any
                    const fallback = floatContainer.querySelector('.camera-fallback');
                    if (fallback) fallback.remove();
                    videoEl.style.display = 'block';
                    
                    console.log(`Camera started (${facingMode})`);
                } catch (err) {
                    console.warn(`Camera ${facingMode} failed:`, err);
                    // If environment fails, try user
                    if (facingMode === 'environment') {
                        try {
                            await startCamera('user');
                            currentFacingMode = 'user';
                        } catch (err2) {
                            showCameraFallback(err2.message || 'Caméra indisponible');
                        }
                    } else {
                        showCameraFallback(err.message || 'Caméra indisponible');
                    }
                }
            }

            function showCameraFallback(message) {
                cameraAvailable = false;
                videoEl.style.display = 'none';
                // Remove existing fallback
                const existing = floatContainer.querySelector('.camera-fallback');
                if (existing) existing.remove();
                
                const fallback = document.createElement('div');
                fallback.className = 'camera-fallback';
                fallback.style.cssText = `
                    width: 100%; height: 100%; display: flex; flex-direction: column;
                    align-items: center; justify-content: center;
                    background: #1e1e1e; color: #ccc; font-size: 12px; 
                    text-align: center; padding: 10px; box-sizing: border-box; gap: 6px;
                `;
                fallback.innerHTML = `
                    <div style="font-size: 28px;">📷</div>
                    <div>${message}</div>
                    <div style="font-size: 10px; opacity: 0.7;">Vérifiez les permissions</div>
                `;
                floatContainer.appendChild(fallback);
            }

            // Check API
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                startCamera('user');
            } else {
                showCameraFallback('API caméra non supportée');
            }

            // Switch camera button
            switchCamBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (!cameraAvailable) return;
                const newMode = currentFacingMode === 'user' ? 'environment' : 'user';
                currentFacingMode = newMode;
                await startCamera(newMode);
            });

            // Flash button (screen flash effect)
            flashBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                flashEnabled = !flashEnabled;
                
                if (flashEnabled) {
                    // Trigger flash overlay
                    flashOverlay.classList.add('active');
                    setTimeout(() => {
                        flashOverlay.classList.remove('active');
                    }, 150);
                    
                    // Repeat flash a few times for effect
                    setTimeout(() => {
                        flashOverlay.classList.add('active');
                        setTimeout(() => flashOverlay.classList.remove('active'), 100);
                    }, 200);
                    
                    flashBtn.classList.add('flash-active');
                } else {
                    flashOverlay.classList.remove('active');
                    flashBtn.classList.remove('flash-active');
                }
            });

            // Filter button (smooth face)
            filterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                filterEnabled = !filterEnabled;
                if (filterEnabled) {
                    videoEl.style.filter = 'brightness(1.05) contrast(1.05) saturate(1.1) blur(0.3px)';
                    filterBtn.style.color = '#ffaa00';
                    filterBtn.textContent = '✨';
                } else {
                    videoEl.style.filter = 'none';
                    filterBtn.style.color = 'white';
                    filterBtn.textContent = '✨';
                }
            });
            // Set initial filter state
            if (filterEnabled) {
                videoEl.style.filter = 'brightness(1.05) contrast(1.05) saturate(1.1) blur(0.3px)';
                filterBtn.style.color = '#ffaa00';
            }

            // ---------- DRAGGABLE BEHAVIOR ----------
            function setInitialPosition() {
                const rect = floatContainer.getBoundingClientRect();
                floatContainer.style.bottom = 'auto';
                floatContainer.style.right = 'auto';
                floatContainer.style.left = rect.left + 'px';
                floatContainer.style.top = rect.top + 'px';
                floatContainer.style.position = 'fixed';
            }

            setInitialPosition();
            
            window.addEventListener('resize', () => {
                const rect = floatContainer.getBoundingClientRect();
                const maxLeft = window.innerWidth - rect.width;
                const maxTop = window.innerHeight - rect.height;
                let left = Math.min(parseFloat(floatContainer.style.left) || rect.left, maxLeft);
                let top = Math.min(parseFloat(floatContainer.style.top) || rect.top, maxTop);
                left = Math.max(0, left);
                top = Math.max(0, top);
                floatContainer.style.left = left + 'px';
                floatContainer.style.top = top + 'px';
            });

            floatContainer.addEventListener('mousedown', (e) => {
                // Ignore if clicking on buttons
                if (e.target.closest('.cam-btn')) return;
                e.preventDefault();
                isDragging = true;
                const rect = floatContainer.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                floatContainer.style.cursor = 'grabbing';
                floatContainer.style.transition = 'none';
                floatContainer.style.willChange = 'left, top';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                e.preventDefault();

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                let newLeft = startLeft + dx;
                let newTop = startTop + dy;

                const rect = floatContainer.getBoundingClientRect();
                const maxLeft = window.innerWidth - rect.width;
                const maxTop = window.innerHeight - rect.height;
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));

                floatContainer.style.left = newLeft + 'px';
                floatContainer.style.top = newTop + 'px';
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    floatContainer.style.cursor = 'grab';
                    floatContainer.style.transition = 'box-shadow 0.2s';
                    floatContainer.style.willChange = 'auto';
                }
            });

            // Touch support
            floatContainer.addEventListener('touchstart', (e) => {
                if (e.target.closest('.cam-btn')) return;
                const touch = e.touches[0];
                if (!touch) return;
                e.preventDefault();
                isDragging = true;
                const rect = floatContainer.getBoundingClientRect();
                startX = touch.clientX;
                startY = touch.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                floatContainer.style.cursor = 'grabbing';
                floatContainer.style.transition = 'none';
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                if (!touch) return;
                e.preventDefault();

                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                let newLeft = startLeft + dx;
                let newTop = startTop + dy;

                const rect = floatContainer.getBoundingClientRect();
                const maxLeft = window.innerWidth - rect.width;
                const maxTop = window.innerHeight - rect.height;
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));

                floatContainer.style.left = newLeft + 'px';
                floatContainer.style.top = newTop + 'px';
            }, { passive: false });

            window.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    floatContainer.style.cursor = 'grab';
                    floatContainer.style.transition = 'box-shadow 0.2s';
                }
            });

            floatContainer.style.cursor = 'grab';
        })();

        // Prefill sample text
        window.addEventListener('load', () => {
            const ta = document.getElementById('textInput');
            if (!ta.value) {
                ta.value = "Hello, how are you?\nBonjour, comment allez-vous ?\nI am learning English.\nJ'apprends l'anglais.";
            }
        });
    </script>
</body>
</html>
