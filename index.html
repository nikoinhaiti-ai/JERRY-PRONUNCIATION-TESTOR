<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floating Note</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@500&family=Playfair+Display:wght@500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', sans-serif;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }

  /* ===== THEME VARIABLES ===== */
  :root {
    --bg: rgba(24, 24, 28, 0.85);
    --text: #f0f0f0;
    --muted: #9a9aa2;
    --accent: #6ea8fe;
    --bar: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.10);
  }

  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    overflow: hidden;
    color: var(--text);
  }

  /* ===== TOP BAR (drag handle) ===== */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    cursor: grab;
  }
  .topbar:active { cursor: grabbing; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .title {
    font-size: 12.5px; font-weight: 600;
    color: var(--muted); margin-left: 6px;
    letter-spacing: .3px;
  }
  .spacer { flex: 1; }

  /* ===== BUTTONS ===== */
  button, select {
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s ease;
    outline: none;
  }
  button:hover, select:hover { background: rgba(255,255,255,0.14); }
  button:active { transform: translateY(1px); }
  button.danger { background: rgba(255,80,80,.15); border-color: rgba(255,80,80,.3); }
  button.danger:hover { background: rgba(255,80,80,.28); }

  /* ===== TOOLBAR ===== */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.15);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .group { display: flex; align-items: center; gap: 6px; }
  .group label { font-size: 11px; letter-spacing: .4px; text-transform: uppercase; opacity: .8; }

  input[type="color"] {
    width: 28px; height: 28px; padding: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 4px;
    background: rgba(255,255,255,0.18);
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff2;
  }

  /* ===== EDITOR ===== */
  #editor {
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    padding: 16px 18px;
    background: transparent;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    overflow-y: auto;
    user-select: text;
  }
  #editor::placeholder { color: var(--muted); opacity: .55; }

  /* scrollbar */
  #editor::-webkit-scrollbar { width: 8px; }
  #editor::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15); border-radius: 8px;
  }

  /* ===== RESIZE HANDLE ===== */
  .resizer {
    position: absolute;
    right: 2px; bottom: 2px;
    width: 18px; height: 18px;
    cursor: nwse-resize;
    opacity: .5;
  }
  .resizer::after {
    content: ""; position: absolute; right: 4px; bottom: 4px;
    width: 8px; height: 8px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    border-bottom-right-radius: 3px;
  }

  /* ===== LIGHT THEME ===== */
  body.light {
    --bg: rgba(250, 250, 252, 0.92);
    --text: #1a1a1e;
    --muted: #6b6b74;
    --accent: #3b82f6;
    --bar: rgba(0,0,0,0.04);
    --border: rgba(0,0,0,0.10);
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <div class="topbar" id="topbar">
      <span class="dot r"></span>
      <span class="dot y"></span>
      <span class="dot g"></span>
      <span class="title">✎ Floating Note</span>
      <div class="spacer"></div>
      <button id="themeBtn" title="Toggle light/dark">🌓</button>
      <button id="saveBtn">Save</button>
      <button id="clearBtn" class="danger">Clear</button>
    </div>

    <div class="toolbar">
      <div class="group">
        <label>Font</label>
        <select id="fontSelect">
          <option value="Inter">Inter</option>
          <option value="JetBrains Mono">JetBrains Mono</option>
          <option value="Poppins">Poppins</option>
          <option value="Playfair Display">Playfair Display</option>
          <option value="Caveat">Caveat (handwriting)</option>
          <option value="Georgia">Georgia</option>
          <option value="system-ui">System UI</option>
        </select>
      </div>

      <div class="group">
        <label>Size</label>
        <input type="range" id="sizeRange" min="12" max="36" value="15">
        <span id="sizeVal" style="min-width:28px;text-align:right;">15</span>
      </div>

      <div class="group">
        <label>Text</label>
        <input type="color" id="textColor" value="#f0f0f0">
      </div>

      <div class="group">
        <label>BG</label>
        <input type="color" id="bgColor" value="#18181c">
      </div>

      <div class="group">
        <label>Opacity</label>
        <input type="range" id="opacity" min="20" max="100" value="85">
      </div>
    </div>

    <textarea id="editor" placeholder="Start typing… everything saves automatically."></textarea>

    <div class="resizer" id="resizer"></div>
  </div>

<script>
  // ===== Load saved settings & text =====
  const LS = {
    text: 'fn_text',
    font: 'fn_font',
    size: 'fn_size',
    textColor: 'fn_textcolor',
    bgColor: 'fn_bgcolor',
    opacity: 'fn_opacity',
    theme: 'fn_theme',
    width: 'fn_w', height: 'fn_h'
  };
  const $ = id => document.getElementById(id);

  const editor = $('editor');
  const app = $('app');
  const sizeRange = $('sizeRange');
  const sizeVal = $('sizeVal');
  const opacity = $('opacity');

  // Restore
  editor.value = localStorage.getItem(LS.text) || '';
  editor.style.fontFamily = `'${localStorage.getItem(LS.font) || 'Inter'}', sans-serif`;
  $('fontSelect').value = localStorage.getItem(LS.font) || 'Inter';
  const sz = localStorage.getItem(LS.size) || 15;
  editor.style.fontSize = sz + 'px';
  sizeRange.value = sz; sizeVal.textContent = sz;

  const tc = localStorage.getItem(LS.textColor);
  if (tc) { editor.style.color = tc; $('textColor').value = tc; }
  const bc = localStorage.getItem(LS.bgColor);
  if (bc) { app.style.background = hexToRgba(bc, (localStorage.getItem(LS.opacity)||85)/100); $('bgColor').value = bc; }
  const op = localStorage.getItem(LS.opacity) || 85;
  opacity.value = op;
  applyOpacity(op);

  if (localStorage.getItem(LS.theme) === 'light') document.body.classList.add('light');
  if (localStorage.getItem(LS.width)) {
    document.body.style.width = localStorage.getItem(LS.width) + 'px';
    document.body.style.height = localStorage.getItem(LS.height) + 'px';
  }

  // ===== Auto-save text =====
  let saveTimer;
  editor.addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      localStorage.setItem(LS.text, editor.value);
    }, 200);
  });

  // ===== Font family =====
  $('fontSelect').addEventListener('change', e => {
    const f = e.target.value;
    editor.style.fontFamily = `'${f}', sans-serif`;
    localStorage.setItem(LS.font, f);
  });

  // ===== Font size =====
  sizeRange.addEventListener('input', e => {
    editor.style.fontSize = e.target.value + 'px';
    sizeVal.textContent = e.target.value;
    localStorage.setItem(LS.size, e.target.value);
  });

  // ===== Text color =====
  $('textColor').addEventListener('input', e => {
    editor.style.color = e.target.value;
    localStorage.setItem(LS.textColor, e.target.value);
  });

  // ===== BG color =====
  $('bgColor').addEventListener('input', e => {
    applyOpacity(opacity.value, e.target.value);
    localStorage.setItem(LS.bgColor, e.target.value);
  });

  // ===== Opacity =====
  opacity.addEventListener('input', e => {
    applyOpacity(e.target.value);
    localStorage.setItem(LS.opacity, e.target.value);
  });

  function applyOpacity(alphaPct, bgOverride) {
    const bgHex = bgOverride || $('bgColor').value;
    const a = alphaPct / 100;
    app.style.background = hexToRgba(bgHex, a);
    app.style.backdropFilter = `blur(${a < 0.5 ? 8 : 18}px) saturate(140%)`;
    app.style.webkitBackdropFilter = app.style.backdropFilter;
  }

  function hexToRgba(hex, a) {
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16);
    const g = parseInt(h.substring(2,4),16);
    const b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // ===== Save to file =====
  $('saveBtn').addEventListener('click', () => {
    const blob = new Blob([editor.value], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'note.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ===== Clear =====
  $('clearBtn').addEventListener('click', () => {
    if (editor.value.trim() && !confirm('Clear the note?')) return;
    editor.value = '';
    localStorage.removeItem(LS.text);
    editor.focus();
  });

  // ===== Theme toggle =====
  $('themeBtn').addEventListener('click', () => {
    document.body.classList.toggle('light');
    localStorage.setItem(LS.theme, document.body.classList.contains('light') ? 'light' : 'dark');
  });

  // ===== Drag to move (uses window.moveTo in opened window) =====
  const topbar = $('topbar');
  let dragStart = null;
  topbar.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    // Only try to move if opened as popup window
    dragStart = { x: e.screenX, y: e.screenY,
                  winX: window.screenX, winY: window.screenY };
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragStart) return;
    try {
      window.moveTo(
        dragStart.winX + (e.screenX - dragStart.x),
        dragStart.winY + (e.screenY - dragStart.y)
      );
    } catch(_) {}
  });
  window.addEventListener('mouseup', () => dragStart = null);

  // ===== Resize handle =====
  const resizer = $('resizer');
  let rz = null;
  resizer.addEventListener('mousedown', e => {
    rz = { x: e.screenX, y: e.screenY,
           w: document.body.offsetWidth, h: document.body.offsetHeight };
    e.preventDefault(); e.stopPropagation();
  });
  window.addEventListener('mousemove', e => {
    if (!rz) return;
    const w = Math.max(260, rz.w + (e.screenX - rz.x));
    const h = Math.max(200, rz.h + (e.screenY - rz.y));
    document.body.style.width = w + 'px';
    document.body.style.height = h + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (rz) {
      localStorage.setItem(LS.width, document.body.offsetWidth);
      localStorage.setItem(LS.height, document.body.offsetHeight);
      rz = null;
    }
  });

  editor.focus();
</script>
</body>
</html>
