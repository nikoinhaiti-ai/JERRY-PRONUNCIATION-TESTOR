      <div class="modal-actions">
        <button class="btn" id="modalDiscard">Discard</button>
        <button class="btn primary" id="modalDownload">⬇ Download</button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  const KEY = "camera-split-fx-v3";

  /* ============================================================
     Filters
  ============================================================ */
  const FILTERS = [
    { id: "none",   label: "None",       emoji: "🚫" },
    { id: "dog",    label: "Dog",        emoji: "🐶" },
    { id: "shades", label: "Shades",     emoji: "🕶️" },
    { id: "stache", label: "Mustache",   emoji: "👨" },
    { id: "crown",  label: "Crown",      emoji: "👑" },
    { id: "bunny",  label: "Bunny",      emoji: "🐰" },
    { id: "heart",  label: "Heart Eyes", emoji: "😍" },
    { id: "pirate", label: "Pirate",     emoji: "🏴☠️" }
  ];

  const LMK = {
    L_EYE_OUT: 33,  L_EYE_IN: 133,  L_EYE_TOP: 159, L_EYE_BOT: 145,
    R_EYE_OUT: 263, R_EYE_IN: 362,  R_EYE_TOP: 386, R_EYE_BOT: 374,
    NOSE: 1, NOSE_BRIDGE: 168,
    FOREHEAD: 10, CHIN: 152,
    L_CHEEK: 234, R_CHEEK: 454,
    MOUTH_L: 61, MOUTH_R: 291, MOUTH_TOP: 13, MOUTH_BOT: 14
  };

  const BEAUTY_LABELS = ["✨", "✨¹", "✨²"];
  const BEAUTY_TITLES = [
    "Beauty: off",
    "Beauty: soft (skin smoothing)",
    "Beauty: smooth (extra glow + eye light)"
  ];
  const BEAUTY_GRADE = [
    "none",
    "brightness(1.05) contrast(1.02) saturate(1.05)",
    "brightness(1.08) contrast(1.03) saturate(1.09)"
  ];

  /* ============================================================
     State
  ============================================================ */
  function defaults() {
    return {
      layout: window.matchMedia("(max-width: 760px)").matches ? "horizontal" : "vertical",
      ratio: 0.5,
      camFirst: true,
      mirrored: true,
      deviceId: "",
      filter: "none",
      beauty: 0,
      flash: false,
      mic: false,          // microphone for recording
      recFps: 30,
      content: {
        mode: "web",
        url: "https://en.wikipedia.org/wiki/Main_Page",
        note: ""
      }
    };
  }

  function load() {
    const d = defaults();
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return d;
      const p = JSON.parse(raw);
      return {
        layout: (p.layout === "horizontal" || p.layout === "vertical") ? p.layout : d.layout,
        ratio: Number.isFinite(+p.ratio) ? clamp(+p.ratio, 0.12, 0.88) : 0.5,
        camFirst: p.camFirst !== false,
        mirrored: p.mirrored !== false,
        deviceId: typeof p.deviceId === "string" ? p.deviceId : "",
        filter: FILTERS.some(f => f.id === p.filter) ? p.filter : "none",
        beauty: [0,1,2].includes(+p.beauty) ? +p.beauty : 0,
        flash: p.flash === true,
        mic: p.mic === true,
        recFps: [24,30,60].includes(+p.recFps) ? +p.recFps : 30,
        content: {
          mode: p.content && p.content.mode === "note" ? "note" : "web",
          url: p.content && typeof p.content.url === "string" ? p.content.url : d.content.url,
          note: p.content && typeof p.content.note === "string" ? p.content.note : ""
        }
      };
    } catch (e) { return d; }
  }

  let state = load();

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }, 280);
  }

  /* ============================================================
     DOM
  ============================================================ */
  const stage       = document.getElementById("stage");
  const camPane     = document.getElementById("camPane");
  const contentPane = document.getElementById("contentPane");
  const camWrap     = document.getElementById("camWrap");

  const video       = document.getElementById("video");
  const fxCanvas    = document.getElementById("fxCanvas");
  const fxCtx       = fxCanvas.getContext("2d");
  const screenFlash = document.getElementById("screenFlash");

  const recDot      = document.getElementById("recDot");
  const camSelect   = document.getElementById("camSelect");
  const camToggle   = document.getElementById("camToggle");
  const micToggle   = document.getElementById("micToggle");
  const camState    = document.getElementById("camState");
  const csIcon      = document.getElementById("csIcon");
  const csText      = document.getElementById("csText");
  const csBtn       = document.getElementById("csBtn");
  const flash       = document.getElementById("flash");
  const fxStatus    = document.getElementById("fxStatus");
  const filterStrip = document.getElementById("filterStrip");
  const recTimer    = document.getElementById("recTimer");
  const recTime     = document.getElementById("recTime");
  const recMicFlag  = document.getElementById("recMicFlag");

  const btnBeauty   = document.getElementById("btnBeauty");
  const btnFlash    = document.getElementById("btnFlash");
  const btnMirror   = document.getElementById("btnMirror");
  const btnFlip     = document.getElementById("btnFlip");
  const btnSnap     = document.getElementById("btnSnap");
  const btnRec      = document.getElementById("btnRec");
  const btnFull     = document.getElementById("btnFull");

  const contentBody = document.getElementById("contentBody");
  const frame       = document.getElementById("frame");
  const note        = document.getElementById("note");
  const urlForm     = document.getElementById("urlForm");
  const urlInput    = document.getElementById("urlInput");

  const modal       = document.getElementById("modal");
  const modalImg    = document.getElementById("modalImg");
  const modalVideo  = document.getElementById("modalVideo");
  const modalMeta   = document.getElementById("modalMeta");
  const modalIcon   = document.getElementById("modalIcon");
  const modalTitle  = document.getElementById("modalTitle");
  const metaDuration= document.getElementById("metaDuration");
  const metaSize    = document.getElementById("metaSize");
  const metaType    = document.getElementById("metaType");

  const layoutBtn   = document.querySelector('[data-act="layout"]');
  const swapBtn     = document.querySelector('[data-act="swap"]');
  const snapTopBtn  = document.querySelector('[data-act="snapshot"]');
  const recTopBtn   = document.getElementById("recTopBtn");
  const resetBtn    = document.querySelector('[data-act="reset"]');

  /* ============================================================
     Divider
  ============================================================ */
  const divider = document.createElement("div");
  divider.className = "divider";
  divider.tabIndex = 0;
  divider.setAttribute("role", "separator");
  divider.setAttribute("aria-label", "Resize panes");
  divider.title = "Drag to resize · double-click to reset";

  function mountPanes() {
    if (state.camFirst) {
      stage.appendChild(camPane); stage.appendChild(divider); stage.appendChild(contentPane);
    } else {
      stage.appendChild(contentPane); stage.appendChild(divider); stage.appendChild(camPane);
    }
  }

  function applyLayout() {
    stage.dataset.layout = state.layout;
    stage.style.setProperty("--a", (state.ratio * 100).toFixed(3) + "%");
    divider.setAttribute("aria-orientation", state.layout === "vertical" ? "vertical" : "horizontal");

    const vert = state.layout === "vertical";
    layoutBtn.querySelector(".glyph").textContent = vert ? "▥" : "▤";
    layoutBtn.querySelector(".label").textContent = vert ? "Side by side" : "Stacked";
    layoutBtn.title = vert ? "Switch to stacked layout" : "Switch to side-by-side layout";
  }

  let dragging = false;
  function setRatio(r) {
    state.ratio = clamp(r, 0.12, 0.88);
    stage.style.setProperty("--a", (state.ratio * 100).toFixed(3) + "%");
  }
  function ratioFromPointer(e) {
    const s = stage.getBoundingClientRect();
    const d = divider.getBoundingClientRect();
    if (state.layout === "vertical") {
      const avail = s.width - d.width;
      return (e.clientX - s.left - d.width / 2) / avail;
    }
    const avail = s.height - d.height;
    return (e.clientY - s.top - d.height / 2) / avail;
  }
  divider.addEventListener("pointerdown", e => {
    dragging = true;
    divider.setPointerCapture(e.pointerId);
    divider.classList.add("dragging");
    document.body.style.userSelect = "none";
    document.body.style.cursor = state.layout === "vertical" ? "col-resize" : "row-resize";
    e.preventDefault();
  });
  divider.addEventListener("pointermove", e => { if (dragging) setRatio(ratioFromPointer(e)); });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove("dragging");
    document.body.style.userSelect = "";
    document.body.style.cursor = "";
    save();
  }
  divider.addEventListener("pointerup", endDrag);
  divider.addEventListener("pointercancel", endDrag);
  divider.addEventListener("dblclick", () => { setRatio(0.5); save(); });
  divider.addEventListener("keydown", e => {
    const step = e.shiftKey ? 0.05 : 0.02;
    const fwd  = state.layout === "vertical" ? "ArrowRight" : "ArrowDown";
    const back = state.layout === "vertical" ? "ArrowLeft"  : "ArrowUp";
    if (e.key === fwd)        { setRatio(state.ratio + step); e.preventDefault(); save(); }
    else if (e.key === back)  { setRatio(state.ratio - step); e.preventDefault(); save(); }
    else if (e.key === "Home"){ setRatio(0.5); e.preventDefault(); save(); }
  });

  /* ============================================================
     CAMERA
  ============================================================ */
  let stream = null;
  let starting = false;
  let devices = [];
  let hasTorch = false;

  function showState(icon, text, btnLabel, isError) {
    csIcon.textContent = icon;
    csText.textContent = text;
    csText.className = isError ? "cs-err" : "";
    csBtn.textContent = btnLabel || "Start camera";
    csBtn.style.display = btnLabel === null ? "none" : "";
    camState.classList.add("show");
  }
  function hideState() { camState.classList.remove("show"); }

  function setLive(on) {
    recDot.classList.toggle("on", on && !recorder.isRecording);
    camToggle.classList.toggle("on", on);
    camToggle.title = on ? "Stop camera" : "Start camera";
    btnSnap.disabled = !on;
    btnFlip.disabled = !on || devices.length < 2;
    btnFlash.disabled = !on;
    btnBeauty.disabled = !on;
    btnRec.disabled = !on;
    recTopBtn.disabled = !on;
  }

  async function applyTorch(on) {
    if (!stream) return false;
    const track = stream.getVideoTracks()[0];
    if (!track) return false;
    try {
      await track.applyConstraints({ advanced: [{ torch: !!on }] });
      return true;
    } catch (e) { return false; }
  }

  function stopCamera() {
    if (recorder.isRecording) stopRecording();

    if (stream) {
      const track = stream.getVideoTracks()[0];
      if (track) { try { track.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {} }
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;
    hasTorch = false;
    screenFlash.classList.remove("on", "burst");
    setLive(false);
    updateFlashUI();
  }

  function friendlyError(err) {
    const n = err && err.name;
    if (n === "NotAllowedError" || n === "SecurityError")
      return "Camera permission was denied. Allow access in your browser settings and try again.";
    if (n === "NotFoundError" || n === "DevicesNotFoundError")
      return "No camera was found on this device.";
    if (n === "NotReadableError" || n === "TrackStartError")
      return "The camera is already in use by another app or tab.";
    if (n === "OverconstrainedError")
      return "The selected camera does not support the requested settings.";
    return "Could not start the camera. " + (err && err.message ? err.message : "");
  }

  async function startCamera(deviceId) {
    if (starting) return;
    starting = true;
    hideState();

    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Media devices are not supported in this browser.");
      }

      stopCamera();
      lastLandmarks = null;

      const constraints = {
        audio: false,
        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "user" }
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;

      if (video.readyState < 1) {
        await new Promise(res => {
          const done = () => { video.removeEventListener("loadedmetadata", done); res(); };
          video.addEventListener("loadedmetadata", done);
          setTimeout(res, 1200);
        });
      }

      try { await video.play(); } catch (e) {}

      const track = stream.getVideoTracks()[0];
      try {
        const caps = track && track.getCapabilities ? track.getCapabilities() : {};
        hasTorch = !!caps.torch;
      } catch (e) { hasTorch = false; }

      const settings = track && track.getSettings ? track.getSettings() : {};
      if (settings.deviceId) { state.deviceId = settings.deviceId; save(); }

      await refreshDevices(settings.deviceId);
      setLive(true);
      hideState();

      if (state.flash) {
        if (hasTorch) {
          await applyTorch(true);
        } else {
          screenFlash.classList.add("on");
        }
      }
      updateFlashUI();
      ensureLoop();

    } catch (err) {
      stopCamera();
      showState("🚫", friendlyError(err), "Try again", true);
      console.warn("[camera]", err);
    } finally {
      starting = false;
    }
  }

  async function refreshDevices(activeId) {
    try {
      const all = await navigator.mediaDevices.enumerateDevices();
      devices = all.filter(d => d.kind === "videoinput");
      camSelect.innerHTML = "";

      if (!devices.length) {
        const o = document.createElement("option");
        o.textContent = "No camera";
        camSelect.appendChild(o);
        camSelect.disabled = true;
        return;
      }

      camSelect.disabled = false;
      devices.forEach((d, i) => {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || ("Camera " + (i + 1));
        camSelect.appendChild(o);
      });

      const pick = activeId || state.deviceId;
      camSelect.value = (pick && devices.some(d => d.deviceId === pick))
        ? pick : devices[0].deviceId;

      setLive(!!stream);
    } catch (e) {
      camSelect.disabled = true;
    }
  }

  function toggleCamera() {
    if (stream) {
      stopCamera();
      showState("🎥", "Camera is off.", "Start camera", false);
      save();
    } else {
      startCamera(state.deviceId || "");
    }
  }

  function flipCamera() {
    if (!stream || devices.length < 2) return;
    if (recorder.isRecording) return; // don't swap mid-recording
    let i = devices.findIndex(d => d.deviceId === camSelect.value);
    if (i === -1) i = 0;
    const next = devices[(i + 1) % devices.length];
    camSelect.value = next.deviceId;
    state.deviceId = next.deviceId;
    save();
    startCamera(next.deviceId);
  }

  function applyMirror() {
    video.classList.toggle("mirror", !!state.mirrored);
    btnMirror.classList.toggle("on", !!state.mirrored);
  }

  /* ============================================================
     FLASH
  ============================================================ */
  function updateFlashUI() {
    btnFlash.classList.toggle("on", !!state.flash);
    if (!stream) { btnFlash.title = "Flash (start the camera first)"; return; }
    btnFlash.title = hasTorch
      ? (state.flash ? "Flash: LED on (tap to turn off)" : "Flash: tap to turn on LED")
      : (state.flash ? "Fill light: on (screen flash)" : "Fill light: tap to use the screen as a warm flash");
  }

  async function toggleFlash() {
    if (!stream) return;
    state.flash = !state.flash;
    save();

    if (state.flash) {
      if (hasTorch) {
        const ok = await applyTorch(true);
        if (!ok) { hasTorch = false; screenFlash.classList.add("on"); }
      } else {
        screenFlash.classList.add("on");
      }
    } else {
      if (hasTorch) await applyTorch(false);
      screenFlash.classList.remove("on");
    }
    updateFlashUI();
  }

  /* ============================================================
     BEAUTY
  ============================================================ */
  const blurCanvas = document.createElement("canvas");
  const blurCtx = blurCanvas.getContext("2d");

  function updateBeautyUI() {
    btnBeauty.textContent = BEAUTY_LABELS[state.beauty];
    btnBeauty.classList.toggle("on", state.beauty > 0);
    btnBeauty.title = BEAUTY_TITLES[state.beauty];
  }

  function cycleBeauty() {
    state.beauty = (state.beauty + 1) % 3;
    save();
    updateBeautyUI();
  }

  /* ============================================================
     FACE TRACKING
  ============================================================ */
  let faceLandmarker = null;
  let fxLoadFailed   = false;
  let fxLoading      = false;
  let lastLandmarks  = null;
  let lastDetectAt   = 0;

  async function initFaceTracking() {
    if (faceLandmarker || fxLoadFailed || fxLoading) return;
    if (state.filter === "none") return;
    fxLoading = true;
    updateFxStatus();

    try {
      const vision = await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
      );

      const fileset = await vision.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      const baseOpts = {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
      };

      let landmarker;
      try {
        landmarker = await vision.FaceLandmarker.createFromOptions(fileset, {
          baseOptions: Object.assign({ delegate: "GPU" }, baseOpts),
          runningMode: "VIDEO",
          numFaces: 1
        });
      } catch (gpuErr) {
        console.warn("[filters] GPU delegate failed, falling back to CPU", gpuErr);
        landmarker = await vision.FaceLandmarker.createFromOptions(fileset, {
          baseOptions: Object.assign({ delegate: "CPU" }, baseOpts),
          runningMode: "VIDEO",
          numFaces: 1
        });
      }

      faceLandmarker = landmarker;
      console.log("[filters] Face tracking ready");
    } catch (err) {
      fxLoadFailed = true;
      console.warn("[filters] Face tracking unavailable:", err);
    } finally {
      fxLoading = false;
      updateFxStatus();
    }
  }

  function updateFxStatus() {
    if (state.filter === "none" || !stream) { fxStatus.classList.remove("show"); return; }
    if (faceLandmarker) { fxStatus.classList.remove("show"); return; }
    fxStatus.classList.add("show");
    fxStatus.innerHTML = fxLoadFailed
      ? "⚠️ Filters unavailable"
      : '<span class="spinner"></span> Loading face tracking…';
  }

  /* ============================================================
     Projection
  ============================================================ */
  function makeProjector(vw, vh, tw, th, mirrored) {
    const scale = Math.max(tw / vw, th / vh);
    const dw = vw * scale, dh = vh * scale;
    const ox = (tw - dw) / 2, oy = (th - dh) / 2;
    return (lm) => {
      let x = lm.x * vw;
      const y = lm.y * vh;
      if (mirrored) x = vw - x;
      return { x: x * scale + ox, y: y * scale + oy };
    };
  }

  function coverRect(vw, vh, tw, th) {
    const scale = Math.max(tw / vw, th / vh);
    const dw = vw * scale, dh = vh * scale;
    return { dx: (tw - dw) / 2, dy: (th - dh) / 2, dw, dh };
  }

  let fxW = 1, fxH = 1, fxDpr = 1;

  function resizeFx() {
    const rect = camWrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    if (w === fxW && h === fxH && dpr === fxDpr) return;
    fxW = w; fxH = h; fxDpr = dpr;
    fxCanvas.width  = Math.round(w * dpr);
    fxCanvas.height = Math.round(h * dpr);
    fxCanvas.style.width  = w + "px";
    fxCanvas.style.height = h + "px";
  }

  /* ============================================================
     Drawing helpers
  ============================================================ */
  function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSparkle(ctx, cx, cy, r, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.2, r * 0.18);
    ctx.lineCap = "round";
    ctx.shadowColor = color;
    ctx.shadowBlur = r * 0.9;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.stroke();
    const d = r * 0.55;
    ctx.beginPath();
    ctx.moveTo(cx - d, cy - d); ctx.lineTo(cx + d, cy + d);
    ctx.moveTo(cx + d, cy - d); ctx.lineTo(cx - d, cy + d);
    ctx.stroke();
    ctx.restore();
  }

  /* ============================================================
     BEAUTY
  ============================================================ */
  function drawSoftFocus(ctx, tw, th, level, mirrored) {
    if (level <= 0) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;

    const bw = Math.max(1, Math.round(tw / 3));
    const bh = Math.max(1, Math.round(th / 3));

    if (blurCanvas.width !== bw || blurCanvas.height !== bh) {
      blurCanvas.width = bw; blurCanvas.height = bh;
    }

    const r = coverRect(vw, vh, tw, th);
    const s = bw / tw;

    blurCtx.setTransform(1, 0, 0, 1, 0, 0);
    blurCtx.clearRect(0, 0, bw, bh);
    blurCtx.save();
    if (mirrored) { blurCtx.translate(bw, 0); blurCtx.scale(-1, 1); }
    blurCtx.drawImage(video, r.dx * s, r.dy * s, r.dw * s, r.dh * s);
    blurCtx.restore();

    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.globalAlpha = level === 1 ? 0.40 : 0.58;
    ctx.drawImage(blurCanvas, 0, 0, bw, bh, 0, 0, tw, th);
    ctx.restore();

    if (level >= 2) {
      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = 0.16;
      ctx.drawImage(blurCanvas, 0, 0, bw, bh, 0, 0, tw, th);
      ctx.restore();
    }
  }

  function drawEyeBrighten(ctx, lm, P, level) {
    const lEye = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rEye = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const eyeDist = dist(lEye, rEye);
    const radius = eyeDist * (level >= 2 ? 0.52 : 0.42);

    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = level >= 2 ? 0.20 : 0.12;

    for (const e of [lEye, rEye]) {
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, radius);
      g.addColorStop(0,    "rgba(255,251,242,0.95)");
      g.addColorStop(0.45, "rgba(255,246,232,0.32)");
      g.addColorStop(1,    "rgba(255,246,232,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(e.x, e.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ============================================================
     FILTER RENDERERS
  ============================================================ */
  function fxShades(ctx, lm, P) {
    const lc = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rc = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const c  = mid(lc, rc);
    const eyeDist = dist(lc, rc);
    const ang = Math.atan2(rc.y - lc.y, rc.x - lc.x);

    const lensW = eyeDist * 0.66;
    const lensH = lensW * 0.78;
    const gap   = eyeDist * 0.10;

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(ang);

    ctx.fillStyle = "#0a0a0f";
    ctx.fillRect(-gap, -lensH * 0.06, gap * 2, lensH * 0.13);

    const lensGrad = ctx.createLinearGradient(0, -lensH / 2, 0, lensH / 2);
    lensGrad.addColorStop(0,    "rgba(28,32,50,0.96)");
    lensGrad.addColorStop(0.42, "rgba(62,80,118,0.94)");
    lensGrad.addColorStop(1,    "rgba(8,10,20,0.96)");

    const drawLens = (cx, fill) => {
      roundRect(ctx, cx - lensW / 2, -lensH / 2, lensW, lensH, lensH * 0.34);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); } else ctx.stroke();
    };

    drawLens(-eyeDist / 2, lensGrad);
    drawLens( eyeDist / 2, lensGrad);

    ctx.strokeStyle = "rgba(0,0,0,0.9)";
    ctx.lineWidth = Math.max(2, lensH * 0.085);
    drawLens(-eyeDist / 2);
    drawLens( eyeDist / 2);

    ctx.fillStyle = "rgba(255,255,255,0.2)";
    ctx.beginPath();
    ctx.ellipse(-eyeDist / 2 - lensW * 0.16, -lensH * 0.22, lensW * 0.2, lensH * 0.13, -0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse( eyeDist / 2 - lensW * 0.16, -lensH * 0.22, lensW * 0.2, lensH * 0.13, -0.42, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#0a0a0f";
    ctx.lineWidth = Math.max(2, lensH * 0.1);
    ctx.beginPath();
    ctx.moveTo(-eyeDist / 2 - lensW / 2, -lensH * 0.1);
    ctx.lineTo(-eyeDist / 2 - lensW / 2 - eyeDist * 0.32, -lensH * 0.02);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo( eyeDist / 2 + lensW / 2, -lensH * 0.1);
    ctx.lineTo( eyeDist / 2 + lensW / 2 + eyeDist * 0.32, -lensH * 0.02);
    ctx.stroke();

    ctx.restore();
  }

  function fxDog(ctx, lm, P) {
    const top   = P(LMK.FOREHEAD);
    const chin  = P(LMK.CHIN);
    const lc    = P(LMK.L_CHEEK);
    const rc    = P(LMK.R_CHEEK);
    const nose  = P(LMK.NOSE);
    const mouthB= P(LMK.MOUTH_BOT);

    const faceW = dist(lc, rc);
    const faceH = dist(top, chin);

    const drawEar = (cx, cy, dir) => {
      const w = faceW * 0.32;
      const h = faceH * 0.54;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(dir * 0.28);

      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#8a5a30");
      g.addColorStop(1, "#43260f");
      ctx.fillStyle = g;

      ctx.beginPath();
      ctx.moveTo(-w * 0.14, 0);
      ctx.bezierCurveTo(-w * 0.72, h * 0.15, -w * 0.62, h * 0.86, -w * 0.08, h);
      ctx.bezierCurveTo( w * 0.36, h * 0.86,  w * 0.44, h * 0.2,  w * 0.16, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(50,22,8,0.55)";
      ctx.beginPath();
      ctx.moveTo(0, h * 0.13);
      ctx.bezierCurveTo(-w * 0.42, h * 0.26, -w * 0.36, h * 0.76, 0, h * 0.88);
      ctx.bezierCurveTo( w * 0.22, h * 0.74,  w * 0.24, h * 0.28, 0, h * 0.13);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    };

    const earY = top.y + faceH * 0.05;
    drawEar(lc.x + faceW * 0.05, earY, -1);
    drawEar(rc.x - faceW * 0.05, earY, +1);

    const nx = nose.x;
    const ny = nose.y + faceH * 0.035;
    const nw = faceW * 0.17;
    const nh = nw * 0.74;

    ctx.save();
    ctx.translate(nx, ny);
    const ng = ctx.createRadialGradient(-nw * 0.16, -nh * 0.22, nh * 0.04, 0, 0, nw * 0.72);
    ng.addColorStop(0, "#55555e");
    ng.addColorStop(1, "#08080c");
    ctx.fillStyle = ng;
    ctx.beginPath();
    ctx.ellipse(0, 0, nw / 2, nh / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath();
    ctx.ellipse(-nw * 0.15, -nh * 0.2, nw * 0.11, nh * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "rgba(0,0,0,0.55)";
    for (let s = -1; s <= 1; s += 2) {
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(
          nx + s * nw * 0.62,
          ny + (i - 1) * nh * 0.34 + nh * 0.12,
          Math.max(1, nw * 0.045), 0, Math.PI * 2
        );
        ctx.fill();
      }
    }

    const tW = faceW * 0.14;
    const tH = faceH * 0.14;
    ctx.fillStyle = "#ff5b7a";
    ctx.beginPath();
    ctx.ellipse(mouthB.x, mouthB.y + tH * 0.32, tW / 2, tH / 2, 0, 0, Math.PI);
    ctx.fill();
    ctx.strokeStyle = "rgba(150,20,50,0.7)";
    ctx.lineWidth = Math.max(1, tW * 0.06);
    ctx.beginPath();
    ctx.moveTo(mouthB.x, mouthB.y + tH * 0.32);
    ctx.lineTo(mouthB.x, mouthB.y + tH * 0.82);
    ctx.stroke();
  }

  function fxStache(ctx, lm, P) {
    const ml = P(LMK.MOUTH_L);
    const mr = P(LMK.MOUTH_R);
    const c  = mid(ml, mr);
    const mouthW = dist(ml, mr);
    const ang = Math.atan2(mr.y - ml.y, mr.x - ml.x);

    const w = mouthW * 1.2;
    const h = mouthW * 0.36;

    ctx.save();
    ctx.translate(c.x, c.y - h * 0.5);
    ctx.rotate(ang);

    ctx.fillStyle = "#1a1210";
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.05);
    ctx.bezierCurveTo(-w * 0.18, -h * 0.72, -w * 0.45, -h * 0.88, -w * 0.5, -h * 0.15);
    ctx.bezierCurveTo(-w * 0.53,  h * 0.38, -w * 0.34,  h * 0.45, -w * 0.2, h * 0.05);
    ctx.bezierCurveTo(-w * 0.12, -h * 0.16, -w * 0.06, -h * 0.06, 0, -h * 0.05);
    ctx.bezierCurveTo( w * 0.06, -h * 0.06,  w * 0.12, -h * 0.16,  w * 0.2, h * 0.05);
    ctx.bezierCurveTo( w * 0.34,  h * 0.45,  w * 0.53,  h * 0.38,  w * 0.5, -h * 0.15);
    ctx.bezierCurveTo( w * 0.45, -h * 0.88,  w * 0.18, -h * 0.72, 0, -h * 0.05);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(100,78,60,0.35)";
    ctx.beginPath();
    ctx.ellipse(-w * 0.26, -h * 0.38, w * 0.12, h * 0.1, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse( w * 0.26, -h * 0.38, w * 0.12, h * 0.1,  0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function fxCrown(ctx, lm, P) {
    const top = P(LMK.FOREHEAD);
    const lc  = P(LMK.L_CHEEK);
    const rc  = P(LMK.R_CHEEK);
    const faceW = dist(lc, rc);
    const faceH = dist(top, P(LMK.CHIN));

    const lc2 = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rc2 = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const tilt = Math.atan2(rc2.y - lc2.y, rc2.x - lc2.x) * 0.6;

    const w = faceW * 0.9;
    const h = w * 0.42;
    const baseY = top.y - faceH * 0.02;

    ctx.save();
    ctx.translate(top.x, baseY);
    ctx.rotate(tilt);

    const x0 = -w / 2;

    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.lineTo(x0, -h * 0.16);
    for (let i = 0; i < 5; i++) {
      const sx = x0 + i * (w / 5);
      const ex = sx + w / 5;
      const peakH = -h * (i % 2 === 0 ? 1 : 0.74);
      ctx.lineTo(sx + w / 10, peakH);
      ctx.lineTo(ex, -h * 0.16);
    }
    ctx.lineTo(x0 + w, 0);
    ctx.closePath();

    const g = ctx.createLinearGradient(0, -h, 0, 0);
    g.addColorStop(0,    "#ffe98a");
    g.addColorStop(0.45, "#ffcb2e");
    g.addColorStop(1,    "#c98600");
    ctx.fillStyle = g;
    ctx.fill();

    ctx.strokeStyle = "#8a5c00";
    ctx.lineWidth = Math.max(1.5, w * 0.012);
    ctx.stroke();

    ctx.fillStyle = "#b8791a";
    ctx.fillRect(x0, -h * 0.16, w, h * 0.18);

    const jewels = ["#ff3b6b", "#4f8ef7", "#34d399", "#a78bfa", "#fbbf24"];
    for (let i = 0; i < 5; i++) {
      const jx = x0 + (i + 0.5) * (w / 5);
      ctx.fillStyle = jewels[i];
      ctx.beginPath();
      ctx.arc(jx, -h * 0.06, w * 0.028, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.65)";
      ctx.beginPath();
      ctx.arc(jx - w * 0.01, -h * 0.075, w * 0.009, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = 0; i < 3; i++) {
      const sx = x0 + (i * 2 + 0.5) * (w / 5);
      drawSparkle(ctx, sx, -h * 0.98, w * 0.032, "rgba(255,255,240,0.95)");
    }

    ctx.restore();
  }

  function fxBunny(ctx, lm, P) {
    const top = P(LMK.FOREHEAD);
    const lc  = P(LMK.L_CHEEK);
    const rc  = P(LMK.R_CHEEK);
    const faceW = dist(lc, rc);
    const faceH = dist(top, P(LMK.CHIN));

    const lc2 = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rc2 = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const ang = Math.atan2(rc2.y - lc2.y, rc2.x - lc2.x);
    const cx  = (lc2.x + rc2.x) / 2;

    const drawEar = (offsetX, tilt) => {
      const ew = faceW * 0.21;
      const eh = faceH * 0.9;

      ctx.save();
      ctx.translate(cx + offsetX, top.y + faceH * 0.02);
      ctx.rotate(ang + tilt);

      const g = ctx.createLinearGradient(0, 0, 0, -eh);
      g.addColorStop(0, "#f2eef6");
      g.addColorStop(1, "#ffffff");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, -eh / 2, ew / 2, eh / 2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(180,170,190,0.65)";
      ctx.lineWidth = Math.max(1, ew * 0.05);
      ctx.stroke();

      ctx.fillStyle = "#ffb6c9";
      ctx.beginPath();
      ctx.ellipse(0, -eh / 2, ew * 0.28, eh * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    };

    const spread = faceW * 0.24;
    drawEar(-spread, -0.2);
    drawEar( spread,  0.2);
  }

  function fxHeart(ctx, lm, P) {
    const lEye = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rEye = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const eyeDist = dist(lEye, rEye);
    const base = eyeDist * 0.55;
    const t = performance.now() / 520;

    const drawHeart = (cx, cy, s, phase) => {
      s *= 1 + Math.sin(t + phase) * 0.12;

      ctx.save();
      ctx.translate(cx, cy - s * 0.45);
      ctx.shadowColor = "rgba(255,60,110,0.9)";
      ctx.shadowBlur = s * 0.55;

      const g = ctx.createLinearGradient(0, -s * 0.7, 0, s * 0.45);
      g.addColorStop(0, "#ff4d79");
      g.addColorStop(1, "#c9184a");
      ctx.fillStyle = g;

      const topCurve = s * 0.3;
      ctx.beginPath();
      ctx.moveTo(0, topCurve);
      ctx.bezierCurveTo(0, 0, -s / 2, 0, -s / 2, topCurve);
      ctx.bezierCurveTo(-s / 2, (s + topCurve) / 2, 0, (s + topCurve) / 2, 0, s);
      ctx.bezierCurveTo(0, (s + topCurve) / 2, s / 2, (s + topCurve) / 2, s / 2, topCurve);
      ctx.bezierCurveTo(s / 2, 0, 0, 0, 0, topCurve);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.beginPath();
      ctx.ellipse(-s * 0.16, s * 0.28, s * 0.08, s * 0.06, -0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    };

    drawHeart(lEye.x, lEye.y, base, 0);
    drawHeart(rEye.x, rEye.y, base, Math.PI * 0.8);
  }

  function fxPirate(ctx, lm, P) {
    const lEye = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rEye = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const c    = mid(lEye, rEye);
    const eyeDist = dist(lEye, rEye);
    const ang = Math.atan2(rEye.y - lEye.y, rEye.x - lEye.x);

    const patchEye = lEye.x < rEye.x ? lEye : rEye;
    const size = eyeDist * 0.52;

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(ang);
    ctx.strokeStyle = "#0a0a0a";
    ctx.lineWidth = Math.max(3, eyeDist * 0.09);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-eyeDist * 1.05, -eyeDist * 0.04);
    ctx.lineTo( eyeDist * 1.05,  eyeDist * 0.07);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(patchEye.x, patchEye.y);
    ctx.rotate(ang);

    ctx.fillStyle = "#08080c";
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.74, size * 0.86, 0, 0, Math.PI * 2);
    ctx.fill();

    const g = ctx.createLinearGradient(-size * 0.5, -size * 0.5, size * 0.45, size * 0.45);
    g.addColorStop(0,   "rgba(90,90,105,0.6)");
    g.addColorStop(0.5, "rgba(20,20,26,0.2)");
    g.addColorStop(1,   "rgba(0,0,0,0.45)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.74, size * 0.86, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = Math.max(1, size * 0.06);
    ctx.stroke();

    ctx.restore();
  }

  function drawFilterSet(ctx, lm, P) {
    switch (state.filter) {
      case "dog":    fxDog(ctx, lm, P);    break;
      case "shades": fxShades(ctx, lm, P); break;
      case "stache": fxStache(ctx, lm, P); break;
      case "crown":  fxCrown(ctx, lm, P);  break;
      case "bunny":  fxBunny(ctx, lm, P);  break;
      case "heart":  fxHeart(ctx, lm, P);  break;
      case "pirate": fxPirate(ctx, lm, P); break;
    }
  }

  /* ============================================================
     RECORDER CORE
  ============================================================ */
  const recorder = {
    mediaRecorder: null,
    chunks: [],
    canvas: null,
    canvasCtx: null,
    audioStream: null,
    canvasStream: null,
    mimeType: "",
    fileExt: "webm",
    isRecording: false,
    startedAt: 0,
    timerInterval: null,
    pendingBlob: null,
    pendingMeta: null
  };

  /* Pick the best supported recording mime type for this browser */
  function pickMimeType() {
    const candidates = [
      { mime: "video/mp4;codecs=avc1.42E01E,mp4a.40.2", ext: "mp4" },
      { mime: "video/mp4;codecs=avc1.42E01E", ext: "mp4" },
      { mime: "video/mp4", ext: "mp4" },
      { mime: "video/webm;codecs=vp9,opus", ext: "webm" },
      { mime: "video/webm;codecs=vp8,opus", ext: "webm" },
      { mime: "video/webm;codecs=vp9", ext: "webm" },
      { mime: "video/webm;codecs=vp8", ext: "webm" },
      { mime: "video/webm", ext: "webm" }
    ];
    if (typeof MediaRecorder === "undefined") return null;
    for (const c of candidates) {
      try {
        if (MediaRecorder.isTypeSupported(c.mime)) return c;
      } catch (e) {}
    }
    return { mime: "", ext: "webm" }; // let the browser choose
  }

  async function getMicStream() {
    if (!state.mic) return null;
    try {
      const s = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
      return s;
    } catch (err) {
      console.warn("[mic]", err);
      // reflect failure in UI
      state.mic = false;
      save();
      updateMicUI();
      return null;
    }
  }

  /* Build a recording canvas at a resolution derived from the video feed */
  function ensureRecordCanvas() {
    const vw = video.videoWidth || 1280;
    const vh = video.videoHeight || 720;

    // Cap to a sane max (2160p) and keep even dimensions (some encoders need it)
    const maxDim = 2160;
    let w = vw, h = vh;
    if (Math.max(w, h) > maxDim) {
      const k = maxDim / Math.max(w, h);
      w = Math.round(w * k);
      h = Math.round(h * k);
    }
    w = w - (w % 2);
    h = h - (h % 2);

    if (!recorder.canvas) {
      recorder.canvas = document.createElement("canvas");
      recorder.canvasCtx = recorder.canvas.getContext("2d", { alpha: false });
    }
    if (recorder.canvas.width !== w || recorder.canvas.height !== h) {
      recorder.canvas.width = w;
      recorder.canvas.height = h;
    }
    return { w, h };
  }

  /* Draw one composited frame at recording resolution */
  function drawRecordFrame() {
    const { w, h } = ensureRecordCanvas();
    const ctx = recorder.canvasCtx;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;

    const mirrored = !!state.mirrored;
    const r = coverRect(vw, vh, w, h);

    // 1. base frame + color grade
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    if (state.beauty > 0 && "filter" in ctx) ctx.filter = BEAUTY_GRADE[state.beauty];
    if (mirrored) { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, r.dx, r.dy, r.dw, r.dh);
    ctx.restore();

    // 2. soft focus (uses a separate blur canvas)
    if (state.beauty > 0) {
      const bw = Math.max(1, Math.round(w / 3));
      const bh = Math.max(1, Math.round(h / 3));
      if (blurCanvas.width !== bw || blurCanvas.height !== bh) {
        blurCanvas.width = bw; blurCanvas.height = bh;
      }
      const s = bw / w;
      blurCtx.setTransform(1, 0, 0, 1, 0, 0);
      blurCtx.clearRect(0, 0, bw, bh);
      blurCtx.save();
      if (mirrored) { blurCtx.translate(bw, 0); blurCtx.scale(-1, 1); }
      blurCtx.drawImage(video, r.dx * s, r.dy * s, r.dw * s, r.dh * s);
      blurCtx.restore();

      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.globalAlpha = state.beauty === 1 ? 0.40 : 0.58;
      ctx.drawImage(blurCanvas, 0, 0, bw, bh, 0, 0, w, h);
      ctx.restore();

      if (state.beauty >= 2) {
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.16;
        ctx.drawImage(blurCanvas, 0, 0, bw, bh, 0, 0, w, h);
        ctx.restore();
      }
    }

    // 3. face-driven effects
    if (lastLandmarks) {
      const P = makeProjector(vw, vh, w, h, mirrored);
      if (state.beauty > 0) drawEyeBrighten(ctx, lastLandmarks, P, state.beauty);
      if (state.filter !== "none") drawFilterSet(ctx, lastLandmarks, P);
    }
  }

  /* Draw loop while recording — grabs a canvas frame each animation tick */
  let recRaf = null;
  function recLoop() {
    if (!recorder.isRecording) return;
    drawRecordFrame();
    recRaf = requestAnimationFrame(recLoop);
  }

  async function startRecording() {
    if (recorder.isRecording || !stream) return;

    const pick = pickMimeType();
    if (!pick) {
      alert("Recording is not supported in this browser.");
      return;
    }

    // Make sure the frame is composited once before we start
    drawRecordFrame();

    // Canvas stream carries the visual output (filters + beauty included)
    try {
      recorder.canvasStream = recorder.canvas.captureStream(state.recFps);
    } catch (e) {
      console.warn("[record] captureStream failed", e);
      alert("Could not capture the video stream for recording.");
      return;
    }

    // Optional microphone audio
    recorder.audioStream = await getMicStream();

    const tracks = [...recorder.canvasStream.getVideoTracks()];
    if (recorder.audioStream) {
      tracks.push(...recorder.audioStream.getAudioTracks());
    }
    const mixed = new MediaStream(tracks);

    const opts = pick.mime ? { mimeType: pick.mime } : undefined;
    let mr;
    try {
      mr = new MediaRecorder(mixed, opts);
    } catch (e) {
      console.warn("[record] fallback to default mime", e);
      mr = new MediaRecorder(mixed);
    }

    recorder.mimeType = mr.mimeType || pick.mime || "video/webm";
    recorder.fileExt = recorder.mimeType.includes("mp4") ? "mp4" : "webm";
    recorder.chunks = [];
    recorder.mediaRecorder = mr;

    mr.ondataavailable = e => {
      if (e.data && e.data.size > 0) recorder.chunks.push(e.data);
    };

    mr.onerror = e => {
      console.warn("[record] error", e);
    };

    mr.onstop = () => {
      const blob = new Blob(recorder.chunks, { type: recorder.mimeType });
      const duration = (performance.now() - recorder.startedAt) / 1000;
      recorder.pendingBlob = blob;
      recorder.pendingMeta = {
        duration,
        size: blob.size,
        mime: recorder.mimeType,
        ext: recorder.fileExt
      };

      // cleanup streams
      if (recorder.audioStream) {
        recorder.audioStream.getTracks().forEach(t => t.stop());
        recorder.audioStream = null;
      }
      if (recorder.canvasStream) {
        recorder.canvasStream.getTracks().forEach(t => t.stop());
        recorder.canvasStream = null;
      }

      showRecordingPreview();
    };

    // Start capturing
    mr.start(250);          // emit a chunk every 250ms
    recorder.isRecording = true;
    recorder.startedAt = performance.now();

    // Kick off draw loop for recording
    recLoop();

    // UI
    recTimer.classList.add("show");
    recMicFlag.textContent = recorder.audioStream ? "🎤" : "";
    btnRec.classList.add("live");
    recTopBtn.classList.add("live");
    recTopBtn.querySelector(".label").textContent = "Stop";
    recDot.classList.add("on");

    updateRecTimer();
    recorder.timerInterval = setInterval(updateRecTimer, 250);
  }

  function stopRecording() {
    if (!recorder.isRecording) return;

    recorder.isRecording = false;
    if (recRaf != null) { cancelAnimationFrame(recRaf); recRaf = null; }

    try { recorder.mediaRecorder && recorder.mediaRecorder.stop(); } catch (e) {}

    clearInterval(recorder.timerInterval);
    recorder.timerInterval = null;

    recTimer.classList.remove("show");
    btnRec.classList.remove("live");
    recTopBtn.classList.remove("live");
    recTopBtn.querySelector(".label").textContent = "Record";
    recDot.classList.toggle("on", !!stream);
  }

  function updateRecTimer() {
    if (!recorder.isRecording) return;
    const s = Math.floor((performance.now() - recorder.startedAt) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    recTime.textContent = mm + ":" + ss;
  }

  function toggleRecording() {
    if (recorder.isRecording) stopRecording();
    else startRecording();
  }

  /* ============================================================
     PREVIEW MODAL (handles both snapshot and recording)
  ============================================================ */
  function showRecordingPreview() {
    const blob = recorder.pendingBlob;
    const meta = recorder.pendingMeta;
    if (!blob || !meta) return;

    // Object URL for the video
    const url = URL.createObjectURL(blob);

    // Swap modal to video mode
    modalImg.style.display = "none";
    modalVideo.style.display = "block";
    modalMeta.style.display = "flex";
    modalVideo.src = url;
    modalIcon.textContent = "●";
    modalTitle.textContent = "Recording";
    metaDuration.textContent = "⏱ " + formatDuration(meta.duration);
    metaSize.textContent = "📦 " + formatSize(meta.size);
    metaType.textContent = "🎬 " + (meta.ext === "mp4" ? "MP4" : "WebM");

    // Remember for download/discard
    modal.dataset.mode = "video";
    modal.dataset.url = url;

    modal.classList.add("show");
  }

  function showSnapshotPreview(dataUrl) {
    // Swap modal to image mode
    modalVideo.pause && modalVideo.pause();
    modalVideo.style.display = "none";
    modalVideo.removeAttribute("src");
    modalImg.style.display = "block";
    modalMeta.style.display = "none";
    modalImg.src = dataUrl;
    modalIcon.textContent = "◉";
    modalTitle.textContent = "Snapshot";

    modal.dataset.mode = "image";
    modal.dataset.url = dataUrl;

    modal.classList.add("show");
  }

  function revokeModalUrl() {
    const mode = modal.dataset.mode;
    const url = modal.dataset.url;
    if (mode === "video" && url && url.startsWith("blob:")) {
      try { URL.revokeObjectURL(url); } catch (e) {}
    }
  }

  function closeModal() {
    revokeModalUrl();

    modal.classList.remove("show");
    modalImg.src = "";
    try { modalVideo.pause(); } catch (e) {}
    modalVideo.removeAttribute("src");
    modalVideo.load && modalVideo.load();

    modal.dataset.mode = "";
    modal.dataset.url = "";

    recorder.pendingBlob = null;
    recorder.pendingMeta = null;
  }

  function downloadCurrent() {
    const mode = modal.dataset.mode;
    const url = modal.dataset.url;
    if (!url) return;

    const pad = n => String(n).padStart(2, "0");
    const d = new Date();
    const stamp =
      d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" +
      pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());

    const a = document.createElement("a");
    a.href = url;

    if (mode === "video") {
      const ext = recorder.pendingMeta && recorder.pendingMeta.ext
        ? recorder.pendingMeta.ext : "webm";
      a.download = "recording-" + stamp + "." + ext;
    } else {
      a.download = "snapshot-" + stamp + ".png";
    }

    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function formatDuration(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  }

  /* ============================================================
     MIC UI
  ============================================================ */
  function updateMicUI() {
    micToggle.classList.toggle("on", !!state.mic);
    micToggle.classList.toggle("mic-slashed", !state.mic);
    micToggle.title = state.mic
      ? "Microphone ON — audio will be recorded"
      : "Microphone OFF — tap to record with audio";
  }

  /* ============================================================
     RENDER LOOP (screen preview)
  ============================================================ */
  let rafId = null;

  function loop() {
    rafId = requestAnimationFrame(loop);

    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh || !stream) return;

    resizeFx();
    fxCtx.setTransform(fxDpr, 0, 0, fxDpr, 0, 0);
    fxCtx.clearRect(0, 0, fxW, fxH);

    const beautyOn = state.beauty > 0;
    const filterOn = state.filter !== "none";
    const needsCanvas = beautyOn || filterOn;

    const now = performance.now();
    if (filterOn && faceLandmarker && now - lastDetectAt > 28) {
      lastDetectAt = now;
      try {
        const res = faceLandmarker.detectForVideo(video, now);
        lastLandmarks = (res && res.faceLandmarks && res.faceLandmarks[0]) || null;
      } catch (e) {}
    }
    if (!filterOn) lastLandmarks = null;

    if (!needsCanvas) return;

    const mirrored = !!state.mirrored;
    const r = coverRect(vw, vh, fxW, fxH);

    fxCtx.save();
    fxCtx.fillStyle = "#05080b";
    fxCtx.fillRect(0, 0, fxW, fxH);
    fxCtx.filter = beautyOn ? BEAUTY_GRADE[state.beauty] : "none";
    if (mirrored) { fxCtx.translate(fxW, 0); fxCtx.scale(-1, 1); }
    fxCtx.drawImage(video, r.dx, r.dy, r.dw, r.dh);
    fxCtx.restore();

    if (beautyOn) drawSoftFocus(fxCtx, fxW, fxH, state.beauty, mirrored);

    let project = null;
    if (lastLandmarks) project = makeProjector(vw, vh, fxW, fxH, mirrored);

    if (project && beautyOn) drawEyeBrighten(fxCtx, lastLandmarks, project, state.beauty);
    if (project && filterOn) drawFilterSet(fxCtx, lastLandmarks, project);
  }

  function startLoop() {
    if (rafId == null) rafId = requestAnimationFrame(loop);
  }
  function stopLoop() {
    if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
    fxCtx.setTransform(1, 0, 0, 1, 0, 0);
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }
  function ensureLoop() { if (rafId == null) startLoop(); }

  /* ============================================================
     FILTER PICKER
  ============================================================ */
  FILTERS.forEach(f => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.dataset.filter = f.id;
    btn.innerHTML = '<span class="emoji">' + f.emoji + "</span>" + f.label;
    btn.addEventListener("click", () => setFilter(f.id));
    filterStrip.appendChild(btn);
  });

  function setFilter(id) {
    state.filter = id;
    filterStrip.querySelectorAll(".chip").forEach(c =>
      c.classList.toggle("on", c.dataset.filter === id)
    );
    save();

    if (id === "none") {
      lastLandmarks = null;
      updateFxStatus();
      return;
    }

    updateFxStatus();
    initFaceTracking();
    ensureLoop();
  }

  /* ============================================================
     SNAPSHOT
  ============================================================ */
  function renderFull(vw, vh) {
    const out = document.createElement("canvas");
    out.width = vw; out.height = vh;
    const octx = out.getContext("2d");
    const mirrored = !!state.mirrored;

    octx.save();
    octx.fillStyle = "#000";
    octx.fillRect(0, 0, vw, vh);
    if (state.beauty > 0 && "filter" in octx) octx.filter = BEAUTY_GRADE[state.beauty];
    if (mirrored) { octx.translate(vw, 0); octx.scale(-1, 1); }
    octx.drawImage(video, 0, 0, vw, vh);
    octx.restore();

    if (state.beauty > 0) {
      const bw = Math.max(1, Math.round(vw / 3));
      const bh = Math.max(1, Math.round(vh / 3));
      const bc = document.createElement("canvas");
      bc.width = bw; bc.height = bh;
      const bctx = bc.getContext("2d");
      bctx.save();
      if (mirrored) { bctx.translate(bw, 0); bctx.scale(-1, 1); }
      bctx.drawImage(video, 0, 0, bw, bh);
      bctx.restore();

      octx.save();
      octx.imageSmoothingEnabled = true;
      octx.imageSmoothingQuality = "high";
      octx.globalAlpha = state.beauty === 1 ? 0.40 : 0.58;
      octx.drawImage(bc, 0, 0, bw, bh, 0, 0, vw, vh);
      octx.restore();

      if (state.beauty >= 2) {
        octx.save();
        octx.imageSmoothingEnabled = true;
        octx.imageSmoothingQuality = "high";
        octx.globalCompositeOperation = "screen";
        octx.globalAlpha = 0.16;
        octx.drawImage(bc, 0, 0, bw, bh, 0, 0, vw, vh);
        octx.restore();
      }
    }

    if (lastLandmarks) {
      const P = makeProjector(vw, vh, vw, vh, mirrored);
      if (state.beauty > 0) drawEyeBrighten(octx, lastLandmarks, P, state.beauty);
      if (state.filter !== "none") drawFilterSet(octx, lastLandmarks, P);
    }

    return out.toDataURL("image/png");
  }

  function capture() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!stream || !vw || !vh) return null;
    return renderFull(vw, vh);
  }

  function doCapture() {
    const data = capture();
    if (!data) return;

    flash.classList.remove("fire");
    void flash.offsetWidth;
    flash.classList.add("fire");

    showSnapshotPreview(data);
  }

  function takeSnapshot() {
    if (!stream) return;

    if (state.flash && !hasTorch) {
      screenFlash.classList.add("burst");
      setTimeout(() => {
        screenFlash.classList.remove("burst");
        if (state.flash) screenFlash.classList.add("on");
      }, 220);
      setTimeout(doCapture, 110);
      return;
    }

    doCapture();
  }

  /* ============================================================
     CONTENT PANE
  ============================================================ */
  function normalizeUrl(raw) {
    let v = (raw || "").trim();
    if (!v) return "";
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = "https://" + v.replace(/^\/+/, "");
    return v;
  }

  function renderContent() {
    const c = state.content;

    contentPane.classList.toggle("mode-web",  c.mode === "web");
    contentPane.classList.toggle("mode-note", c.mode === "note");

    contentPane.querySelectorAll(".seg-btn").forEach(b =>
      b.classList.toggle("on", b.dataset.mode === c.mode)
    );

    if (document.activeElement !== urlInput) urlInput.value = c.url || "";
    if (document.activeElement !== note)     note.value     = c.note || "";

    contentBody.classList.toggle("empty", c.mode === "web" && !c.url);

    if (c.mode === "web" && c.url && frame.dataset.src !== c.url) {
      frame.src = c.url;
      frame.dataset.src = c.url;
    }
  }

  contentPane.querySelectorAll(".seg-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.content.mode = btn.dataset.mode;
      renderContent();
      save();
      if (btn.dataset.mode === "note") note.focus();
    });
  });

  urlForm.addEventListener("submit", e => {
    e.preventDefault();
    const url = normalizeUrl(urlInput.value);
    if (!url) return;
    state.content.url = url;
    state.content.mode = "web";
    urlInput.value = url;
    renderContent();
    save();
  });

  contentPane.querySelector('[data-act="reload"]').addEventListener("click", () => {
    const c = state.content;
    if (c.mode !== "web" || !c.url) return;
    frame.dataset.src = "";
    frame.src = "about:blank";
    setTimeout(() => { frame.src = c.url; frame.dataset.src = c.url; }, 40);
  });

  contentPane.querySelector('[data-act="open"]').addEventListener("click", () => {
    const c = state.content;
    if (c.mode === "web" && c.url) window.open(c.url, "_blank", "noopener");
  });

  note.addEventListener("input", () => { state.content.note = note.value; save(); });

  /* ============================================================
     CAMERA CONTROLS
  ============================================================ */
  camToggle.addEventListener("click", toggleCamera);
  csBtn.addEventListener("click", () => startCamera(state.deviceId || ""));
  btnSnap.addEventListener("click", takeSnapshot);
  btnRec.addEventListener("click", toggleRecording);
  btnFlip.addEventListener("click", flipCamera);
  btnFlash.addEventListener("click", toggleFlash);
  btnBeauty.addEventListener("click", cycleBeauty);

  micToggle.addEventListener("click", () => {
    state.mic = !state.mic;
    save();
    updateMicUI();
  });

  btnMirror.addEventListener("click", () => {
    state.mirrored = !state.mirrored;
    applyMirror();
    save();
  });

  camSelect.addEventListener("change", () => {
    if (recorder.isRecording) {
      camSelect.value = state.deviceId;
      return;
    }
    state.deviceId = camSelect.value;
    save();
    startCamera(state.deviceId);
  });

  btnFull.addEventListener("click", () => {
    const el = camWrap;
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }
  });

  /* ============================================================
     MODAL
  ============================================================ */
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalDiscard").addEventListener("click", closeModal);
  document.getElementById("modalDownload").addEventListener("click", downloadCurrent);

  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (modal.classList.contains("show")) { closeModal(); return; }
      if (recorder.isRecording) { stopRecording(); return; }
    }

    const tag = (document.activeElement && document.activeElement.tagName) || "";
    const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    if (typing || modal.classList.contains("show")) return;

    if (e.code === "Space") {
      if (stream) { e.preventDefault(); takeSnapshot(); }
    } else if (e.key.toLowerCase() === "r") {
      if (stream) { e.preventDefault(); toggleRecording(); }
    } else if (e.key.toLowerCase() === "s") {
      if (stream) { e.preventDefault(); takeSnapshot(); }
    }
  });

  /* ============================================================
     GLOBAL CONTROLS
  ============================================================ */
  layoutBtn.addEventListener("click", () => {
    state.layout = state.layout === "vertical" ? "horizontal" : "vertical";
    applyLayout();
    save();
  });

  swapBtn.addEventListener("click", () => {
    state.camFirst = !state.camFirst;
    mountPanes();
    save();
  });

  snapTopBtn.addEventListener("click", takeSnapshot);
  recTopBtn.addEventListener("click", toggleRecording);

  resetBtn.addEventListener("click", () => {
    if (recorder.isRecording) stopRecording();
    state = defaults();
    applyMirror();
    setFilter("none");
    updateBeautyUI();
    updateFlashUI();
    updateMicUI();
    screenFlash.classList.remove("on", "burst");
    mountPanes();
    applyLayout();
    renderContent();
    save();
    startCamera(state.deviceId || "");
  });

  /* ============================================================
     LIFECYCLE
  ============================================================ */
  document.addEventListener("visibilitychange", () => {
    if (!stream) return;
    if (document.hidden) {
      video.pause();
      stopLoop();
    } else {
      video.play().catch(() => {});
      if (state.filter !== "none" || state.beauty > 0) startLoop();
    }
  });

  window.addEventListener("resize", () => { resizeFx(); });

  window.addEventListener("beforeunload", () => {
    if (recorder.isRecording) {
      try { recorder.mediaRecorder && recorder.mediaRecorder.stop(); } catch (e) {}
    }
    if (stream) {
      const track = stream.getVideoTracks()[0];
      if (track) { try { track.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {} }
      stream.getTracks().forEach(t => t.stop());
    }
    stopLoop();
  });

  /* ============================================================
     INIT
  ============================================================ */
  mountPanes();
  applyLayout();
  applyMirror();
  updateBeautyUI();
  updateFlashUI();
  updateMicUI();
  renderContent();
  setLive(false);

  filterStrip.querySelectorAll(".chip").forEach(c =>
    c.classList.toggle("on", c.dataset.filter === state.filter)
  );

  startCamera(state.deviceId || "").then(() => {
    if (state.filter !== "none") {
      initFaceTracking();
      ensureLoop();
    }
    updateFxStatus();
    updateFlashUI();
  });

  ensureLoop();

})();
</script>
</body>
</html>
