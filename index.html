<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprentissage Bilingue TTS + Caméra flottante</title>
<style>
    :root {
        --en-red: #d9534f;
        --fr-blue: #0275d8;
        --border-color: #eeeeee;
        --success-green: #28a745;
        --record-red: #e53935;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ffffff;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
    }

    .input-section {
        width: 100%;
        max-width: 850px;
        margin-bottom: 30px;
    }

    textarea {
        width: 100%;
        height: 100px;
        background: #fafafa;
        color: #333;
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        resize: none;
        box-sizing: border-box;
        outline: none;
    }

    .controls {
        margin-top: 15px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        align-items: center;
    }

    button {
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    #loadBtn { background: #f0f0f0; color: #555; }
    #playBtn { background: #ff0000; color: white; }
    #pauseBtn { background: #f0ad4e; color: white; display: none; }
    #stopBtn { background: #333; color: white; }
    #loopBtn { background: #f0f0f0; color: #555; border: 2px solid transparent; }
    #recordBtn { background: var(--record-red); color: white; border: 2px solid transparent; }
    #recordBtn.recording {
        background: #b71c1c;
        border-color: #ff8a80;
        animation: recPulse 1.2s infinite;
    }

    @keyframes recPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.6); }
        50%      { box-shadow: 0 0 0 8px rgba(229, 57, 53, 0); }
    }

    #loopBtn.active { 
        background: var(--success-green); 
        color: white; 
        border-color: #1e7e34;
    }

    .quality-select {
        background: #f0f0f0;
        color: #333;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 11px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        outline: none;
    }
    .quality-select:hover { background: #e6e6e6; }

    button:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.9; }
    button:disabled { opacity: 0.2; cursor: not-allowed; }

    .stage {
        width: 100%;
        max-width: 850px;
        aspect-ratio: 16 / 9;
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        border: 1px solid var(--border-color);
        margin-top: 10px;
    }

    #scroller {
        position: absolute;
        width: 100%;
        top: 50%; 
        left: 0;
        transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        will-change: transform;
    }

    .sentence-item {
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 60px;
        font-size: 40px;
        font-weight: 700;
        box-sizing: border-box;
        transition: opacity 0.5s, transform 0.5s;
        opacity: 0.05; 
    }

    .sentence-item.active {
        opacity: 1;
        transform: scale(1.08);
    }

    .english { color: var(--en-red); }
    .french { color: var(--fr-blue); }

    .center-guide {
        position: absolute;
        top: 50%;
        left: 5%;
        right: 5%;
        height: 1px;
        background: rgba(0,0,0,0.02);
        pointer-events: none;
        transform: translateY(-50%);
    }

    .camera-float {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        border: 3px solid #fff;
        background: #111;
        z-index: 1000;
        cursor: grab;
        transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
        user-select: none;
        touch-action: none;
    }

    .camera-float:active {
        cursor: grabbing;
        box-shadow: 0 18px 40px rgba(0,0,0,0.5);
    }

    .camera-float:hover { transform: scale(1.03); }

    .camera-float.recording {
        border-color: #ff3b30;
        box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.35), 0 18px 40px rgba(0,0,0,0.5);
        animation: recRing 1.4s infinite;
    }

    @keyframes recRing {
        0%, 100% { box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.35), 0 18px 40px rgba(0,0,0,0.5); }
        50%      { box-shadow: 0 0 0 8px rgba(255, 59, 48, 0.10), 0 18px 40px rgba(0,0,0,0.5); }
    }

    .camera-float video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000;
        transform: scaleX(-1);
        transition: transform 0.3s ease, filter 0.3s ease;
        filter: brightness(1.03) contrast(1.06) saturate(1.1);
        border-radius: 50%;
    }

    .flash-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: white;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.08s ease;
        z-index: 10;
        border-radius: 50%;
    }
    .flash-overlay.active { opacity: 1; }

    .camera-controls {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 5px;
        z-index: 30;
        opacity: 0.75;
        transition: opacity 0.2s;
    }
    .camera-controls:hover { opacity: 1; }

    .cam-btn {
        background: rgba(0,0,0,0.6);
        border: none;
        color: white;
        border-radius: 50%;
        width: 26px; height: 26px;
        font-size: 13px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 0.2s, transform 0.1s, color 0.2s, box-shadow 0.2s;
        padding: 0;
    }
    .cam-btn:hover { background: rgba(0,0,0,0.9); transform: scale(1.1); }
    .cam-btn.flash-active {
        background: #ffaa00;
        color: #000;
        box-shadow: 0 0 12px #ffaa00, 0 0 4px #ffaa00;
    }

    .cam-btn.cam-record {
        background: rgba(255,255,255,0.85);
        color: #111;
        width: 30px; height: 30px;
        font-size: 15px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    }
    .cam-btn.cam-record:hover {
        background: #ffffff;
        transform: scale(1.12);
    }
    .cam-btn.cam-record.active {
        background: #ff3b30;
        color: #fff;
        box-shadow: 0 0 0 3px rgba(255,59,48,0.35), 0 0 14px rgba(255,59,48,0.7);
        animation: recBlink 1s infinite;
    }

    .rec-indicator {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(229, 57, 53, 0.92);
        color: #fff;
        font-size: 10px;
        font-weight: bold;
        padding: 3px 10px;
        border-radius: 20px;
        display: none;
        align-items: center;
        gap: 5px;
        z-index: 25;
        letter-spacing: 0.5px;
        box-shadow: 0 0 12px rgba(229,57,53,0.6);
    }
    .rec-indicator.active { display: flex; }

    .rec-dot {
        width: 7px; height: 7px;
        background: #fff;
        border-radius: 50%;
        animation: recBlink 1s infinite;
    }
    @keyframes recBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.2; }
    }

    .rec-timer {
        display: none;
        align-items: center;
        gap: 6px;
        background: #b71c1c;
        color: #fff;
        padding: 12px 14px;
        border-radius: 8px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 0.5px;
    }
    .rec-timer.active { display: flex; }

    .mic-bars {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
        margin-left: 4px;
    }
    .mic-bars span {
        width: 2px;
        background: #ff8a80;
        border-radius: 1px;
        transition: height 0.06s linear;
    }

    .preview-panel {
        display: none;
        width: 100%;
        max-width: 850px;
        margin-top: 18px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }
    .preview-panel.active { display: block; }

    .preview-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: #e6edf3;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
    }
    .preview-header .live-dot {
        width: 8px; height: 8px;
        background: #ff3b30;
        border-radius: 50%;
        box-shadow: 0 0 8px #ff3b30;
        animation: recBlink 1s infinite;
    }
    .preview-header .label {
        text-transform: uppercase;
        color: #ff6b6b;
    }
    .preview-header .hint {
        margin-left: auto;
        font-weight: 400;
        color: #8b949e;
        font-size: 11px;
    }
    .preview-header .quality-badge {
        background: #1f6feb;
        color: #fff;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: 700;
        letter-spacing: 0.4px;
    }

    .preview-canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        background: #fff;
        aspect-ratio: 16 / 9;
        image-rendering: -webkit-optimize-contrast;
    }

    @media (max-width: 600px) {
        .camera-float {
            width: 110px;
            height: 110px;
            bottom: 15px;
            right: 15px;
        }
        .cam-btn { width: 22px; height: 22px; font-size: 11px; }
        .cam-btn.cam-record { width: 26px; height: 26px; font-size: 13px; }
    }
</style>
</head>
<body>

    <div class="input-section">
        <textarea id="textInput" placeholder="Ligne 1 : Anglais&#10;Ligne 2 : Français&#10;Ligne 3 : Anglais..."></textarea>
        <div class="controls">
            <button id="loadBtn" onclick="processText()">1. Charger la liste</button>
            <button id="playBtn" onclick="startPlayAll()" disabled>▶ Lire tout</button>
            <button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
            <button id="stopBtn" onclick="stopSpeech()">⏹ Arrêter</button>
            <button id="loopBtn" onclick="toggleLoop()">🔁 Boucle : OFF</button>
            <button id="recordBtn" title="Enregistrer l'écran + la caméra + votre voix">⏺ Enregistrer</button>
            <select class="quality-select" id="qualitySelect" title="Qualité d'enregistrement">
                <option value="720">720p (HD)</option>
                <option value="1080" selected>1080p (Full HD)</option>
                <option value="1440">1440p (QHD)</option>
            </select>
            <div class="rec-timer" id="recTimer">
                ⏺ <span id="recTime">00:00</span>
                <span class="mic-bars" id="micBars">
                    <span></span><span></span><span></span><span></span><span></span>
                </span>
            </div>
        </div>
    </div>

    <div class="stage" id="stage">
        <div class="center-guide"></div>
        <div id="scroller"></div>
    </div>

    <div class="preview-panel" id="previewPanel">
        <div class="preview-header">
            <span class="live-dot"></span>
            <span class="label">REC — Aperçu en direct</span>
            <span class="quality-badge" id="qualityBadge">1080p</span>
            <span class="hint">Ce que la vidéo enregistrée contient</span>
        </div>
        <canvas class="preview-canvas" id="previewCanvas" width="1920" height="1080"></canvas>
    </div>

    <div class="camera-float" id="cameraFloat" tabindex="0">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="rec-indicator" id="recIndicator"><span class="rec-dot"></span>REC</div>
        
        <div class="camera-controls">
            <button class="cam-btn cam-record" id="camRecordBtn" title="Enregistrer (vidéo + votre voix)">📷</button>
            <button class="cam-btn" id="switchCamBtn" title="Changer caméra avant/arrière">🔄</button>
            <button class="cam-btn" id="flashBtn" title="Flash (torche)">⚡</button>
            <button class="cam-btn" id="filterBtn" title="Filtre lissant">✨</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  QUALITY SETTINGS
        // ============================================================
        const QUALITY_PRESETS = {
            '720':  { w: 1280, h: 720,  fps: 30, videoBitrate: 5_000_000,  label: '720p'  },
            '1080': { w: 1920, h: 1080, fps: 30, videoBitrate: 10_000_000, label: '1080p' },
            '1440': { w: 2560, h: 1440, fps: 30, videoBitrate: 16_000_000, label: '1440p' }
        };
        let currentQuality = QUALITY_PRESETS['1080'];

        const qualitySelect = document.getElementById('qualitySelect');
        const qualityBadge = document.getElementById('qualityBadge');
        qualitySelect.addEventListener('change', () => {
            currentQuality = QUALITY_PRESETS[qualitySelect.value] || QUALITY_PRESETS['1080'];
            qualityBadge.textContent = currentQuality.label;
        });

        // ============================================================
        //  TTS LOGIC — NO PAUSES, halved animation
        // ============================================================
        const synth = window.speechSynthesis;
        let sentenceData = [];
        let currentIndex = 0;
        let repeatCounter = 0;
        let isPlaying = false;
        let isPaused = false;
        let isLooping = false;
        const ITEM_HEIGHT = 150; 

        function processText() {
            stopSpeech();
            const input = document.getElementById('textInput').value;
            const scroller = document.getElementById('scroller');
            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== "");

            scroller.innerHTML = "";
            sentenceData = [];

            lines.forEach((line, index) => {
                const isEnglish = index % 2 === 0;
                const langCode = isEnglish ? 'en-US' : 'fr-FR';
                const colorClass = isEnglish ? 'english' : 'french';
                // Halved repeats: EN 2×, FR 1×
                const totalRepeats = isEnglish ? 2 : 1;

                const div = document.createElement('div');
                div.className = `sentence-item ${colorClass}`;
                div.innerText = line;
                scroller.appendChild(div);

                sentenceData.push({ 
                    text: line, 
                    lang: langCode, 
                    element: div,
                    isEnglish: isEnglish,
                    maxRepeats: totalRepeats
                });
            });

            if (sentenceData.length > 0) {
                scroller.style.transform = `translateY(${-ITEM_HEIGHT / 2}px)`;
                document.getElementById('playBtn').disabled = false;
            }
        }

        function updateDisplay(index) {
            sentenceData.forEach(s => s.element.classList.remove('active'));
            const item = sentenceData[index];
            if (item) {
                item.element.classList.add('active');
                const offset = -(index * ITEM_HEIGHT) - (ITEM_HEIGHT / 2);
                document.getElementById('scroller').style.transform = `translateY(${offset}px)`;
            }
        }

        function speakStep() {
            if (!isPlaying || isPaused) return;

            if (currentIndex >= sentenceData.length) {
                if (isLooping) {
                    currentIndex = 0;
                    repeatCounter = 0;
                    speakStep();          // ← NO 1s pause
                } else {
                    stopSpeech();
                }
                return;
            }

            const currentItem = sentenceData[currentIndex];
            updateDisplay(currentIndex);

            const utterance = new SpeechSynthesisUtterance(currentItem.text);
            utterance.lang = currentItem.lang;

            const voices = synth.getVoices();
            const voice = voices.find(v => v.lang.startsWith(currentItem.lang));
            if (voice) utterance.voice = voice;

            utterance.onend = () => {
                if (!isPlaying || isPaused) return;
                repeatCounter++;
                if (repeatCounter < currentItem.maxRepeats) {
                    speakStep();          // ← NO 0.4s pause (was 400ms)
                } else {
                    currentIndex++;
                    repeatCounter = 0;
                    speakStep();          // ← NO 0.8s pause (was 800ms)
                }
            };

            utterance.onerror = () => { if (isPlaying) stopSpeech(); };
            synth.speak(utterance);
        }

        function startPlayAll() {
            if (sentenceData.length === 0) return;
            synth.cancel(); 
            isPlaying = true;
            isPaused = false;
            currentIndex = 0;
            repeatCounter = 0;
            
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'flex';
            document.getElementById('pauseBtn').innerText = "⏸ Pause";
            
            speakStep();
        }

        function togglePause() {
            if (!isPlaying) return;
            if (!isPaused) {
                isPaused = true;
                synth.pause();
                document.getElementById('pauseBtn').innerText = "▶ Reprendre";
            } else {
                isPaused = false;
                document.getElementById('pauseBtn').innerText = "⏸ Pause";
                if (synth.paused) synth.resume();
                else speakStep();
            }
        }

        function stopSpeech() {
            isPlaying = false;
            isPaused = false;
            synth.cancel();
            document.getElementById('playBtn').style.display = 'flex';
            document.getElementById('playBtn').disabled = (sentenceData.length === 0);
            document.getElementById('pauseBtn').style.display = 'none';
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = document.getElementById('loopBtn');
            if (isLooping) {
                btn.classList.add('active');
                btn.innerText = "🔁 Boucle : ON";
            } else {
                btn.classList.remove('active');
                btn.innerText = "🔁 Boucle : OFF";
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => synth.getVoices();
        }

        // ============================================================
        //  FLOATING CAMERA
        // ============================================================
        let currentStream = null;
        let currentTrack = null;
        let currentFacingMode = 'user';
        let torchEnabled = false;
        let filterEnabled = true;
        let isDragging = false;
        let startX, startY, startLeft, startTop;
        let cameraAvailable = false;

        (function initFloatingCamera() {
            const videoEl = document.getElementById('cameraVideo');
            const floatContainer = document.getElementById('cameraFloat');
            const flashOverlay = document.getElementById('flashOverlay');
            const switchCamBtn = document.getElementById('switchCamBtn');
            const flashBtn = document.getElementById('flashBtn');
            const filterBtn = document.getElementById('filterBtn');

            async function checkTorchSupport(track) {
                if (!track || !track.getCapabilities) return false;
                try { return !!track.getCapabilities().torch; } catch (e) { return false; }
            }

            async function setTorch(on) {
                if (!currentTrack) return false;
                try {
                    await currentTrack.applyConstraints({ advanced: [{ torch: on }] });
                    return true;
                } catch (err) { return false; }
            }

            function triggerScreenFlash() {
                flashOverlay.classList.add('active');
                setTimeout(() => flashOverlay.classList.remove('active'), 120);
                setTimeout(() => {
                    flashOverlay.classList.add('active');
                    setTimeout(() => flashOverlay.classList.remove('active'), 90);
                }, 180);
            }

            async function startCamera(facingMode = 'user') {
                if (currentStream) {
                    if (currentTrack && torchEnabled) { try { await setTorch(false); } catch(e){} }
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                    currentTrack = null;
                }
                torchEnabled = false;
                flashBtn.classList.remove('flash-active');

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: facingMode,
                            width: { ideal: 1920, min: 1280 },
                            height: { ideal: 1080, min: 720 },
                            frameRate: { ideal: 30, min: 24 },
                            aspectRatio: { ideal: 1 }
                        },
                        audio: false
                    });
                    currentStream = stream;
                    currentTrack = stream.getVideoTracks()[0];
                    videoEl.srcObject = stream;
                    await videoEl.play();
                    cameraAvailable = true;

                    const s = currentTrack.getSettings();
                    console.log(`Camera ${facingMode} — ${s.width}x${s.height} @ ${s.frameRate}fps`);
                    
                    videoEl.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
                    
                    const fallback = floatContainer.querySelector('.camera-fallback');
                    if (fallback) fallback.remove();
                    videoEl.style.display = 'block';
                    switchCamBtn.style.display = 'flex';
                    flashBtn.style.display = 'flex';
                    filterBtn.style.display = 'flex';

                    const torchSupported = await checkTorchSupport(currentTrack);
                    flashBtn.title = torchSupported ? 'Flash (torche matérielle)' : 'Flash (écran)';
                } catch (err) {
                    console.warn('HD camera failed, trying fallback:', err);
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: facingMode },
                            audio: false
                        });
                        currentStream = stream;
                        currentTrack = stream.getVideoTracks()[0];
                        videoEl.srcObject = stream;
                        await videoEl.play();
                        cameraAvailable = true;
                        videoEl.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
                    } catch (err2) {
                        if (facingMode === 'environment') {
                            try { await startCamera('user'); currentFacingMode = 'user'; }
                            catch (err3) { showCameraFallback('Caméra indisponible'); }
                        } else {
                            showCameraFallback('Caméra indisponible');
                        }
                    }
                }
            }

            function showCameraFallback(message) {
                cameraAvailable = false;
                videoEl.style.display = 'none';
                switchCamBtn.style.display = 'none';
                flashBtn.style.display = 'none';
                filterBtn.style.display = 'none';
                const existing = floatContainer.querySelector('.camera-fallback');
                if (existing) existing.remove();
                const fallback = document.createElement('div');
                fallback.className = 'camera-fallback';
                fallback.style.cssText = `
                    width: 100%; height: 100%; display: flex; flex-direction: column;
                    align-items: center; justify-content: center;
                    background: #1e1e1e; color: #ccc; font-size: 10px; 
                    text-align: center; padding: 8px; box-sizing: border-box; gap: 4px;
                    border-radius: 50%;
                `;
                fallback.innerHTML = `<div style="font-size: 22px;">📷</div><div>${message}</div>`;
                floatContainer.appendChild(fallback);
            }

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                startCamera('user');
            } else {
                showCameraFallback('API non supportée');
            }

            switchCamBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (!cameraAvailable) return;
                const newMode = currentFacingMode === 'user' ? 'environment' : 'user';
                currentFacingMode = newMode;
                await startCamera(newMode);
            });

            flashBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (!cameraAvailable || !currentTrack) return;
                const torchSupported = await checkTorchSupport(currentTrack);
                if (torchSupported) {
                    torchEnabled = !torchEnabled;
                    const ok = await setTorch(torchEnabled);
                    if (ok) flashBtn.classList.toggle('flash-active', torchEnabled);
                    else { torchEnabled = false; triggerScreenFlash(); }
                } else {
                    triggerScreenFlash();
                    flashBtn.classList.add('flash-active');
                    setTimeout(() => flashBtn.classList.remove('flash-active'), 400);
                }
            });

            filterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                filterEnabled = !filterEnabled;
                if (filterEnabled) {
                    videoEl.style.filter = 'brightness(1.03) contrast(1.06) saturate(1.1)';
                    filterBtn.style.color = '#ffaa00';
                } else {
                    videoEl.style.filter = 'none';
                    filterBtn.style.color = 'white';
                }
            });
            if (filterEnabled) {
                videoEl.style.filter = 'brightness(1.03) contrast(1.06) saturate(1.1)';
                filterBtn.style.color = '#ffaa00';
            }

            function setInitialPosition() {
                const rect = floatContainer.getBoundingClientRect();
                floatContainer.style.bottom = 'auto';
                floatContainer.style.right = 'auto';
                floatContainer.style.left = rect.left + 'px';
                floatContainer.style.top = rect.top + 'px';
                floatContainer.style.position = 'fixed';
            }
            setInitialPosition();
            
            window.addEventListener('resize', () => {
                const rect = floatContainer.getBoundingClientRect();
                const maxLeft = window.innerWidth - rect.width;
                const maxTop = window.innerHeight - rect.height;
                let left = Math.min(parseFloat(floatContainer.style.left) || rect.left, maxLeft);
                let top = Math.min(parseFloat(floatContainer.style.top) || rect.top, maxTop);
                left = Math.max(0, left);
                top = Math.max(0, top);
                floatContainer.style.left = left + 'px';
                floatContainer.style.top = top + 'px';
            });

            floatContainer.addEventListener('mousedown', (e) => {
                if (e.target.closest('.cam-btn')) return;
                e.preventDefault();
                isDragging = true;
                const rect = floatContainer.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                floatContainer.style.cursor = 'grabbing';
                floatContainer.style.transition = 'none';
                floatContainer.style.willChange = 'left, top';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                let newLeft = startLeft + dx;
                let newTop = startTop + dy;
                const rect = floatContainer.getBoundingClientRect();
                const maxLeft = window.innerWidth - rect.width;
                const maxTop = window.innerHeight - rect.height;
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                floatContainer.style.left = newLeft + 'px';
                floatContainer.style.top = newTop + 'px';
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    floatContainer.style.cursor = 'grab';
                    floatContainer.style.transition = 'box-shadow 0.2s, transform 0.15s';
                    floatContainer.style.willChange = 'auto';
                }
            });

            floatContainer.addEventListener('touchstart', (e) => {
                if (e.target.closest('.cam-btn')) return;
                const touch = e.touches[0];
                if (!touch) return;
                e.preventDefault();
                isDragging = true;
                const rect = floatContainer.getBoundingClientRect();
                startX = touch.clientX;
                startY = touch.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                floatContainer.style.cursor = 'grabbing';
                floatContainer.style.transition = 'none';
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                if (!touch) return;
                e.preventDefault();
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                let newLeft = startLeft + dx;
                let newTop = startTop + dy;
                const rect = floatContainer.getBoundingClientRect();
                const maxLeft = window.innerWidth - rect.width;
                const maxTop = window.innerHeight - rect.height;
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                floatContainer.style.left = newLeft + 'px';
                floatContainer.style.top = newTop + 'px';
            }, { passive: false });

            window.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    floatContainer.style.cursor = 'grab';
                    floatContainer.style.transition = 'box-shadow 0.2s, transform 0.15s';
                }
            });

            floatContainer.style.cursor = 'grab';

            window.addEventListener('beforeunload', () => {
                if (currentTrack && torchEnabled) {
                    try { currentTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch(e){}
                }
            });
        })();

        // ============================================================
        //  RECORDING
        // ============================================================
        (function initRecorder() {
            const recordBtn = document.getElementById('recordBtn');
            const camRecordBtn = document.getElementById('camRecordBtn');
            const recTimer = document.getElementById('recTimer');
            const recTime  = document.getElementById('recTime');
            const recIndicator = document.getElementById('recIndicator');
            const stage = document.getElementById('stage');
            const videoEl = document.getElementById('cameraVideo');
            const previewPanel = document.getElementById('previewPanel');
            const previewCanvas = document.getElementById('previewCanvas');
            const micBars = document.getElementById('micBars');
            const micBarEls = micBars.querySelectorAll('span');
            const cameraFloat = document.getElementById('cameraFloat');

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const previewCtx = previewCanvas.getContext('2d');

            function applyQuality() {
                canvas.width = currentQuality.w;
                canvas.height = currentQuality.h;
                previewCanvas.width = currentQuality.w;
                previewCanvas.height = currentQuality.h;
                qualityBadge.textContent = currentQuality.label;
                console.log(`Quality set: ${currentQuality.w}x${currentQuality.h} @ ${currentQuality.fps}fps, ${currentQuality.videoBitrate/1e6}Mbps`);
            }
            applyQuality();

            let recorder = null;
            let chunks = [];
            let rafId = null;
            let timerInterval = null;
            let recStart = 0;
            let isRecording = false;

            let micStream = null;
            let audioCtx = null;
            let analyser = null;
            let micRafId = null;

            function fmtTime(ms) {
                const s = Math.floor(ms / 1000);
                const m = Math.floor(s / 60);
                const ss = s % 60;
                return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
            }

            function pickMimeType() {
                const candidates = [
                    'video/webm;codecs=vp9,opus',
                    'video/webm;codecs=vp8,opus',
                    'video/webm;codecs=vp9',
                    'video/webm;codecs=vp8',
                    'video/webm'
                ];
                for (const c of candidates) {
                    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
                }
                return '';
            }

            function drawComposite(targetCtx, W, H) {
                targetCtx.imageSmoothingEnabled = true;
                targetCtx.imageSmoothingQuality = 'high';

                targetCtx.fillStyle = '#ffffff';
                targetCtx.fillRect(0, 0, W, H);

                targetCtx.textAlign = 'center';
                targetCtx.textBaseline = 'middle';

                const activeEl = document.querySelector('.sentence-item.active');
                if (activeEl) {
                    const isEnglish = activeEl.classList.contains('english');
                    const color = isEnglish ? '#d9534f' : '#0275d8';
                    const text = activeEl.innerText;

                    const fontSize = Math.round(H * 0.12);
                    targetCtx.font = `700 ${fontSize}px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif`;
                    targetCtx.fillStyle = color;

                    const maxWidth = W * 0.82;
                    const words = text.split(' ');
                    const lines = [];
                    let cur = '';
                    for (const w of words) {
                        const test = cur ? cur + ' ' + w : w;
                        if (targetCtx.measureText(test).width > maxWidth && cur) {
                            lines.push(cur);
                            cur = w;
                        } else {
                            cur = test;
                        }
                    }
                    if (cur) lines.push(cur);

                    const lineH = fontSize * 1.15;
                    const totalH = lines.length * lineH;
                    const startY = H / 2 - totalH / 2 + lineH / 2;
                    lines.forEach((line, i) => {
                        targetCtx.fillText(line, W / 2, startY + i * lineH);
                    });
                } else {
                    targetCtx.fillStyle = '#cccccc';
                    targetCtx.font = `500 ${Math.round(H * 0.055)}px 'Segoe UI', sans-serif`;
                    targetCtx.fillText('(aucune phrase active)', W / 2, H / 2);
                }

                if (videoEl && videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
                    const bubble = document.getElementById('cameraFloat');
                    const bubbleRect = bubble.getBoundingClientRect();
                    const stageRect = stage.getBoundingClientRect();

                    const scaleX = W / stageRect.width;
                    const scaleY = H / stageRect.height;

                    const cx = (bubbleRect.left - stageRect.left + bubbleRect.width / 2) * scaleX;
                    const cy = (bubbleRect.top  - stageRect.top  + bubbleRect.height / 2) * scaleY;
                    const radius = (bubbleRect.width / 2) * scaleX;

                    targetCtx.save();
                    targetCtx.beginPath();
                    targetCtx.arc(cx, cy, radius, 0, Math.PI * 2);
                    targetCtx.closePath();
                    targetCtx.clip();

                    targetCtx.translate(cx, cy);
                    if (currentFacingMode === 'user') {
                        targetCtx.scale(-1, 1);
                    }

                    const vw = videoEl.videoWidth;
                    const vh = videoEl.videoHeight;
                    const side = Math.min(vw, vh);
                    const sx = (vw - side) / 2;
                    const sy = (vh - side) / 2;

                    const size = radius * 2;
                    targetCtx.drawImage(videoEl, sx, sy, side, side, -size / 2, -size / 2, size, size);

                    targetCtx.restore();

                    targetCtx.save();
                    targetCtx.beginPath();
                    targetCtx.arc(cx, cy, radius, 0, Math.PI * 2);
                    targetCtx.lineWidth = Math.max(3, radius * 0.065);
                    targetCtx.strokeStyle = '#ffffff';
                    targetCtx.stroke();
                    targetCtx.restore();
                }
            }

            function renderLoop() {
                drawComposite(ctx, canvas.width, canvas.height);
                drawComposite(previewCtx, previewCanvas.width, previewCanvas.height);
                rafId = requestAnimationFrame(renderLoop);
            }

            function updateMicLevel() {
                if (!analyser) return;
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);
                let sum = 0;
                const N = Math.min(40, data.length);
                for (let i = 0; i < N; i++) sum += data[i];
                const avg = sum / N;
                const norm = Math.min(1, avg / 90);

                micBarEls.forEach((bar, i) => {
                    const threshold = (i + 1) / micBarEls.length;
                    const active = norm >= threshold * 0.85;
                    const h = active 
                        ? 6 + (i * 1.5) + (norm * 6) 
                        : 3 + (i * 0.4);
                    bar.style.height = Math.min(12, h) + 'px';
                    bar.style.background = active ? '#ff8a80' : 'rgba(255,138,128,0.3)';
                });

                micRafId = requestAnimationFrame(updateMicLevel);
            }

            async function acquireMicrophone() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            sampleRate: 48000,
                            channelCount: 2
                        },
                        video: false
                    });
                    return stream;
                } catch (err) {
                    console.warn('Microphone unavailable:', err);
                    return null;
                }
            }

            async function startRecording() {
                if (isRecording) return;

                applyQuality();

                micStream = await acquireMicrophone();
                if (!micStream) {
                    alert("Impossible d'accéder au microphone. Vérifiez les permissions.");
                    return;
                }

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.6;
                source.connect(analyser);

                const canvasStream = canvas.captureStream(currentQuality.fps);
                const combinedStream = new MediaStream();
                combinedStream.addTrack(canvasStream.getVideoTracks()[0]);
                micStream.getAudioTracks().forEach(t => combinedStream.addTrack(t));

                const mimeType = pickMimeType();
                const options = mimeType 
                    ? { 
                        mimeType, 
                        videoBitsPerSecond: currentQuality.videoBitrate, 
                        audioBitsPerSecond: 192_000 
                      } 
                    : {};

                try {
                    recorder = new MediaRecorder(combinedStream, options);
                } catch (err) {
                    alert("Impossible de démarrer l'enregistrement : " + err.message);
                    cleanupMedia();
                    return;
                }

                chunks = [];
                recorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) chunks.push(e.data);
                };

                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    chunks = [];
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                    a.href = url;
                    a.download = `lecon-bilingue-${currentQuality.label}-${ts}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 2000);
                };

                previewPanel.classList.add('active');
                renderLoop();
                updateMicLevel();
                recorder.start(1000);

                isRecording = true;
                recStart = Date.now();

                recordBtn.classList.add('recording');
                recordBtn.innerText = '⏹ Stop';

                camRecordBtn.classList.add('active');
                camRecordBtn.innerText = '⏹';
                camRecordBtn.title = 'Arrêter l\'enregistrement';

                cameraFloat.classList.add('recording');
                recTimer.classList.add('active');
                recIndicator.classList.add('active');
                recTime.textContent = '00:00';

                timerInterval = setInterval(() => {
                    recTime.textContent = fmtTime(Date.now() - recStart);
                }, 250);
            }

            function cleanupMedia() {
                if (micRafId) { cancelAnimationFrame(micRafId); micRafId = null; }
                if (micStream) {
                    micStream.getTracks().forEach(t => { try { t.stop(); } catch(e){} });
                    micStream = null;
                }
                if (audioCtx) {
                    try { audioCtx.close(); } catch(e){}
                    audioCtx = null;
                }
                analyser = null;
                micBarEls.forEach(bar => {
                    bar.style.height = '3px';
                    bar.style.background = 'rgba(255,138,128,0.3)';
                });
            }

            function stopRecording() {
                if (!isRecording) return;
                isRecording = false;

                if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

                try { recorder.stop(); } catch (e) {}
                cleanupMedia();

                recordBtn.classList.remove('recording');
                recordBtn.innerText = '⏺ Enregistrer';

                camRecordBtn.classList.remove('active');
                camRecordBtn.innerText = '📷';
                camRecordBtn.title = 'Enregistrer (vidéo + votre voix)';

                cameraFloat.classList.remove('recording');
                recTimer.classList.remove('active');
                recIndicator.classList.remove('active');

                setTimeout(() => {
                    previewPanel.classList.remove('active');
                }, 600);
            }

            recordBtn.addEventListener('click', () => {
                if (isRecording) stopRecording();
                else startRecording();
            });

            camRecordBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isRecording) stopRecording();
                else startRecording();
            });

            window.addEventListener('beforeunload', () => {
                if (isRecording) {
                    try { recorder.stop(); } catch(e){}
                    cleanupMedia();
                }
            });

            qualitySelect.addEventListener('change', () => {
                if (!isRecording) applyQuality();
            });
        })();

        window.addEventListener('load', () => {
            const ta = document.getElementById('textInput');
            if (!ta.value) {
                ta.value = "Hello, how are you?\nBonjour, comment allez-vous ?\nI am learning English.\nJ'apprends l'anglais.";
            }
        });
    </script>
