<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera Split · Recorder</title>
<style>
  :root{
    --bg:#0b0f14;
    --panel:#161b22;
    --panel-2:#1a2029;
    --border:#2a3038;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#4f8ef7;
    --danger:#ef4444;
    --flash:#fbbf24;
    --rec:#ef4444;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    height:100vh; height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    display:flex; flex-direction:column;
    background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ Top bar ============ */
  .topbar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    height:54px; padding:0 14px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#171d25,#12171e);
    z-index:60;
  }
  .brand{
    display:flex; align-items:center; gap:9px;
    font-weight:650; font-size:14px; letter-spacing:.2px;
    white-space:nowrap;
  }
  .brand .mark{
    width:20px; height:20px; border-radius:6px;
    background:linear-gradient(135deg,var(--accent),#8b5cf6);
    box-shadow:0 0 0 1px #ffffff14 inset;
  }
  .spacer{ flex:1 1 auto; }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    font:inherit; font-size:13px; color:var(--text);
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:7px 12px;
    cursor:pointer; white-space:nowrap;
    transition:background .15s ease, border-color .15s ease, transform .05s ease, opacity .15s ease;
  }
  .btn:hover{ background:#232b35; border-color:#3a424d; }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn .glyph{ font-size:14px; line-height:1; opacity:.9; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:#3f7de6; border-color:#3f7de6; }
  .btn.rec{
    background:#2a1416; border-color:#5c2a2e; color:#fca5a5;
  }
  .btn.rec:hover{ background:#3d1a1e; border-color:#7f3a3f; }
  .btn.rec.live{
    background:var(--rec); border-color:var(--rec); color:#fff;
    animation:livePulse 2s ease-in-out infinite;
  }
  .btn.rec.live:hover{ background:#dc2626; border-color:#dc2626; }
  @keyframes livePulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(239,68,68,.6); }
    50%    { box-shadow:0 0 0 6px rgba(239,68,68,0); }
  }

  /* ============ Stage ============ */
  .stage{
    flex:1 1 auto; min-height:0; min-width:0;
    display:grid; padding:10px;
  }
  .stage[data-layout="vertical"]{
    grid-template-columns: var(--a,50%) 12px minmax(0,1fr);
    grid-template-rows: minmax(0,1fr);
  }
  .stage[data-layout="horizontal"]{
    grid-template-columns: minmax(0,1fr);
    grid-template-rows: var(--a,50%) 12px minmax(0,1fr);
  }

  /* ============ Divider ============ */
  .divider{
    display:flex; align-items:center; justify-content:center;
    touch-action:none; outline:none; border-radius:99px;
  }
  .divider::before{
    content:"";
    background:var(--border); border-radius:99px;
    transition:background .15s ease;
  }
  .stage[data-layout="vertical"] .divider{ cursor:col-resize; }
  .stage[data-layout="vertical"] .divider::before{ width:4px; height:64px; }
  .stage[data-layout="horizontal"] .divider{ cursor:row-resize; }
  .stage[data-layout="horizontal"] .divider::before{ width:64px; height:4px; }

  .divider:hover::before,
  .divider:focus-visible::before,
  .divider.dragging::before{ background:var(--accent); }

  /* ============ Pane ============ */
  .pane{
    display:flex; flex-direction:column;
    min-width:0; min-height:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
  }

  .pane-bar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:8px;
    background:var(--panel-2);
    border-bottom:1px solid var(--border);
  }

  .pane-title{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:600; color:#b9c2cd;
    letter-spacing:.2px; white-space:nowrap;
    padding-left:4px;
  }
  .rec-dot{
    width:8px; height:8px; border-radius:50%;
    background:#3a424d;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .rec-dot.on{
    background:var(--danger);
    box-shadow:0 0 0 3px rgba(239,68,68,.2);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  .seg{
    display:flex; gap:2px; padding:2px;
    background:#0b0f14;
    border:1px solid var(--border);
    border-radius:9px;
    flex:0 0 auto;
  }
  .seg-btn{
    font:inherit; font-size:12px; font-weight:550;
    color:var(--muted); background:transparent;
    border:0; border-radius:7px;
    padding:5px 10px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .seg-btn:hover{ color:var(--text); }
  .seg-btn.on{ background:var(--accent); color:#fff; }

  .urlbar{ flex:1 1 auto; display:flex; gap:6px; min-width:0; }
  .url-input{
    flex:1 1 auto; min-width:0;
    font:inherit; font-size:13px; color:var(--text);
    background:#0b0f14;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 10px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .url-input::placeholder{ color:#5c6672; }
  .url-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(79,142,247,.16);
  }
  .go{ padding:6px 12px; border-radius:8px; }

  .icon{
    width:30px; height:30px;
    display:grid; place-items:center;
    font:inherit; font-size:14px;
    color:var(--muted); background:transparent;
    border:1px solid transparent;
    border-radius:8px; cursor:pointer; flex:0 0 auto;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon:hover{ color:var(--text); background:#222a34; border-color:var(--border); }
  .icon.on{ color:#fff; background:var(--accent); border-color:var(--accent); }

  .select{
    font:inherit; font-size:12.5px; color:var(--text);
    background:#0b0f14;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px; outline:none;
    max-width:170px; cursor:pointer;
  }
  .select:focus{ border-color:var(--accent); }

  .pane-body{
    position:relative;
    flex:1 1 auto; min-height:0;
    background:#05080b;
  }

  /* ============ Camera layers ============ */
  .cam-wrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:#05080b;
    isolation:isolate;
  }
  .cam-video{
    position:absolute; inset:0;
    z-index:1;
    width:100%; height:100%;
    object-fit:cover; display:block;
    background:#000;
  }
  .cam-video.mirror{ transform:scaleX(-1); }

  .cam-canvas{
    position:absolute; inset:0;
    z-index:2;
    pointer-events:none;
  }

  .screen-flash{
    position:absolute; inset:0;
    z-index:3;
    pointer-events:none;
    opacity:0;
    background:
      radial-gradient(circle at 50% 38%, #fffdf7 0%, #fff3d9 45%, #ffe3ac 100%);
    transition: opacity .3s ease;
  }
  .screen-flash.on{ opacity:.5; }
  .screen-flash.burst{ opacity:1; transition: opacity .04s ease; }

  .cam-overlay{
    position:absolute; inset:0;
    z-index:4;
    display:flex; flex-direction:column; justify-content:space-between;
    pointer-events:none;
  }
  .cam-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px;
    padding:10px;
  }
  .cam-top-group{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .cam-overlay .cam-btn{ pointer-events:auto; }

  .cam-bottom-group{
    display:flex; flex-direction:column; gap:10px;
    padding:0 0 14px;
    background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.36) 58%, transparent);
  }

  .filter-strip{
    display:flex; gap:8px;
    padding:0 12px;
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .filter-strip::-webkit-scrollbar{ display:none; }

  .chip{
    flex:0 0 auto;
    display:inline-flex; align-items:center; gap:7px;
    height:38px; padding:0 14px;
    font:inherit; font-size:12.5px; font-weight:600;
    color:#fff;
    background:rgba(20,26,34,.72);
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;
    cursor:pointer; white-space:nowrap;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition:background .15s ease, border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .chip:hover{ background:rgba(38,47,58,.9); border-color:rgba(255,255,255,.28); }
  .chip:active{ transform:scale(.95); }
  .chip.on{
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 6px 18px -6px rgba(79,142,247,.75);
  }
  .chip .emoji{ font-size:15px; line-height:1; }

  .cam-bottom{
    display:flex; align-items:center; justify-content:center;
    gap:20px; padding:0 12px;
  }

  .cam-btn{
    height:40px; min-width:40px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font:inherit; font-size:13px; font-weight:550;
    color:#fff;
    background:rgba(20,26,34,.72);
    border:1px solid rgba(255,255,255,.14);
    border-radius:11px;
    padding:0 13px;
    cursor:pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition:background .15s ease, border-color .15s ease, transform .05s ease, opacity .15s ease, color .15s ease;
  }
  .cam-btn:hover{ background:rgba(38,47,58,.9); border-color:rgba(255,255,255,.28); }
  .cam-btn:active{ transform:translateY(1px); }
  .cam-btn.on{ background:var(--accent); border-color:var(--accent); }
  .cam-btn.on.flash{ background:var(--flash); border-color:var(--flash); color:#1a1400; }
  .cam-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .cam-btn.mic-off{ color:#9aa3ae; }
  .cam-btn.mic-off .mic-bar{ display:block; }

  /* mic slash overlay */
  .mic-slashed{ position:relative; }
  .mic-slashed::after{
    content:"";
    position:absolute; left:50%; top:50%;
    width:22px; height:2px;
    background:var(--danger);
    border-radius:2px;
    transform:translate(-50%,-50%) rotate(-45deg);
    pointer-events:none;
  }

  /* record timer pill */
  .rec-timer{
    position:absolute;
    top:10px; left:50%;
    transform:translateX(-50%);
    z-index:5;
    display:none;
    align-items:center; gap:8px;
    padding:6px 14px;
    font-size:13px; font-weight:700;
    color:#fff;
    background:rgba(15,5,5,.82);
    border:1px solid rgba(239,68,68,.5);
    border-radius:999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-variant-numeric: tabular-nums;
    letter-spacing:.5px;
    pointer-events:none;
  }
  .rec-timer.show{ display:inline-flex; }
  .rec-timer .blink{
    width:9px; height:9px; border-radius:50%;
    background:var(--rec);
    animation:recBlink 1s steps(2,end) infinite;
  }
  @keyframes recBlink{ 0%,49%{opacity:1} 50%,100%{opacity:.15} }
  .rec-timer .mic-flag{ font-size:11px; color:#fca5a5; }

  /* big shutter + record button */
  .shutter{
    width:66px; height:66px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.85);
    background:transparent;
    display:grid; place-items:center;
    cursor:pointer; padding:0;
    position:relative;
    transition: transform .1s ease, border-color .15s ease;
    pointer-events:auto;
  }
  .shutter::before{
    content:"";
    width:48px; height:48px; border-radius:50%;
    background:#fff;
    box-shadow: 0 4px 16px -4px rgba(0,0,0,.85);
    transition: background .15s ease, transform .15s ease, border-radius .15s ease;
  }
  .shutter:hover{ border-color:#fff; }
  .shutter:hover::before{ background:#ffe9b0; }
  .shutter:active{ transform:scale(.93); }
  .shutter:active::before{ transform:scale(.86); }
  .shutter:disabled{ opacity:.35; cursor:not-allowed; }

  /* record button — turns into a red square while recording */
  .rec-btn{
    width:66px; height:66px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.85);
    background:transparent;
    display:grid; place-items:center;
    cursor:pointer; padding:0;
    position:relative;
    transition: transform .1s ease, border-color .15s ease, background .15s ease;
    pointer-events:auto;
  }
  .rec-btn::before{
    content:"";
    width:48px; height:48px; border-radius:50%;
    background:var(--rec);
    box-shadow: 0 4px 16px -4px rgba(0,0,0,.85), 0 0 22px -4px rgba(239,68,68,.7);
    transition: background .15s ease, transform .2s ease, border-radius .2s ease;
  }
  .rec-btn:hover{ border-color:#fff; }
  .rec-btn:hover::before{ background:#f87171; }
  .rec-btn:active{ transform:scale(.93); }
  .rec-btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* recording state → inner square */
  .rec-btn.live::before{
    width:28px; height:28px;
    border-radius:7px;
    background:#fff;
    box-shadow: 0 4px 16px -4px rgba(0,0,0,.85);
  }
  .rec-btn.live{ border-color:var(--rec); }
  .rec-btn.live:hover::before{ background:#fecaca; }
  .rec-btn.live{ animation: livePulse 2s ease-in-out infinite; }

  /* status badge */
  .fx-status{
    position:absolute;
    bottom:10px; left:10px;
    z-index:5;
    display:none;
    align-items:center; gap:7px;
    padding:6px 12px;
    font-size:11.5px; font-weight:600;
    color:#fff;
    background:rgba(20,26,34,.8);
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    pointer-events:none;
  }
  .fx-status.show{ display:inline-flex; }
  .fx-status .spinner{
    width:12px; height:12px;
    border:2px solid rgba(255,255,255,.28);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* camera off / error state */
  .cam-state{
    position:absolute; inset:0;
    z-index:6;
    display:none;
    place-items:center; text-align:center;
    padding:26px;
    background:#05080b;
  }
  .cam-state.show{ display:grid; }
  .cam-state .cs-icon{ font-size:34px; margin-bottom:12px; opacity:.8; }
  .cam-state p{ margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.6; max-width:330px; }
  .cam-state .cs-err{ color:#fca5a5; }

  .flash{
    position:absolute; inset:0;
    z-index:7;
    background:#fff; opacity:0;
    pointer-events:none;
  }
  .flash.fire{ animation:flash .42s ease-out; }
  @keyframes flash{ 0%{opacity:.92} 100%{opacity:0} }

  /* ============ Content pane ============ */
  .frame, .note, .placeholder{ display:none; }
  .frame{ width:100%; height:100%; border:0; background:#fff; }
  .note{
    width:100%; height:100%;
    border:0; outline:none; resize:none;
    padding:16px 18px;
    background:#0f141a; color:var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:13.5px; line-height:1.65;
  }
  .note::placeholder{ color:#4f5865; }

  .placeholder{
    position:absolute; inset:0;
    place-items:center; text-align:center;
    padding:28px; color:var(--muted);
    font-size:13px; line-height:1.6;
  }
  .placeholder .ph-icon{ font-size:26px; margin-bottom:10px; opacity:.8; }
  .placeholder p{ margin:0; }
  .placeholder .ph-sub{ margin-top:8px; font-size:12px; color:#5c6672; max-width:330px; }

  .pane.mode-web  .frame{ display:block; }
  .pane.mode-note .note{ display:block; }
  .pane.mode-note .urlbar,
  .pane.mode-note .pane-actions [data-act="reload"]{ display:none; }
  .pane-body.empty .frame{ display:none; }
  .pane-body.empty .placeholder{ display:grid; }

  /* ============ Snapshot / Recording preview modal ============ */
  .modal{
    position:fixed; inset:0;
    display:none; place-items:center; padding:20px;
    background:rgba(3,6,10,.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index:200;
  }
  .modal.show{ display:grid; }
  .modal-card{
    width:min(560px,100%);
    max-height:88vh;
    display:flex; flex-direction:column;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.95);
    animation:pop .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{ from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }
  .modal-head{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--border);
    font-size:13.5px; font-weight:600;
  }
  .modal-head .spacer{ flex:1; }
  .modal-img{
    width:100%; max-height:62vh;
    object-fit:contain; background:#000; display:block;
  }
  .modal-video{
    width:100%; max-height:62vh;
    background:#000; display:block;
  }
  .modal-meta{
    display:flex; align-items:center; gap:12px;
    padding:8px 14px;
    font-size:12px; color:var(--muted);
    border-top:1px solid var(--border);
    background:#0d1218;
  }
  .modal-meta .tag{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px;
    background:#1a2029;
    border:1px solid var(--border);
    border-radius:999px;
  }
  .modal-actions{
    display:flex; gap:8px; justify-content:flex-end;
    padding:12px 14px;
    border-top:1px solid var(--border);
    background:var(--panel-2);
  }

  /* ============ Responsive ============ */
  @media (max-width:720px){
    .btn .label{ display:none; }
    .btn{ padding:7px 10px; }
    .brand span{ display:none; }
    .topbar{ padding:0 10px; gap:6px; }
    .stage{ padding:8px; }
    .pane-bar{ gap:6px; padding:6px; }
    .seg-btn{ padding:5px 8px; }
    .select{ max-width:110px; }
    .cam-btn{ padding:0 10px; font-size:12px; height:36px; min-width:36px; }
    .chip{ height:34px; padding:0 12px; font-size:12px; }
    .shutter, .rec-btn{ width:58px; height:58px; }
    .shutter::before, .rec-btn::before{ width:42px; height:42px; }
    .rec-btn.live::before{ width:24px; height:24px; border-radius:6px; }
    .cam-bottom{ gap:14px; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="mark"></div><span>Camera Split · Recorder</span>
    </div>
    <div class="spacer"></div>
    <button class="btn" data-act="layout" title="Toggle layout">
      <span class="glyph">▥</span><span class="label">Side by side</span>
    </button>
    <button class="btn" data-act="swap" title="Swap panes">
      <span class="glyph">⇄</span><span class="label">Swap</span>
    </button>
    <button class="btn" data-act="snapshot" title="Take snapshot">
      <span class="glyph">◉</span><span class="label">Snapshot</span>
    </button>
    <button class="btn rec" data-act="record" id="recTopBtn" title="Start / stop recording">
      <span class="glyph">●</span><span class="label">Record</span>
    </button>
    <button class="btn" data-act="reset" title="Reset">
      <span class="glyph">↺</span><span class="label">Reset</span>
    </button>
  </header>

  <main class="stage" id="stage" data-layout="vertical">

    <!-- ===================== CAMERA PANE ===================== -->
    <section class="pane" id="camPane">
      <div class="pane-bar">
        <div class="pane-title">
          <span class="rec-dot" id="recDot"></span>
          Camera
        </div>
        <select class="select" id="camSelect" title="Select camera"></select>
        <div class="spacer"></div>
        <button class="icon" id="micToggle" title="Microphone for recording">🎤</button>
        <button class="icon" id="camToggle" title="Start / stop camera">⏻</button>
      </div>

      <div class="pane-body" id="camBody">
        <div class="cam-wrap" id="camWrap">
          <video class="cam-video" id="video" playsinline autoplay muted></video>
          <canvas class="cam-canvas" id="fxCanvas"></canvas>
          <div class="screen-flash" id="screenFlash"></div>
        </div>

        <div class="rec-timer" id="recTimer">
          <span class="blink"></span>
          <span id="recTime">00:00</span>
          <span class="mic-flag" id="recMicFlag"></span>
        </div>

        <div class="fx-status" id="fxStatus"></div>

        <div class="cam-overlay">
          <div class="cam-top">
            <div class="cam-top-group">
              <button class="cam-btn" id="btnBeauty" title="Beauty filter">✨</button>
              <button class="cam-btn flash" id="btnFlash" title="Flash">⚡</button>
            </div>

              <button class="cam-btn" id="btnMirror" title="Mirror preview">⇋</button>
              <button class="cam-btn" id="btnFlip" title="Switch camera">🔄</button>

    <!-- ===================== CONTENT PANE ===================== -->
    <section class="pane mode-web" id="contentPane">

        <div class="placeholder">
          <div>
            <div class="ph-icon">🌐</div>

  </main>

  <datalist id="url-presets">
    <option value="https://en.wikipedia.org/wiki/Main_Page"></option>
    <option value="https://example.com"></option>
    <option value="https://www.openstreetmap.org"></option>
    <option value="https://news.ycombinator.com"></option>
    <option value="https://developer.mozilla.org"></option>
  </datalist>

  <!-- ===================== PREVIEW MODAL (snapshot OR recording) ===================== -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-head">
        <span id="modalIcon">◉</span>
        <span id="modalTitle">Snapshot</span>
        <span class="spacer"></span>
        <button class="icon" id="modalClose" title="Close">✕</button>
      </div>

      <img class="modal-img" id="modalImg" alt="Snapshot preview">
      <video class="modal-video" id="modalVideo" controls playsinline style="display:none"></video>

      <div class="modal-meta" id="modalMeta" style="display:none">
        <span class="tag" id="metaDuration">⏱ 00:00</span>
        <span class="tag" id="metaSize">📦 0 MB</span>
        <span class="tag" id="metaType">🎬</span>
