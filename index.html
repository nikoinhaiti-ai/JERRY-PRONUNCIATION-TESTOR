<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apprentissage Bilingue TTS + Caméra flottante</title>
<style>
    :root {
        --en-red: #d9534f;
        --fr-blue: #0275d8;
        --border-color: #eeeeee;
        --success-green: #28a745;
        --record-red: #e53935;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ffffff;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
    }

    .input-section {
        width: 100%;
        max-width: 850px;
        margin-bottom: 30px;
    }

    textarea {
        width: 100%;
        height: 100px;
        background: #fafafa;
        color: #333;
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: 12px;
        font-size: 16px;
        resize: none;
        box-sizing: border-box;
        outline: none;
    }

    .controls {
        margin-top: 15px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        align-items: center;
    }

    button {
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    #loadBtn { background: #f0f0f0; color: #555; }
    #playBtn { background: #ff0000; color: white; }
    #pauseBtn { background: #f0ad4e; color: white; display: none; }
    #stopBtn { background: #333; color: white; }
    #loopBtn { background: #f0f0f0; color: #555; border: 2px solid transparent; }
    #recordBtn { background: var(--record-red); color: white; border: 2px solid transparent; }
    #recordBtn.recording {
        background: #b71c1c;
        border-color: #ff8a80;
        animation: recPulse 1.2s infinite;
    }

    @keyframes recPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.6); }
        50%      { box-shadow: 0 0 0 8px rgba(229, 57, 53, 0); }
    }

    #loopBtn.active { 
        background: var(--success-green); 
        color: white; 
        border-color: #1e7e34;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.9; }
    button:disabled { opacity: 0.2; cursor: not-allowed; }

    /* CONTENEUR FORMAT YOUTUBE (16:9) */
    .stage {
        width: 100%;
        max-width: 850px;
        aspect-ratio: 16 / 9;
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        border: 1px solid var(--border-color);
        margin-top: 10px;
    }

    #scroller {
        position: absolute;
        width: 100%;
        top: 50%; 
        left: 0;
        transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        will-change: transform;
    }

    .sentence-item {
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 60px;
        font-size: 40px;
        font-weight: 700;
        box-sizing: border-box;
        transition: opacity 0.5s, transform 0.5s;
        opacity: 0.05; 
    }

    .sentence-item.active {
        opacity: 1;
        transform: scale(1.08);
    }

    .english { color: var(--en-red); }
    .french { color: var(--fr-blue); }

    .center-guide {
        position: absolute;
        top: 50%;
        left: 5%;
        right: 5%;
        height: 1px;
        background: rgba(0,0,0,0.02);
        pointer-events: none;
        transform: translateY(-50%);
    }

    /* --- FLOATING CAMERA WIDGET --- */
    .camera-float {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        border: 3px solid #fff;
        background: #111;
        z-index: 1000;
        cursor: grab;
        transition: box-shadow 0.2s, transform 0.15s;
        user-select: none;
        touch-action: none;
    }

    .camera-float:active {
        cursor: grabbing;
        box-shadow: 0 18px 40px rgba(0,0,0,0.5);
    }

    .camera-float:hover { transform: scale(1.03); }

    .camera-float video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000;
        transform: scaleX(-1);
        transition: transform 0.3s ease, filter 0.3s ease;
        filter: brightness(1.05) contrast(1.05) saturate(1.1) blur(0.3px);
        border-radius: 50%;
    }

    .flash-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: white;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.08s ease;
        z-index: 10;
        border-radius: 50%;
    }
    .flash-overlay.active { opacity: 1; }

    .camera-controls {
        position: absolute;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 5px;
        z-index: 30;
        opacity: 0.75;
        transition: opacity 0.2s;
    }
    .camera-controls:hover { opacity: 1; }

    .cam-btn {
        background: rgba(0,0,0,0.6);
        border: none;
        color: white;
        border-radius: 50%;
        width: 26px; height: 26px;
        font-size: 13px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(4px);
        transition: background 0.2s, transform 0.1s, color 0.2s;
        padding: 0;
    }
    .cam-btn:hover { background: rgba(0,0,0,0.9); transform: scale(1.1); }
    .cam-btn.flash-active {
        background: #ffaa00;
        color: #000;
        box-shadow: 0 0 12px #ffaa00, 0 0 4px #ffaa00;
    }

    .rec-indicator {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(229, 57, 53, 0.92);
        color: #fff;
        font-size: 10px;
        font-weight: bold;
        padding: 3px 10px;
        border-radius: 20px;
        display: none;
        align-items: center;
        gap: 5px;
        z-index: 25;
        letter-spacing: 0.5px;
        box-shadow: 0 0 12px rgba(229,57,53,0.6);
    }
    .rec-indicator.active { display: flex; }

    .rec-dot {
        width: 7px; height: 7px;
        background: #fff;
        border-radius: 50%;
        animation: recBlink 1s infinite;
    }
    @keyframes recBlink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.2; }
    }

    .rec-timer {
        display: none;
        align-items: center;
        gap: 6px;
        background: #b71c1c;
        color: #fff;
        padding: 12px 14px;
        border-radius: 8px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 0.5px;
    }
    .rec-timer.active { display: flex; }

    /* ---------- PREVIEW PANEL ---------- */
    .preview-panel {
        display: none;
        width: 100%;
        max-width: 850px;
        margin-top: 18px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }
    .preview-panel.active { display: block; }

    .preview-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: #e6edf3;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.4px;
    }
    .preview-header .live-dot {
        width: 8px; height: 8px;
        background: #ff3b30;
        border-radius: 50%;
        box-shadow: 0 0 8px #ff3b30;
        animation: recBlink 1s infinite;
    }
    .preview-header .label {
        text-transform: uppercase;
        color: #ff6b6b;
    }
    .preview-header .hint {
        margin-left: auto;
        font-weight: 400;
        color: #8b949e;
        font-size: 11px;
    }

    .preview-canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        background: #fff;
        aspect-ratio: 16 / 9;
    }

    @media (max-width: 600px) {
        .camera-float {
            width: 100px;
            height: 100px;
            bottom: 15px;
            right: 15px;
        }
        .cam-btn { width: 20px; height: 20px; font-size: 10px; }
    }
</style>
</head>
<body>

    <div class="input-section">
        <textarea id="textInput" placeholder="Ligne 1 : Anglais&#10;Ligne 2 : Français&#10;Ligne 3 : Anglais..."></textarea>
        <div class="controls">
            <button id="loadBtn" onclick="processText()">1. Charger la liste</button>
            <button id="playBtn" onclick="startPlayAll()" disabled>▶ Lire tout</button>
            <button id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
            <button id="stopBtn" onclick="stopSpeech()">⏹ Arrêter</button>
            <button id="loopBtn" onclick="toggleLoop()">🔁 Boucle : OFF</button>
            <button id="recordBtn" title="Enregistrer l'écran + la caméra + le son">⏺ Enregistrer</button>
            <div class="rec-timer" id="recTimer">⏺ <span id="recTime">00:00</span></div>
        </div>
    </div>

    <div class="stage" id="stage">
        <div class="center-guide"></div>
        <div id="scroller"></div>
    </div>

    <!-- Live preview of the recorded composition -->
    <div class="preview-panel" id="previewPanel">
        <div class="preview-header">
            <span class="live-dot"></span>
            <span class="label">REC — Aperçu en direct</span>
            <span class="hint">Ce que la vidéo enregistrée contient</span>
        </div>
        <canvas class="preview-canvas" id="previewCanvas" width="1280" height="720"></canvas>
    </div>

    <!-- Floating camera widget -->
    <div class="camera-float" id="cameraFloat" tabindex="0">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="rec-indicator" id="recIndicator"><span class="rec-dot"></span>REC</div>
        
        <div class="camera-controls">
            <button class="cam-btn" id="switchCamBtn" title="Changer caméra avant/arrière">🔄</button>
            <button class="cam-btn" id="flashBtn" title="Flash (torche)">⚡</button>
            <button class="cam-btn" id="filterBtn" title="Filtre lissant">✨</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  TTS LOGIC
        // ============================================================
        const synth = window.speechSynthesis;
        let sentenceData = [];
        let currentIndex = 0;
        let repeatCounter = 0;
        let isPlaying = false;
        let isPaused = false;
        let isLooping = false;
        const ITEM_HEIGHT = 150; 

        function processText() {
            stopSpeech();
            const input = document.getElementById('textInput').value;
            const scroller = document.getElementById('scroller');
            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== "");

            scroller.innerHTML = "";
            sentenceData = [];

            lines.forEach((line, index) => {
                const isEnglish = index % 2 === 0;
                const langCode = isEnglish ? 'en-US' : 'fr-FR';
                const colorClass = isEnglish ? 'english' : 'french';
                const totalRepeats = isEnglish ? 3 : 2; 

                const div = document.createElement('div');
                div.className = `sentence-item ${colorClass}`;
                div.innerText = line;
                scroller.appendChild(div);

                sentenceData.push({ 
                    text: line, 
                    lang: langCode, 
                    element: div,
                    isEnglish: isEnglish,
                    maxRepeats: totalRepeats
                });
            });

            if (sentenceData.length > 0) {
                scroller.style.transform = `translateY(${-ITEM_HEIGHT / 2}px)`;
                document.getElementById('playBtn').disabled = false;
            }
        }

        function updateDisplay(index) {
            sentenceData.forEach(s => s.element.classList.remove('active'));
            const item = sentenceData[index];
            if (item) {
                item.element.classList.add('active');
                const offset = -(index * ITEM_HEIGHT) - (ITEM_HEIGHT / 2);
                document.getElementById('scroller').style.transform = `translateY(${offset}px)`;
            }
        }

        function speakStep() {
            if (!isPlaying || isPaused) return;

            if (currentIndex >= sentenceData.length) {
                if (isLooping) {
                    currentIndex = 0;
                    repeatCounter = 0;
                    setTimeout(speakStep, 1000);
                } else {
                    stopSpeech();
                }
                return;
            }

            const currentItem = sentenceData[currentIndex];
            updateDisplay(currentIndex);

            const utterance = new SpeechSynthesisUtterance(currentItem.text);
            utterance.lang = currentItem.lang;

            const voices = synth.getVoices();
            const voice = voices.find(v => v.lang.startsWith(currentItem.lang));
            if (voice) utterance.voice = voice;

            utterance.onend = () => {
                if (!isPlaying || isPaused) return;
                repeatCounter++;
                if (repeatCounter < currentItem.maxRepeats) {
                    setTimeout(speakStep, 400); 
                } else {
                    currentIndex++;
                    repeatCounter = 0;
                    setTimeout(speakStep, 800); 
                }
            };

            utterance.onerror = () => { if (isPlaying) stopSpeech(); };
            synth.speak(utterance);
        }

        function startPlayAll() {
            if (sentenceData.length === 0) return;
            synth.cancel(); 
            isPlaying = true;
            isPaused = false;
            currentIndex = 0;
            repeatCounter = 0;
            
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'flex';
            document.getElementById('pauseBtn').innerText = "⏸ Pause";
            
            speakStep();
        }

        function togglePause() {
            if (!isPlaying) return;
            if (!isPaused) {
                isPaused = true;
                synth.pause();
                document.getElementById('pauseBtn').innerText = "▶ Reprendre";
            } else {
                isPaused = false;
                document.getElementById('pauseBtn').innerText = "⏸ Pause";
                if (synth.paused) synth.resume();
                else speakStep();
            }
        }

        function stopSpeech() {
            isPlaying = false;
            isPaused = false;
            synth.cancel();
            document.getElementById('playBtn').style.display = 'flex';
            document.getElementById('playBtn').disabled = (sentenceData.length === 0);
            document.getElementById('pauseBtn').style.display = 'none';
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = document.getElementById('loopBtn');
            if (isLooping) {
                btn.classList.add('active');
                btn.innerText = "🔁 Boucle : ON";
            } else {
                btn.classList.remove('active');
                btn.innerText = "🔁 Boucle : OFF";
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => synth.getVoices();
        }

        // ============================================================
        //  FLOATING CAMERA
        // ============================================================
        let currentStream = null;
        let currentTrack = null;
        let currentFacingMode = 'user';
        let torchEnabled = false;
        let filterEnabled = true;
        let isDragging = false;
        let startX, startY, startLeft, startTop;
        let cameraAvailable = false;

        (function initFloatingCamera() {
            const videoEl = document.getElementById('cameraVideo');
            const floatContainer = document.getElementById('cameraFloat');
            const flashOverlay = document.getElementById('flashOverlay');
            const switchCamBtn = document.getElementById('switchCamBtn');
            const flashBtn = document.getElementById('flashBtn');
            const filterBtn = document.getElementById('filterBtn');

            async function checkTorchSupport(track) {
                if (!track || !track.getCapabilities) return false;
                try { return !!track.getCapabilities().torch; } catch (e) { return false; }
            }

            async function setTorch(on) {
                if (!currentTrack) return false;
                try {
                    await currentTrack.applyConstraints({ advanced: [{ torch: on }] });
                    return true;
                } catch (err) { return false; }
            }

            function triggerScreenFlash() {
                flashOverlay.classList.add('active');
                setTimeout(() => flashOverlay.classList.remove('active'), 120);
                setTimeout(() => {
                    flashOverlay.classList.add('active');
                    setTimeout(() => flashOverlay.classList.remove('active'), 90);
                }, 180);
            }

            async function startCamera(facingMode = 'user') {
                if (currentStream) {
                    if (currentTrack && torchEnabled) { try { await setTorch(false); } catch(e){} }
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                    currentTrack = null;
                }
                torchEnabled = false;
                flashBtn.classList.remove('flash-active');

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 640 } },
                        audio: false
                    });
                    currentStream = stream;
                    currentTrack = stream.getVideoTracks()[0];
                    videoEl.srcObject = stream;
                    await videoEl.play();
                    cameraAvailable = true;
                    
                    videoEl.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
                    
                    const fallback = floatContainer.querySelector('.camera-fallback');
                    if (fallback) fallback.remove();
                    videoEl.style.display = 'block';
                    switchCamBtn.style.display = 'flex';
                    flashBtn.style.display = 'flex';
                    filterBtn.style.display = 'flex';

                    const torchSupported = await checkTorchSupport(currentTrack);
                    flashBtn.title = torchSupported ? 'Flash (torche matérielle)' : 'Flash (écran)';
                } catch (err) {
                    if (facingMode === 'environment') {
                        try { await startCamera('user'); currentFacingMode = 'user'; }
                        catch (err2) { showCameraFallback('Caméra indisponible'); }
                    } else {
                        showCameraFallback('Caméra indisponible');
                    }
                }
            }

            function showCameraFallback(message) {
                cameraAvailable = false;
                videoEl.style.display = 'none';
                switchCamBtn.style.display = 'none';
                flashBtn.style.display = 'none';
                filterBtn.style.display = 'none';
                const existing = floatContainer.querySelector('.camera-fallback');
                if (existing) existing.remove();
                const fallback = document.createElement('div');
                fallback.className = 'camera-fallback';
                fallback.style.cssText = `
                    width: 100%; height: 100%; display: flex; flex-direction: column;
                    align-items: center; justify-content: center;
                    background: #1e1e1e; color: #ccc; font-size: 10px; 
                    text-align: center; padding: 8px; box-sizing: border-box; gap: 4px;
                    border-radius: 50%;
                `;
                fallback.innerHTML = `<div style="font-size: 22px;">📷</div><div>${message}</div>`;
                floatContainer.appendChild(fallback);
            }

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                startCamera('user');
            } else {
                showCameraFallback('API non supportée');
            }

            switchCamBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (!cameraAvailable) return;
                const newMode = currentFacingMode === 'user' ? 'environment' : 'user';
                currentFacingMode = newMode;
                await startCamera(newMode);
            });

            flashBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (!cameraAvailable || !currentTrack) return;
                const torchSupported = await checkTorchSupport(currentTrack);
                if (torchSupported) {
                    torchEnabled = !torchEnabled;
                    const ok = await setTorch(torchEnabled);
                    if (ok) flashBtn.classList.toggle('flash-active', torchEnabled);
                    else { torchEnabled = false; triggerScreenFlash(); }
                } else {
                    triggerScreenFlash();
                    flashBtn.classList.add('flash-active');
                    setTimeout(() => flashBtn.classList.remove('flash-active'), 400);
                }
            });

            filterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                filterEnabled = !filterEnabled;
                if (filterEnabled) {
                    videoEl.style.filter = 'brightness(1.05) contrast(1.05) saturate(1.1) blur(0.3px)';
                    filterBtn.style.color = '#ffaa00';
                } else {
                    videoEl.style.filter = 'none';
                    filterBtn.style.color = 'white';
                }
            });
            if (filterEnabled) {
                videoEl.style.filter = 'brightness(1.05) contrast(1.05) saturate(1.1) blur(0.3px)';
                filterBtn.style.color = '#ffaa00';
            }

            // DRAGGABLE
            function setInitialPosition() {
                const rect = floatContainer.getBoundingClientRect();
                floatContainer.style.bottom = 'auto';
                floatContainer.style.right = 'auto';
                floatContainer.style.left = rect.left + 'px';
                floatContainer.style.top = rect.top + 'px';
                floatContainer.style.position = 'fixed';
            }
            setInitialPosition();
            
            window.addEventListener('resize', () => {
                const rect = floatContainer.getBoundingClientRect();
                const maxLeft = window.innerWidth - rect.width;
                const maxTop = window.innerHeight - rect.height;
                let left = Math.min(parseFloat(floatContainer.style.left) || rect.left, maxLeft);
                let top = Math.min(parseFloat(floatContainer.style.top) || rect.top, maxTop);
                left = Math.max(0, left);
                top = Math.max(0, top);
                floatContainer.style.left = left + 'px';
                floatContainer.style.top = top + 'px';
            });

            floatContainer.addEventListener('mousedown', (e) => {
                if (e.target.closest('.cam-btn')) return;
                e.preventDefault();
                isDragging = true;
                const rect = floatContainer.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                floatContainer.style.cursor = 'grabbing';
                floatContainer.style.transition = 'none';
                floatContainer.style.willChange = 'left, top';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                let newLeft = startLeft + dx;
                let newTop = startTop + dy;
                const rect = floatContainer.getBoundingClientRect();
                const maxLeft = window.innerWidth - rect.width;
                const maxTop = window.innerHeight - rect.height;
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                floatContainer.style.left = newLeft + 'px';
                floatContainer.style.top = newTop + 'px';
            });

            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    floatContainer.style.cursor = 'grab';
                    floatContainer.style.transition = 'box-shadow 0.2s, transform 0.15s';
                    floatContainer.style.willChange = 'auto';
                }
            });

            floatContainer.addEventListener('touchstart', (e) => {
                if (e.target.closest('.cam-btn')) return;
                const touch = e.touches[0];
                if (!touch) return;
                e.preventDefault();
                isDragging = true;
                const rect = floatContainer.getBoundingClientRect();
                startX = touch.clientX;
                startY = touch.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                floatContainer.style.cursor = 'grabbing';
                floatContainer.style.transition = 'none';
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                if (!touch) return;
                e.preventDefault();
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                let newLeft = startLeft + dx;
                let newTop = startTop + dy;
                const rect = floatContainer.getBoundingClientRect();
                const maxLeft = window.innerWidth - rect.width;
                const maxTop = window.innerHeight - rect.height;
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                floatContainer.style.left = newLeft + 'px';
                floatContainer.style.top = newTop + 'px';
            }, { passive: false });

            window.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    floatContainer.style.cursor = 'grab';
                    floatContainer.style.transition = 'box-shadow 0.2s, transform 0.15s';
                }
            });

            floatContainer.style.cursor = 'grab';

            window.addEventListener('beforeunload', () => {
                if (currentTrack && torchEnabled) {
                    try { currentTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch(e){}
                }
            });
        })();

        // ============================================================
        //  RECORDING — video (canvas) + AUDIO (tab capture via getDisplayMedia)
        // ============================================================
        (function initRecorder() {
            const recordBtn = document.getElementById('recordBtn');
            const recTimer = document.getElementById('recTimer');
            const recTime  = document.getElementById('recTime');
            const recIndicator = document.getElementById('recIndicator');
            const stage = document.getElementById('stage');
            const videoEl = document.getElementById('cameraVideo');
            const previewPanel = document.getElementById('previewPanel');
            const previewCanvas = document.getElementById('previewCanvas');

            // Recording canvas (offscreen, 1280x720)
            const canvas = document.createElement('canvas');
            canvas.width = 1280;
            canvas.height = 720;
            const ctx = canvas.getContext('2d');

            // Preview canvas
            const previewCtx = previewCanvas.getContext('2d');
            previewCanvas.width = 1280;
            previewCanvas.height = 720;

            let recorder = null;
            let chunks = [];
            let rafId = null;
            let timerInterval = null;
            let recStart = 0;
            let isRecording = false;

            // Audio capture state
            let displayStream = null;        // getDisplayMedia stream (for audio)
            let audioCtx = null;
            let mixDest = null;
            let combinedStream = null;

            function fmtTime(ms) {
                const s = Math.floor(ms / 1000);
                const m = Math.floor(s / 60);
                const ss = s % 60;
                return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
            }

            function pickMimeType() {
                const candidates = [
                    'video/webm;codecs=vp9,opus',
                    'video/webm;codecs=vp8,opus',
                    'video/webm;codecs=vp9',
                    'video/webm;codecs=vp8',
                    'video/webm'
                ];
                for (const c of candidates) {
                    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
                }
                return '';
            }

            // ---- Draw composite frame ----
            function drawComposite(targetCtx, W, H) {
                targetCtx.fillStyle = '#ffffff';
                targetCtx.fillRect(0, 0, W, H);

                targetCtx.textAlign = 'center';
                targetCtx.textBaseline = 'middle';

                const activeEl = document.querySelector('.sentence-item.active');
                if (activeEl) {
                    const isEnglish = activeEl.classList.contains('english');
                    const color = isEnglish ? '#d9534f' : '#0275d8';
                    const text = activeEl.innerText;

                    const fontSize = Math.round(H * 0.11);
                    targetCtx.font = `700 ${fontSize}px 'Segoe UI', Tahoma, sans-serif`;
                    targetCtx.fillStyle = color;

                    const maxWidth = W * 0.8;
                    const words = text.split(' ');
                    const lines = [];
                    let cur = '';
                    for (const w of words) {
                        const test = cur ? cur + ' ' + w : w;
                        if (targetCtx.measureText(test).width > maxWidth && cur) {
                            lines.push(cur);
                            cur = w;
                        } else {
                            cur = test;
                        }
                    }
                    if (cur) lines.push(cur);

                    const lineH = fontSize * 1.15;
                    const totalH = lines.length * lineH;
                    const startY = H / 2 - totalH / 2 + lineH / 2;
                    lines.forEach((line, i) => {
                        targetCtx.fillText(line, W / 2, startY + i * lineH);
                    });
                } else {
                    targetCtx.fillStyle = '#cccccc';
                    targetCtx.font = `500 ${Math.round(H * 0.05)}px 'Segoe UI', sans-serif`;
                    targetCtx.fillText('(aucune phrase active)', W / 2, H / 2);
                }

                // Circular camera overlay
                if (videoEl && videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
                    const bubble = document.getElementById('cameraFloat');
                    const bubbleRect = bubble.getBoundingClientRect();
                    const stageRect = stage.getBoundingClientRect();

                    const scaleX = W / stageRect.width;
                    const scaleY = H / stageRect.height;

                    const cx = (bubbleRect.left - stageRect.left + bubbleRect.width / 2) * scaleX;
                    const cy = (bubbleRect.top  - stageRect.top  + bubbleRect.height / 2) * scaleY;
                    const radius = (bubbleRect.width / 2) * scaleX;

                    targetCtx.save();
                    targetCtx.beginPath();
                    targetCtx.arc(cx, cy, radius, 0, Math.PI * 2);
                    targetCtx.closePath();
                    targetCtx.clip();

                    targetCtx.translate(cx, cy);
                    if (currentFacingMode === 'user') {
                        targetCtx.scale(-1, 1);
                    }
                    const size = radius * 2;
                    targetCtx.drawImage(videoEl, -size / 2, -size / 2, size, size);
                    targetCtx.restore();

                    targetCtx.save();
                    targetCtx.beginPath();
                    targetCtx.arc(cx, cy, radius, 0, Math.PI * 2);
                    targetCtx.lineWidth = Math.max(2, radius * 0.06);
                    targetCtx.strokeStyle = '#ffffff';
                    targetCtx.stroke();
                    targetCtx.restore();
                }
            }

            function renderLoop() {
                drawComposite(ctx, canvas.width, canvas.height);
                drawComposite(previewCtx, previewCanvas.width, previewCanvas.height);
                rafId = requestAnimationFrame(renderLoop);
            }

            // ---- Acquire tab audio via getDisplayMedia ----
            async function acquireAudioStream() {
                try {
                    // This prompts the user to pick "This tab" + share audio.
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: true,      // needed to satisfy API; we won't use the video
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                            sampleRate: 48000
                        },
                        preferCurrentTab: true,
                        selfBrowserSurface: 'include',
                        systemAudio: 'include'
                    });

                    // We only need the audio tracks
                    const audioTracks = stream.getAudioTracks();
                    if (audioTracks.length === 0) {
                        console.warn('Aucune piste audio obtenue. L\'utilisateur doit cocher "Partager l\'audio".');
                        // Stop the video track we don't use
                        stream.getVideoTracks().forEach(t => t.stop());
                        return { stream: null, hasAudio: false };
                    }

                    // Stop the unnecessary video tracks to save resources
                    stream.getVideoTracks().forEach(t => t.stop());

                    return { stream, hasAudio: true };
                } catch (err) {
                    console.warn('getDisplayMedia failed or cancelled:', err);
                    return { stream: null, hasAudio: false };
                }
            }

            async function startRecording() {
                if (isRecording) return;

                // 1. Acquire tab audio (this is what captures speechSynthesis output)
                const { stream: audioStream, hasAudio } = await acquireAudioStream();
                displayStream = audioStream;

                // 2. Build combined stream: canvas video + (optionally) tab audio
                const canvasStream = canvas.captureStream(30);
                const videoTrack = canvasStream.getVideoTracks()[0];

                combinedStream = new MediaStream();
                combinedStream.addTrack(videoTrack);

                if (hasAudio && audioStream) {
                    audioStream.getAudioTracks().forEach(t => combinedStream.addTrack(t));
                    console.log('✓ Audio track added to recording');
                } else {
                    console.warn('⚠ Recording without audio — user did not share tab audio');
                }

                const mimeType = pickMimeType();
                const options = mimeType 
                    ? { mimeType, videoBitsPerSecond: 4_000_000, audioBitsPerSecond: 128_000 } 
                    : {};

                try {
                    recorder = new MediaRecorder(combinedStream, options);
                } catch (err) {
                    alert("Impossible de démarrer l'enregistrement : " + err.message);
                    cleanupAudio();
                    return;
                }

                chunks = [];
                recorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) chunks.push(e.data);
                };

                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    chunks = [];
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                    a.href = url;
                    a.download = `lecon-bilingue-${ts}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 2000);
                };

                // 3. Start rendering loop + recorder
                previewPanel.classList.add('active');
                renderLoop();
                recorder.start(1000);

                isRecording = true;
                recStart = Date.now();

                recordBtn.classList.add('recording');
                recordBtn.innerText = '⏹ Stop';
                recTimer.classList.add('active');
                recIndicator.classList.add('active');
                recTime.textContent = '00:00';

                timerInterval = setInterval(() => {
                    recTime.textContent = fmtTime(Date.now() - recStart);
                }, 250);

                // If user stops sharing the tab, auto-stop recording
                if (audioStream) {
                    audioStream.getAudioTracks().forEach(track => {
                        track.onended = () => {
                            if (isRecording) stopRecording();
                        };
                    });
                }
            }

            function cleanupAudio() {
                if (displayStream) {
                    displayStream.getTracks().forEach(t => {
                        try { t.stop(); } catch(e){}
                    });
                    displayStream = null;
                }
                if (audioCtx) {
                    try { audioCtx.close(); } catch(e){}
                    audioCtx = null;
                }
                mixDest = null;
                combinedStream = null;
            }

            function stopRecording() {
                if (!isRecording) return;
                isRecording = false;

                if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

                try { recorder.stop(); } catch (e) {}
                cleanupAudio();

                recordBtn.classList.remove('recording');
                recordBtn.innerText = '⏺ Enregistrer';
                recTimer.classList.remove('active');
                recIndicator.classList.remove('active');

                setTimeout(() => {
                    previewPanel.classList.remove('active');
                }, 600);
            }

            recordBtn.addEventListener('click', () => {
                if (isRecording) stopRecording();
                else startRecording();
            });

            window.addEventListener('beforeunload', () => {
                if (isRecording) {
                    try { recorder.stop(); } catch(e){}
                    cleanupAudio();
                }
            });
        })();

        window.addEventListener('load', () => {
            const ta = document.getElementById('textInput');
            if (!ta.value) {
                ta.value = "Hello, how are you?\nBonjour, comment allez-vous ?\nI am learning English.\nJ'apprends l'anglais.";
            }
        });
    </script>
</body>
</html>
