<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Split Screen + MP4 Recorder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #111;
    }

    .split {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    .pane {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      padding: 20px;
    }

    .left  { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
    .right { background: linear-gradient(135deg, #7c2d12, #f97316); }

    .record-btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: 0.2s;
    }

    .record-btn:hover   { background: #dc2626; transform: translateX(-50%) scale(1.05); }
    .record-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .record-btn.recording { background: #111; animation: pulse 1.5s infinite; }

    .record-btn .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
    }

    .record-btn.recording .dot { background: #ef4444; }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70%  { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      z-index: 10;
      display: none;
    }

    .status.show { display: block; }
  </style>
</head>
<body>

  <div class="split">
    <div class="pane left">Left Screen</div>
    <div class="pane right">Right Screen</div>
  </div>

  <div class="status" id="status">Recording…</div>

  <button class="record-btn" id="recordBtn">
    <span class="dot"></span>
    <span id="btnText">Record Screen (MP4)</span>
  </button>

  <!-- ffmpeg.wasm for webm -> mp4 conversion -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

  <script>
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile } = FFmpegUtil;

    const recordBtn = document.getElementById("recordBtn");
    const btnText   = document.getElementById("btnText");
    const statusEl  = document.getElementById("status");

    let mediaRecorder = null;
    let recordedChunks = [];
    let stream = null;
    let ffmpeg = null;

    // ---- Pick a supported MIME type, prefer MP4, fall back to WebM ----
    function pickMimeType() {
      const candidates = [
        "video/mp4;codecs=avc1.42E01E,mp4a.40.2", // Safari MP4
        "video/mp4",
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm"
      ];
      for (const t of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    // ---- Load ffmpeg once (only if we need to convert webm -> mp4) ----
    async function loadFFmpeg() {
      if (ffmpeg) return ffmpeg;
      statusEl.textContent = "Loading MP4 converter…";
      statusEl.classList.add("show");

      ffmpeg = new FFmpeg();
      const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
      await ffmpeg.load({
        coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
        wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm"),
      });
      return ffmpeg;
    }

    // Helper: load a script URL as a same-origin blob (fixes CORS for worker/wasm)
    async function toBlobURL(url, mimeType) {
      const res = await fetch(url);
      const buf = await res.arrayBuffer();
      return URL.createObjectURL(new Blob([buf], { type: mimeType }));
    }

    // ---- Convert webm blob to mp4 using ffmpeg.wasm ----
    async function convertToMp4(webmBlob) {
      const ff = await loadFFmpeg();

      statusEl.textContent = "Converting to MP4…";
      statusEl.classList.add("show");

      const inputName  = "input.webm";
      const outputName = "output.mp4";

      await ff.writeFile(inputName, await fetchFile(webmBlob));

      await ff.exec([
        "-i", inputName,
        "-c:v", "libx264",
        "-preset", "ultrafast",
        "-crf", "23",
        "-c:a", "aac",
        "-b:a", "128k",
        "-movflags", "+faststart",
        outputName
      ]);

      const data = await ff.readFile(outputName);
      await ff.deleteFile(inputName);
      await ff.deleteFile(outputName);

      return new Blob([data.buffer], { type: "video/mp4" });
    }

    // ---- Download helper ----
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ---- Main button handler ----
    recordBtn.addEventListener("click", async () => {
      // STOP
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      try {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always", frameRate: 30 },
          audio: true
        });

        const mimeType = pickMimeType();
        mediaRecorder = new MediaRecorder(
          stream,
          mimeType ? { mimeType } : undefined
        );

        recordedChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          const usedType = mediaRecorder.mimeType || mimeType || "video/webm";
          const rawBlob = new Blob(recordedChunks, { type: usedType });

          stream.getTracks().forEach((t) => t.stop());

          recordBtn.disabled = true;
          btnText.textContent = "Processing…";

          try {
            let mp4Blob;
            if (usedType.includes("mp4")) {
              // Browser already produced MP4 (e.g. Safari)
              mp4Blob = new Blob([rawBlob], { type: "video/mp4" });
            } else {
              // Convert webm -> mp4
              mp4Blob = await convertToMp4(rawBlob);
            }

            downloadBlob(mp4Blob, `screen-recording-${Date.now()}.mp4`);
          } catch (err) {
            console.error("MP4 conversion failed:", err);
            alert("MP4 conversion failed. Downloading original WebM instead.");
            downloadBlob(rawBlob, `screen-recording-${Date.now()}.webm`);
          } finally {
            recordBtn.disabled = false;
            btnText.textContent = "Record Screen (MP4)";
            recordBtn.classList.remove("recording");
            statusEl.classList.remove("show");
            mediaRecorder = null;
          }
        };

        // If user clicks browser's "Stop sharing"
        stream.getVideoTracks()[0].onended = () => {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        };

        mediaRecorder.start(1000); // collect chunks every second
        btnText.textContent = "Stop Recording";
        recordBtn.classList.add("recording");
        statusEl.textContent = "Recording…";
        statusEl.classList.add("show");

      } catch (err) {
        console.error("Screen recording error:", err);
        alert("Could not start screen recording. Please allow screen capture permissions.");
      }
    });
  </script>
</body>
</html>
