<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreamLink — Live Camera + Chat</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0a0d13; --panel:#111621; --panel-2:#171e2c; --border:#222c3f;
    --text:#e9eefb; --muted:#8d9ab3; --accent:#4f8cff; --accent-2:#8b5cff;
    --green:#2ee6a8; --danger:#ff4d6a; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  .screen{display:none;height:100dvh;width:100%}
  .screen.active{display:flex}

  /* ---------- LANDING ---------- */
  #landing{
    align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(900px 600px at 12% -10%, rgba(79,140,255,.20), transparent 62%),
      radial-gradient(760px 540px at 112% 112%, rgba(139,92,255,.20), transparent 62%),
      var(--bg);
  }
  .card{
    width:100%;max-width:440px;padding:34px 30px;
    background:rgba(17,22,33,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:24px;
    box-shadow:0 30px 90px rgba(0,0,0,.55);
    animation:rise .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.3px;color:var(--muted);margin-bottom:22px}
  .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
  h1{font-size:25px;line-height:1.3;font-weight:700;letter-spacing:-.4px;margin-bottom:10px}
  h1 span{background:linear-gradient(100deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:14px;color:var(--muted);line-height:1.55;margin-bottom:26px}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 20px;border-radius:13px;font-size:15px;font-weight:600;
    transition:transform .12s ease, filter .2s ease, background .2s;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{
    width:100%;color:#fff;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 30px rgba(79,140,255,.34);
  }
  .btn.primary:hover{filter:brightness(1.08)}
  .divider{
    display:flex;align-items:center;gap:12px;color:var(--muted);
    font-size:12px;text-transform:uppercase;letter-spacing:1.2px;margin:22px 0 16px;
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .join-row{display:flex;gap:9px}
  .join-row input{
    flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--border);
    border-radius:13px;padding:14px 16px;color:var(--text);font-size:15px;
    letter-spacing:4px;text-align:center;font-weight:600;outline:none;transition:border-color .2s;
  }
  .join-row input::placeholder{letter-spacing:normal;font-weight:400;color:#5b6780}
  .join-row input:focus{border-color:var(--accent)}
  .join-row .btn{background:var(--panel-2);border:1px solid var(--border);padding:14px 22px}
  .join-row .btn:hover{background:#1e2637}
  .error{color:var(--danger);font-size:13px;margin-top:14px;text-align:center;min-height:18px}
  .hint{font-size:12px;color:#5b6780;text-align:center;margin-top:10px}

  /* ---------- ROOM ---------- */
  #room{flex-direction:row;position:relative;background:#05070b}
  .stage{position:relative;flex:1;min-width:0;background:#05070b;overflow:hidden}
  #mainVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05070b}
  #mainVideo.mirrored{transform:scaleX(-1)}

  .overlay-top{
    position:absolute;top:0;left:0;right:0;z-index:12;
    display:flex;align-items:center;gap:9px;padding:14px;
    background:linear-gradient(180deg,rgba(5,7,11,.82),transparent);
  }
  .spacer{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:rgba(17,22,33,.82);border:1px solid var(--border);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap;
  }
  .pill .live-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .pill.live .live-dot{background:var(--danger);box-shadow:0 0 0 0 rgba(255,77,106,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,77,106,.65)}
    70%{box-shadow:0 0 0 9px rgba(255,77,106,0)}
    100%{box-shadow:0 0 0 0 rgba(255,77,106,0)}
  }
  .code-pill{cursor:pointer;letter-spacing:1.6px;color:var(--accent);transition:background .18s}
  .code-pill:hover{background:rgba(79,140,255,.16)}

  .waiting{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:11;padding:12px 20px;border-radius:999px;font-size:13.5px;color:var(--muted);
    background:rgba(17,22,33,.8);border:1px solid var(--border);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:flex;align-items:center;gap:9px;transition:opacity .3s;text-align:center;
  }
  .waiting.hidden{opacity:0;pointer-events:none}
  .spinner{
    width:13px;height:13px;border-radius:50%;flex-shrink:0;
    border:2px solid rgba(141,154,179,.28);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .overlay-bottom{
    position:absolute;left:0;right:0;bottom:0;z-index:12;
    display:flex;align-items:center;justify-content:center;gap:11px;
    padding:18px 14px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(5,7,11,.88),transparent);
  }
  .ctrl{
    display:flex;align-items:center;justify-content:center;gap:7px;
    min-width:52px;height:52px;padding:0 16px;border-radius:16px;
    background:rgba(23,30,44,.9);border:1px solid var(--border);
    font-size:14px;font-weight:600;color:var(--text);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:background .18s, transform .12s, opacity .2s;
  }
  .ctrl:hover{background:rgba(34,44,63,.95)}
  .ctrl:active{transform:scale(.95)}
  .ctrl.off{background:rgba(255,77,106,.16);border-color:rgba(255,77,106,.4);color:#ff8fa2}
  .ctrl.danger{background:linear-gradient(120deg,#e8394f,#ff4d6a);border-color:transparent;color:#fff}
  .ctrl.danger:hover{filter:brightness(1.1)}

  /* ---------- CHAT ---------- */
  .chat{
    width:344px;flex-shrink:0;display:flex;flex-direction:column;height:100%;
    background:var(--panel);border-left:1px solid var(--border);z-index:20;
  }
  .chat-head{
    display:flex;align-items:center;gap:10px;
    padding:16px;border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .chat-head h2{font-size:14.5px;font-weight:650;letter-spacing:-.1px}
  .badge{
    margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);
    background:var(--panel-2);border:1px solid var(--border);
    padding:4px 10px;border-radius:999px;white-space:nowrap;
  }
  .messages{
    flex:1;overflow-y:auto;overscroll-behavior:contain;
    padding:16px;display:flex;flex-direction:column;gap:10px;
  }
  .messages::-webkit-scrollbar{width:6px}
  .messages::-webkit-scrollbar-thumb{background:#2a3448;border-radius:99px}
  .msg{max-width:86%;display:flex;flex-direction:column;gap:3px;animation:pop .22s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .msg.them{align-self:flex-start;align-items:flex-start}
  .bubble{
    padding:9px 13px;border-radius:15px;font-size:14px;line-height:1.45;
    word-break:break-word;white-space:pre-wrap;
  }
  .msg.me .bubble{
    background:linear-gradient(125deg,var(--accent),var(--accent-2));color:#fff;
    border-bottom-right-radius:5px;box-shadow:0 6px 18px rgba(79,140,255,.24);
  }
  .msg.them .bubble{
    background:var(--panel-2);border:1px solid var(--border);border-bottom-left-radius:5px;
  }
  .time{font-size:10px;color:#5b6780;padding:0 4px}
  .msg.system{align-self:center;max-width:100%}
  .msg.system .bubble{
    background:transparent;border:none;color:var(--muted);
    font-size:12px;text-align:center;padding:2px 8px;
  }

  .composer{
    display:flex;gap:9px;padding:12px;flex-shrink:0;
    border-top:1px solid var(--border);background:var(--panel);
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }
  .composer input{
    flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--border);
    border-radius:13px;padding:12px 15px;color:var(--text);font-size:14px;
    outline:none;transition:border-color .2s;
  }
  .composer input::placeholder{color:#5b6780}
  .composer input:focus{border-color:var(--accent)}
  .composer button{
    padding:0 18px;border-radius:13px;font-size:14px;font-weight:650;color:#fff;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    transition:filter .18s, transform .12s;
  }
  .composer button:hover{filter:brightness(1.1)}
  .composer button:active{transform:scale(.96)}

  #chatToggle{
    display:none;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:12px;font-size:17px;
    background:rgba(17,22,33,.82);border:1px solid var(--border);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;
  }
  #chatToggle .unread{
    position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;
    background:var(--danger);border:2px solid var(--bg);display:none;
  }
  #chatToggle.has-unread .unread{display:block}

  /* ---------- MOBILE ---------- */
  @media (max-width:820px){
    .chat{
      position:absolute;left:0;right:0;bottom:0;width:100%;height:66%;
      border-left:none;border-top:1px solid var(--border);
      border-radius:20px 20px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.55);
      transform:translateY(112%);
      transition:transform .3s cubic-bezier(.2,.8,.2,1);
    }
    .chat.open{transform:translateY(0)}
    #chatToggle{display:flex}
    .ctrl{min-width:48px;height:48px;padding:0 13px;font-size:13px}
    h1{font-size:22px}
  }
  @media (min-width:821px){ #chatToggle{display:none} }
</style>
</head>
<body>

<!-- ================= LANDING ================= -->
<div id="landing" class="screen active">
  <div class="card">
    <div class="logo"><span class="dot"></span> StreamLink</div>
    <h1>Go live from your camera.<br><span>Chat in real time.</span></h1>
    <p class="sub">Start a stream and anyone with the room code can watch you live and message you instantly.</p>

    <button id="btnGoLive" class="btn primary">
      <span>●</span> Go Live
    </button>

    <div class="divider">or join a stream</div>

    <div class="join-row">
      <input id="codeInput" placeholder="Enter code" maxlength="4" value="1234"
             inputmode="numeric" autocomplete="off" spellcheck="false">
      <button id="btnJoin" class="btn">Join</button>
    </div>
    <p class="hint">Room code: <strong>1234</strong></p>
    <p id="landingError" class="error"></p>
  </div>
</div>

<!-- ================= ROOM ================= -->
<div id="room" class="screen">
  <div class="stage">
    <video id="mainVideo" playsinline autoplay></video>

    <div class="overlay-top">
      <div class="pill" id="statusPill">
        <span class="live-dot"></span><span id="statusText">Connecting…</span>
      </div>
      <div class="spacer"></div>
      <button class="pill code-pill" id="codePill" title="Copy invite link">
        <span id="codeText">1234</span> · copy
      </button>
      <button id="chatToggle" title="Toggle chat">💬<span class="unread"></span></button>
    </div>

    <div class="waiting" id="waiting">
      <span class="spinner"></span><span id="waitingText">Waiting for viewers…</span>
    </div>

    <div class="overlay-bottom">
      <button class="ctrl" id="micBtn" title="Toggle microphone">🎤</button>
      <button class="ctrl" id="camBtn" title="Toggle camera">📹</button>
      <button class="ctrl danger" id="endBtn" title="End stream">End</button>
    </div>
  </div>

  <aside class="chat" id="chatPanel">
    <div class="chat-head">
      <h2>Live chat</h2>
      <span class="badge" id="viewerCount">0 viewers</span>
    </div>
    <div class="messages" id="messages"></div>
    <form class="composer" id="composer">
      <input id="msgInput" placeholder="Send a message…" autocomplete="off" maxlength="500">
      <button type="submit">Send</button>
    </form>
  </aside>
</div>

<script>
(() => {
  'use strict';

  /* ---------------- Config ---------------- */
  const ID_PREFIX = 'streamlink-v1-';   // namespace on the public PeerJS broker
  const ROOM_CODE = '1234';             // fixed room code
  const CODE_LEN  = ROOM_CODE.length;

  /* ---------------- Elements ---------------- */
  const $ = sel => document.querySelector(sel);
  const landing      = $('#landing');
  const room         = $('#room');
  const mainVideo    = $('#mainVideo');
  const codeInput    = $('#codeInput');
  const landingError = $('#landingError');
  const codeText     = $('#codeText');
  const codePill     = $('#codePill');
  const statusPill   = $('#statusPill');
  const statusText   = $('#statusText');
  const waiting      = $('#waiting');
  const waitingText  = $('#waitingText');
  const micBtn       = $('#micBtn');
  const camBtn       = $('#camBtn');
  const endBtn       = $('#endBtn');
  const messagesEl   = $('#messages');
  const composer     = $('#composer');
  const msgInput     = $('#msgInput');
  const viewerCount  = $('#viewerCount');
  const chatPanel    = $('#chatPanel');
  const chatToggle   = $('#chatToggle');

  /* ---------------- State ---------------- */
  const state = {
    role: null,          // 'host' | 'viewer'
    code: ROOM_CODE,
    peer: null,
    localStream: null,
    conns: [],           // open data channels
    calls: [],           // media connections
    chatOpen: false,
    unread: 0,
    connected: false
  };

  /* ---------------- Helpers ---------------- */
  const timeString = ts => new Date(ts || Date.now())
    .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const setStatus = (text, live) => {
    statusText.textContent = text;
    statusPill.classList.toggle('live', !!live);
  };

  const setViewerCount = n => {
    viewerCount.textContent = n + (n === 1 ? ' viewer' : ' viewers');
  };

  const showWaiting = text => {
    waitingText.textContent = text;
    waiting.classList.remove('hidden');
  };
  const hideWaiting = () => waiting.classList.add('hidden');

  /* ---------------- Chat UI ---------------- */
  function addMessage(text, who, ts) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + who;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;          // textContent => XSS-safe
    wrap.appendChild(bubble);

    if (who !== 'system') {
      const t = document.createElement('div');
      t.className = 'time';
      t.textContent = timeString(ts);
      wrap.appendChild(t);
    }

    const nearBottom =
      messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 90;

    messagesEl.appendChild(wrap);

    if (nearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;

    // Unread indicator when chat is collapsed on mobile
    if (who === 'them' && !state.chatOpen && window.innerWidth <= 820) {
      state.unread++;
      chatToggle.classList.add('has-unread');
    }
  }

  function sendChat(raw) {
    const text = raw.trim();
    if (!text) return;

    const payload = { type: 'chat', text, ts: Date.now() };
    addMessage(text, 'me', payload.ts);

    if (state.role === 'host') {
      state.conns.forEach(c => { if (c.open) c.send(payload); });
    } else {
      const c = state.conns[0];
      if (c && c.open) c.send(payload);
    }
  }

  function handleData(conn, data) {
    if (!data || typeof data !== 'object') return;

    if (data.type === 'chat') {
      addMessage(data.text, 'them', data.ts);
      // Host relays viewer messages to every other viewer
      if (state.role === 'host') {
        state.conns.forEach(c => { if (c !== conn && c.open) c.send(data); });
      }
    } else if (data.type === 'count' && state.role === 'viewer') {
      setViewerCount(data.count);
    }
  }

  /* ---------------- Data connections ---------------- */
  function wireConnection(conn) {
    conn.on('data', d => handleData(conn, d));
    conn.on('close', () => dropConnection(conn));
    conn.on('error', () => dropConnection(conn));
  }

  function dropConnection(conn) {
    state.conns = state.conns.filter(c => c !== conn);

    const call = state.calls.find(c => c.peer === conn.peer);
    if (call) { try { call.close(); } catch (e) {} }
    state.calls = state.calls.filter(c => c.peer !== conn.peer);

    if (state.role === 'host') syncCount();
  }

  function syncCount() {
    const n = state.conns.filter(c => c.open).length;
    setViewerCount(n);
    const payload = { type: 'count', count: n };
    state.conns.forEach(c => { if (c.open) c.send(payload); });

    if (n > 0) hideWaiting();
    else if (state.role === 'host') showWaiting('Waiting for viewers…');
  }

  /* ---------------- Host ---------------- */
  async function goLive() {
    landingError.textContent = '';

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      landingError.textContent =
        'Camera access requires HTTPS or localhost. Open this page over a secure connection.';
      return;
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
        audio: { echoCancellation: true, noiseSuppression: true }
      });
    } catch (err) {
      landingError.textContent =
        err && err.name === 'NotAllowedError'
          ? 'Camera/microphone permission was denied.'
          : 'No camera or microphone was found on this device.';
      return;
    }

    state.role = 'host';
    state.localStream = stream;
    state.code = ROOM_CODE;

    mainVideo.srcObject = stream;
    mainVideo.muted = true;               // avoid feedback loop
    mainVideo.classList.add('mirrored');
    mainVideo.play().catch(() => {});

    enterRoom();
    codeText.textContent = state.code;
    setStatus('Connecting…', false);
    showWaiting('Waiting for viewers…');
    setViewerCount(0);

    createPeer(ID_PREFIX + state.code);
  }

  function onIncomingConnection(conn) {
    if (state.role !== 'host') { try { conn.close(); } catch (e) {} return; }

    state.conns.push(conn);
    wireConnection(conn);

    const startCall = () => {
      if (!state.localStream) return;
      const call = state.peer.call(conn.peer, state.localStream);
      if (!call) return;
      state.calls.push(call);
      call.on('close', () => { state.calls = state.calls.filter(c => c !== call); });
      call.on('error', () => {});
    };

    if (conn.open) startCall();
    else conn.on('open', () => { startCall(); syncCount(); });

    conn.on('close', () => syncCount());
  }

  /* ---------------- Viewer ---------------- */
  function joinStream(rawCode) {
    landingError.textContent = '';
    const code = (rawCode || '').trim();

    if (code.length !== CODE_LEN) {
      landingError.textContent = 'Please enter the ' + CODE_LEN + '-digit room code.';
      return;
    }
    if (code !== ROOM_CODE) {
      landingError.textContent = 'Wrong room code. The code for this stream is ' + ROOM_CODE + '.';
      return;
    }

    state.role = 'viewer';
    state.code = code;

    enterRoom();
    codeText.textContent = code;
    setStatus('Connecting…', false);
    showWaiting('Connecting to the stream…');
    setViewerCount(1);

    // Viewers don't publish media, so hide the host-only controls
    micBtn.style.display = 'none';
    camBtn.style.display = 'none';
    endBtn.textContent = 'Leave';
    mainVideo.muted = true;

    createPeer(null);
  }

  function onIncomingCall(call) {
    if (state.role !== 'viewer') return;

    try { call.answer(); } catch (e) { /* recv-only answer */ }
    state.calls.push(call);

    call.on('stream', remoteStream => {
      mainVideo.srcObject = remoteStream;
      mainVideo.classList.remove('mirrored');
      hideWaiting();
      setStatus('Live', true);

      // Autoplay with sound may be blocked until a gesture — fall back to muted
      mainVideo.muted = false;
      mainVideo.play().catch(() => {
        mainVideo.muted = true;
        mainVideo.play().catch(() => {});
        addMessage('Tap the video to enable sound.', 'system');
      });
    });

    call.on('close', () => {
      setStatus('Stream ended', false);
      showWaiting('The host has ended the stream.');
    });
  }

  /* ---------------- Peer lifecycle ---------------- */
  function createPeer(id) {
    state.peer = id ? new Peer(id, { debug: 1 }) : new Peer({ debug: 1 });

    state.peer.on('open', () => {
      if (state.role === 'host') {
        setStatus('Live', true);
        addMessage('You are live. Room code: ' + ROOM_CODE + '.', 'system');
      } else {
        const conn = state.peer.connect(ID_PREFIX + state.code, { reliable: true });
        state.conns.push(conn);
        wireConnection(conn);

        conn.on('open', () => {
          state.connected = true;
          setStatus('Connected — waiting for video…', true);
        });
        conn.on('close', () => {
          setStatus('Disconnected', false);
          showWaiting('The host has ended the stream.');
        });
      }
    });

    state.peer.on('connection', onIncomingConnection);
    state.peer.on('call', onIncomingCall);

    state.peer.on('disconnected', () => {
      try { state.peer.reconnect(); } catch (e) {}
    });

    state.peer.on('error', err => {
      const type = err && err.type;

      if (type === 'peer-unavailable') {
        if (state.role === 'viewer') {
          landingError.textContent = 'Nobody is live on code ' + ROOM_CODE + ' right now. Ask the host to go live first.';
          leaveRoom();
        }
      } else if (type === 'unavailable-id' && state.role === 'host') {
        // Fixed code, so the room is already taken by another host
        landingError.textContent = 'Room ' + ROOM_CODE + ' is already live on another device.';
        leaveRoom();
      } else if (type === 'network' || type === 'server-error' || type === 'socket-error') {
        setStatus('Connection problem', false);
        if (state.role === 'viewer') showWaiting('Connection lost. Trying to reconnect…');
      } else {
        console.warn('[PeerJS]', err);
      }
    });
  }

  /* ---------------- Navigation ---------------- */
  function enterRoom() {
    landing.classList.remove('active');
    room.classList.add('active');
    if (window.innerWidth > 820) chatPanel.classList.add('open');
  }

  function leaveRoom() {
    // Tear down peer
    try { state.peer && state.peer.destroy(); } catch (e) {}
    state.peer = null;

    // Stop local media
    if (state.localStream) {
      state.localStream.getTracks().forEach(t => t.stop());
      state.localStream = null;
    }

    mainVideo.srcObject = null;
    mainVideo.classList.remove('mirrored');

    state.conns = [];
    state.calls = [];
    state.role = null;
    state.code = ROOM_CODE;
    state.connected = false;
    state.unread = 0;

    chatToggle.classList.remove('has-unread');
    messagesEl.innerHTML = '';
    chatPanel.classList.remove('open');
    micBtn.style.display = '';
    camBtn.style.display = '';
    endBtn.textContent = 'End';
    setStatus('Connecting…', false);
    codeText.textContent = ROOM_CODE;

    room.classList.remove('active');
    landing.classList.add('active');
    codeInput.value = ROOM_CODE;
  }

  /* ---------------- Media controls (host) ---------------- */
  micBtn.addEventListener('click', () => {
    const track = state.localStream && state.localStream.getAudioTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    micBtn.classList.toggle('off', !track.enabled);
    micBtn.textContent = track.enabled ? '🎤' : '🔇';
  });

  camBtn.addEventListener('click', () => {
    const track = state.localStream && state.localStream.getVideoTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    camBtn.classList.toggle('off', !track.enabled);
    camBtn.textContent = track.enabled ? '📹' : '🚫';
  });

  endBtn.addEventListener('click', () => {
    if (state.role === 'host' && !confirm('End the stream for everyone?')) return;
    leaveRoom();
  });

  /* ---------------- Copy invite link ---------------- */
  codePill.addEventListener('click', async () => {
    const link = location.origin + location.pathname + '#room=' + ROOM_CODE;
    const original = codePill.innerHTML;
    try {
      await navigator.clipboard.writeText(link);
    } catch (e) {
      // Clipboard fallback
      const ta = document.createElement('textarea');
      ta.value = link;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    codePill.textContent = 'Link copied ✓';
    setTimeout(() => { codePill.innerHTML = original; }, 1400);
  });

  /* ---------------- Chat toggling (mobile) ---------------- */
  chatToggle.addEventListener('click', () => {
    state.chatOpen = !state.chatOpen;
    chatPanel.classList.toggle('open', state.chatOpen);
    if (state.chatOpen) {
      state.unread = 0;
      chatToggle.classList.remove('has-unread');
      messagesEl.scrollTop = messagesEl.scrollHeight;
      msgInput.focus();
    }
  });

  composer.addEventListener('submit', e => {
    e.preventDefault();
    sendChat(msgInput.value);
    msgInput.value = '';
    msgInput.focus();
  });

  /* ---------------- Landing actions ---------------- */
  $('#btnGoLive').addEventListener('click', goLive);
  $('#btnJoin').addEventListener('click', () => joinStream(codeInput.value));
  codeInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') joinStream(codeInput.value);
  });
  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.replace(/[^0-9]/g, '').slice(0, CODE_LEN);
  });

  /* ---------------- Deep link (#room=1234) ---------------- */
  (function handleHash() {
    const m = location.hash.match(/room=(\d{4})/);
    if (m) {
      codeInput.value = m[1];
      landingError.textContent = 'Press "Join" to watch this stream.';
    }
  })();

  /* ---------------- Cleanup ---------------- */
  window.addEventListener('beforeunload', () => {
    try { state.peer && state.peer.destroy(); } catch (e) {}
    if (state.localStream) state.localStream.getTracks().forEach(t => t.stop());
  });
})();
</script>
</body>
</html>
