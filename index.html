<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Split Screen Launcher</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 15% -10%,#1b2233 0%,#0b0d12 62%),#0b0d12;
    color:#e9edf5;overflow:hidden;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;
  }

  /* ---------- Floating bubble ---------- */
  #bubble{
    position:fixed;width:56px;height:56px;border-radius:50%;
    display:grid;place-items:center;font-size:24px;z-index:99999;
    background:linear-gradient(145deg,#FFFC00,#ffd400);
    color:#111;border:2px solid rgba(255,255,255,.35);
    box-shadow:0 10px 30px rgba(255,252,0,.22),0 6px 18px rgba(0,0,0,.55);
    cursor:grab;touch-action:none;
    transition:transform .12s ease;
  }
  #bubble:active{transform:scale(.93);cursor:grabbing}

  /* ---------- Split Screen Overlay ---------- */
  #overlay{
    position:fixed;inset:0;z-index:10000;
    display:none;flex-direction:column;
    background:rgba(11,13,18,.97);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  }
  #overlay.show{display:flex}

  .split-topbar{
    flex:0 0 auto;height:52px;display:flex;align-items:center;gap:10px;
    padding:0 12px;background:rgba(255,255,255,.055);
    border-bottom:1px solid rgba(255,255,255,.09);
    -webkit-app-region:drag;
  }
  .split-title{
    font-size:15px;font-weight:700;letter-spacing:.3px;
    background:linear-gradient(90deg,#FFFC00,#fff);-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;background-clip:text;
  }
  .split-actions{margin-left:auto;display:flex;gap:6px}
  .split-actions button{
    width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.07);color:#dbe3ef;font-size:16px;cursor:pointer;
    display:grid;place-items:center;padding:0;transition:background .15s;
  }
  .split-actions button:hover{background:rgba(255,255,255,.2)}
  .split-actions button:active{transform:scale(.94)}

  .split-container{
    flex:1;display:flex;overflow:hidden;position:relative;
    padding:8px;gap:0;
  }
  .split-container.vertical{flex-direction:column}

  .pane{
    flex:1;display:flex;flex-direction:column;
    background:#12151c;border-radius:14px;overflow:hidden;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 8px 30px rgba(0,0,0,.4);
    min-width:0;min-height:0;
  }
  .pane-header{
    flex:0 0 44px;display:flex;align-items:center;gap:8px;
    padding:0 10px;background:rgba(255,255,255,.05);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .pane-icon{font-size:20px;line-height:1}
  .pane-name{
    flex:1;font-size:13px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;
  }
  .pane-actions{display:flex;gap:4px}
  .pane-actions button{
    height:30px;padding:0 8px;border-radius:8px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.07);color:#dbe3ef;font-size:11px;font-weight:600;
    cursor:pointer;display:grid;place-items:center;white-space:nowrap;
  }
  .pane-actions button:hover{background:rgba(255,255,255,.18)}
  .pane-actions button:active{transform:scale(.95)}
  .pane-actions .btn-app{font-size:15px;padding:0 7px}

  .pane-body{
    flex:1;position:relative;background:#0b0d12;overflow:hidden;
  }
  .pane-body iframe{
    width:100%;height:100%;border:0;display:block;background:#fff;
  }
  .pane-body .empty{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;
    padding:24px;font-size:13px;color:#8b97ab;
  }
  .pane-body .empty .big{
    font-size:36px;opacity:.4;
  }
  .pane-body .empty button{
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);
    color:#e6ecf5;font:inherit;font-size:13px;font-weight:600;
    padding:10px 20px;border-radius:12px;cursor:pointer;
  }
  .pane-body .empty button:hover{background:rgba(255,255,255,.18)}

  /* Divider */
  .divider{
    flex:0 0 8px;position:relative;z-index:5;
    display:flex;align-items:center;justify-content:center;
    cursor:col-resize;touch-action:none;
  }
  .split-container.vertical .divider{
    cursor:row-resize;flex:0 0 8px;
  }
  .divider::after{
    content:'';border-radius:4px;background:rgba(255,255,255,.18);
    transition:background .15s;
  }
  .split-container:not(.vertical) .divider::after{
    width:4px;height:36px;
  }
  .split-container.vertical .divider::after{
    width:36px;height:4px;
  }
  .divider:hover::after,.divider:active::after{background:rgba(255,252,0,.6)}

  /* ---------- Modals ---------- */
  .modal{
    position:fixed;inset:0;z-index:100001;display:none;
    background:rgba(0,0,0,.65);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:16px;
  }
  .modal.show{display:flex}
  .sheet{
    width:min(96vw,400px);max-height:88vh;overflow:auto;
    background:#141821;border:1px solid rgba(255,255,255,.12);
    border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.75);
    animation:pop .18s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .sheet h3{margin:0 0 16px;font-size:16px}
  .sheet label{display:block;font-size:11px;opacity:.62;margin-bottom:11px}
  .sheet input{
    display:block;width:100%;margin-top:5px;padding:10px 12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
    border-radius:11px;color:#eef2f8;font:inherit;font-size:13px;outline:none;
  }
  .sheet input:focus{border-color:rgba(255,252,0,.55);
    box-shadow:0 0 0 3px rgba(255,252,0,.1)}
  .sheet input[type=color]{
    padding:3px;height:40px;cursor:pointer;background:rgba(255,255,255,.06);
  }
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 16px}
  .chip{
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
    color:#dbe3ef;font:inherit;font-size:11px;padding:6px 10px;border-radius:20px;
    cursor:pointer;
  }
  .chip:hover{background:rgba(255,255,255,.16)}
  .row{display:flex;gap:8px;align-items:center;margin-top:4px}
  .row .spacer{flex:1}
  .row button{
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);
    color:#e6ecf5;font:inherit;font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:12px;cursor:pointer;
  }
  .row button.primary{background:#FFFC00;color:#141414;border-color:#FFFC00}
  .row button.danger{background:transparent;border-color:rgba(239,68,68,.5);color:#ff8080}
  .row button:hover{filter:brightness(1.12)}

  .app-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .app-list button{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-radius:12px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);color:inherit;font:inherit;font-size:13px;
    cursor:pointer;text-align:left;
  }
  .app-list button:hover{background:rgba(255,255,255,.14)}
  .app-list .emoji{font-size:22px;line-height:1}
  .app-list .nm{flex:1;font-weight:600}
  .app-list .add-new{
    justify-content:center;border-style:dashed;color:#cbd5e1;font-weight:600;
  }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    z-index:100002;padding:11px 18px;border-radius:14px;
    background:rgba(24,28,38,.96);border:1px solid rgba(255,255,255,.14);
    font-size:12.5px;box-shadow:0 14px 40px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transition:.25s ease;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

  <!-- Floating bubble -->
  <div id="bubble" title="Toggle split screen">📱</div>

  <!-- Split Screen Overlay -->
  <div id="overlay" class="show">
    <div class="split-topbar">
      <span class="split-title">Split Screen</span>
      <div class="split-actions">
        <button id="btnSwap" title="Swap panes">⇄</button>
        <button id="btnOrient" title="Toggle orientation">⇅</button>
        <button id="btnAdd" title="Add app">＋</button>
        <button id="btnClose" title="Close overlay">✕</button>
      </div>
    </div>
    <div class="split-container" id="splitContainer">
      <!-- Left / Top pane -->
      <div class="pane" id="paneLeft">
        <div class="pane-header">
          <span class="pane-icon">📱</span>
          <span class="pane-name">Left pane</span>
          <div class="pane-actions">
            <button class="btn-change" data-side="left">Change</button>
            <button class="btn-app" data-side="left" style="display:none">📲</button>
            <button class="btn-browser" data-side="left" style="display:none">↗</button>
          </div>
        </div>
        <div class="pane-body"></div>
      </div>

      <!-- Divider -->
      <div class="divider" id="divider"></div>

      <!-- Right / Bottom pane -->
      <div class="pane" id="paneRight">
        <div class="pane-header">
          <span class="pane-icon">📱</span>
          <span class="pane-name">Right pane</span>
          <div class="pane-actions">
            <button class="btn-change" data-side="right">Change</button>
            <button class="btn-app" data-side="right" style="display:none">📲</button>
            <button class="btn-browser" data-side="right" style="display:none">↗</button>
          </div>
        </div>
        <div class="pane-body"></div>
      </div>
    </div>
  </div>

  <!-- Choose App Modal -->
  <div class="modal" id="pickModal">
    <div class="sheet">
      <h3 id="pickTitle">Choose app</h3>
      <div class="app-list" id="pickList"></div>
      <div class="row">
        <span class="spacer"></span>
        <button id="pickCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Add / Edit App Modal -->
  <div class="modal" id="editModal">
    <div class="sheet">
      <h3 id="editTitle">Add app</h3>
      <label>Name<input id="fName" placeholder="Snapchat" autocomplete="off"></label>
      <label>Icon (emoji)<input id="fEmoji" placeholder="👻" maxlength="4" autocomplete="off"></label>
      <label>Colour<input id="fColor" type="color" value="#FFFC00"></label>
      <label>Web URL<input id="fUrl" placeholder="https://web.snapchat.com/" inputmode="url" autocomplete="off"></label>
      <label>App link / deep link <span style="opacity:.6">(optional)</span>
        <input id="fScheme" placeholder="snapchat://" autocomplete="off"></label>
      <div class="presets" id="presets"></div>
      <div class="row">
        <button id="editDelete" class="danger" style="display:none">Delete</button>
        <span class="spacer"></span>
        <button id="editCancel">Cancel</button>
        <button id="editSave" class="primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
(() => {
  "use strict";

  /* ==================== Storage & Defaults ==================== */
  const LS_APPS   = "splitScreen.apps.v1";
  const LS_PANES  = "splitScreen.panes.v1";
  const LS_LAYOUT = "splitScreen.layout.v1";
  const LS_BUBBLE = "splitScreen.bubble.v1";

  const DEFAULT_APPS = [
    { id:"snapchat", name:"Snapchat", emoji:"👻", color:"#FFFC00", url:"https://web.snapchat.com/", scheme:"snapchat://" },
    { id:"instagram", name:"Instagram", emoji:"📸", color:"#E1306C", url:"https://www.instagram.com/", scheme:"instagram://app" },
    { id:"whatsapp", name:"WhatsApp", emoji:"💬", color:"#25D366", url:"https://web.whatsapp.com/", scheme:"whatsapp://" },
    { id:"youtube", name:"YouTube", emoji:"▶️", color:"#FF0000", url:"https://m.youtube.com/", scheme:"vnd.youtube://" }
  ];

  const PRESETS = [
    { name:"TikTok",    emoji:"🎵", color:"#111111", url:"https://www.tiktok.com/",   scheme:"snssdk1233://" },
    { name:"Discord",   emoji:"🎮", color:"#5865F2", url:"https://discord.com/app",   scheme:"discord://" },
    { name:"Maps",      emoji:"🗺️", color:"#4285F4", url:"https://maps.google.com/",  scheme:"" },
    { name:"Reddit",    emoji:"👽", color:"#FF4500", url:"https://www.reddit.com/",   scheme:"reddit://" },
    { name:"X",         emoji:"𝕏",  color:"#000000", url:"https://x.com/",            scheme:"twitter://" }
  ];

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const uid = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  let apps = loadApps();
  let paneApps = loadPanes();           // { left: appId|null, right: appId|null }
  let layout = loadLayout();            // { orientation:'horizontal'|'vertical', leftSize:number }
  let editingId = null;
  let pickSide = null;

  function loadApps() {
    try {
      const raw = localStorage.getItem(LS_APPS);
      if (raw) { const p = JSON.parse(raw); if (Array.isArray(p) && p.length) return p; }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_APPS));
  }
  function saveApps() { try { localStorage.setItem(LS_APPS, JSON.stringify(apps)); } catch (e) {} }

  function loadPanes() {
    try {
      const raw = localStorage.getItem(LS_PANES);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && typeof p === "object") return { left: p.left || null, right: p.right || null };
      }
    } catch (e) {}
    return { left: "snapchat", right: null };
  }
  function savePanes() { try { localStorage.setItem(LS_PANES, JSON.stringify(paneApps)); } catch (e) {} }

  function loadLayout() {
    try {
      const raw = localStorage.getItem(LS_LAYOUT);
      if (raw) {
        const l = JSON.parse(raw);
        if (l && l.orientation) return { orientation: l.orientation, leftSize: l.leftSize || 50 };
      }
    } catch (e) {}
    return { orientation: "horizontal", leftSize: 50 };
  }
  function saveLayout() { try { localStorage.setItem(LS_LAYOUT, JSON.stringify(layout)); } catch (e) {} }

  /* ==================== Elements ==================== */
  const bubble = $("#bubble");
  const overlay = $("#overlay");
  const splitContainer = $("#splitContainer");
  const paneLeft = $("#paneLeft");
  const paneRight = $("#paneRight");
  const divider = $("#divider");
  const toastEl = $("#toast");

  /* ==================== Toast ==================== */
  let toastTimer;
  function toast(msg, ms = 2200) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
  }

  /* ==================== Layout ==================== */
  function applyLayout() {
    splitContainer.classList.toggle("vertical", layout.orientation === "vertical");
    const dir = layout.orientation === "vertical" ? "height" : "width";
    paneLeft.style.flex = `0 0 ${layout.leftSize}%`;
    paneRight.style.flex = "1";
    // For vertical, we need to set height instead of width; flex-basis handles both.
    // But we need to ensure paneLeft has correct flex-basis.
    if (layout.orientation === "vertical") {
      paneLeft.style.flexBasis = layout.leftSize + "%";
    } else {
      paneLeft.style.flexBasis = layout.leftSize + "%";
    }
    // Adjust divider cursor
    divider.style.cursor = layout.orientation === "vertical" ? "row-resize" : "col-resize";
  }

  /* ==================== Render Panes ==================== */
  function getApp(id) { return apps.find(a => a.id === id) || null; }

  function renderPane(side) {
    const pane = side === "left" ? paneLeft : paneRight;
    const appId = paneApps[side];
    const app = appId ? getApp(appId) : null;

    const iconEl = pane.querySelector(".pane-icon");
    const nameEl = pane.querySelector(".pane-name");
    const bodyEl = pane.querySelector(".pane-body");
    const btnApp = pane.querySelector(".btn-app");
    const btnBrowser = pane.querySelector(".btn-browser");

    if (app) {
      iconEl.textContent = app.emoji || "📱";
      nameEl.textContent = app.name;
      btnApp.style.display = app.scheme ? "" : "none";
      btnBrowser.style.display = app.url ? "" : "none";

      if (app.url) {
        // Use a key to force reload if URL changed (unlikely here)
        let iframe = bodyEl.querySelector("iframe");
        if (!iframe || iframe.dataset.appId !== app.id) {
          bodyEl.innerHTML = `<iframe src="${esc(app.url)}"
            allow="camera;microphone;clipboard-write;fullscreen;autoplay;encrypted-media"
            referrerpolicy="no-referrer" loading="lazy" data-app-id="${esc(app.id)}"></iframe>`;
        }
      } else {
        bodyEl.innerHTML = `<div class="empty"><span class="big">🔗</span><span>No web URL set for this app.</span><span style="font-size:11px;opacity:.7">Use the 📲 button to launch the installed app.</span></div>`;
      }
    } else {
      iconEl.textContent = "📱";
      nameEl.textContent = side === "left" ? "Left pane" : "Right pane";
      btnApp.style.display = "none";
      btnBrowser.style.display = "none";
      bodyEl.innerHTML = `<div class="empty">
        <span class="big">＋</span>
        <span>No app selected</span>
        <button data-side="${side}" class="choose-app">Choose app</button>
      </div>`;
      bodyEl.querySelector(".choose-app").addEventListener("click", () => openPicker(side));
    }
  }

  function renderAllPanes() {
    renderPane("left");
    renderPane("right");
  }

  /* ==================== Picker Modal ==================== */
  function openPicker(side) {
    pickSide = side;
    const title = $("#pickTitle");
    title.textContent = side === "left" ? "Choose app for Left pane" : "Choose app for Right pane";
    const list = $("#pickList");
    list.innerHTML = "";

    apps.forEach(app => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.innerHTML = `<span class="emoji">${esc(app.emoji || "📱")}</span>
        <span class="nm">${esc(app.name)}</span>
        ${paneApps[side] === app.id ? "✓" : ""}`;
      btn.addEventListener("click", () => {
        paneApps[side] = app.id;
        savePanes();
        renderPane(side);
        closePicker();
      });
      list.appendChild(btn);
    });

    // Add new app button
    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "add-new";
    addBtn.innerHTML = "＋ Add new app";
    addBtn.addEventListener("click", () => {
      closePicker();
      openEditor(null);
    });
    list.appendChild(addBtn);

    $("#pickModal").classList.add("show");
  }

  function closePicker() {
    $("#pickModal").classList.remove("show");
    pickSide = null;
  }

  /* ==================== Edit Modal ==================== */
  function renderPresets() {
    const box = $("#presets");
    box.innerHTML = "";
    PRESETS.forEach(p => {
      const c = document.createElement("button");
      c.type = "button";
      c.className = "chip";
      c.textContent = p.emoji + " " + p.name;
      c.addEventListener("click", () => {
        $("#fName").value   = p.name;
        $("#fEmoji").value  = p.emoji;
        $("#fColor").value  = /^#[0-9a-f]{6}$/i.test(p.color) ? p.color : "#334155";
        $("#fUrl").value    = p.url;
        $("#fScheme").value = p.scheme;
      });
      box.appendChild(c);
    });
  }

  function openEditor(app) {
    editingId = app ? app.id : null;
    $("#editTitle").textContent = app ? "Edit app" : "Add app";
    $("#fName").value   = app ? app.name   : "";
    $("#fEmoji").value  = app ? (app.emoji || "") : "";
    $("#fColor").value  = app && /^#[0-9a-f]{6}$/i.test(app.color || "")
                            ? app.color : "#FFFC00";
    $("#fUrl").value    = app ? (app.url    || "") : "";
    $("#fScheme").value = app ? (app.scheme || "") : "";
    $("#editDelete").style.display = app ? "" : "none";
    $("#editModal").classList.add("show");
    setTimeout(() => $("#fName").focus(), 60);
  }

  function closeEditor() {
    $("#editModal").classList.remove("show");
    editingId = null;
  }

  function saveEditor() {
    const name = $("#fName").value.trim();
    if (!name) { toast("Give the app a name"); $("#fName").focus(); return; }

    let url = $("#fUrl").value.trim();
    if (url && !/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;

    const data = {
      name,
      emoji:  $("#fEmoji").value.trim() || "📱",
      color:  $("#fColor").value,
      url,
      scheme: $("#fScheme").value.trim()
    };

    if (editingId) {
      const i = apps.findIndex(a => a.id === editingId);
      if (i > -1) apps[i] = Object.assign({}, apps[i], data);
    } else {
      apps.push(Object.assign({ id: uid() }, data));
    }

    saveApps();
    renderAllPanes(); // in case an open pane uses this app
    closeEditor();
    toast(editingId ? "App updated" : name + " added");
  }

  function deleteEditor() {
    if (!editingId) return;
    const app = apps.find(a => a.id === editingId);
    if (!app) return;
    if (!confirm(`Remove "${app.name}" from your launcher?`)) return;

    apps = apps.filter(a => a.id !== editingId);
    // Clear panes that used this app
    if (paneApps.left === editingId) paneApps.left = null;
    if (paneApps.right === editingId) paneApps.right = null;
    saveApps();
    savePanes();
    renderAllPanes();
    closeEditor();
    toast("Removed");
  }

  /* ==================== Pane Actions ==================== */
  function swapPanes() {
    const tmp = paneApps.left;
    paneApps.left = paneApps.right;
    paneApps.right = tmp;
    savePanes();
    renderAllPanes();
    toast("Panes swapped");
  }

  function toggleOrientation() {
    layout.orientation = layout.orientation === "horizontal" ? "vertical" : "horizontal";
    saveLayout();
    applyLayout();
    toast(layout.orientation === "horizontal" ? "Side by side" : "Stacked");
  }

  /* ==================== Deep Link ==================== */
  function launchScheme(app) {
    if (!app || !app.scheme) { toast("No app link set"); return; }
    const started = Date.now();
    const ifr = document.createElement("iframe");
    ifr.style.cssText = "display:none;width:0;height:0;border:0";
    document.body.appendChild(ifr);
    try { ifr.src = app.scheme; } catch (e) { ifr.src = app.scheme; }
    setTimeout(() => ifr.remove(), 1400);

    setTimeout(() => {
      const stillHere = document.visibilityState === "visible" &&
                        Date.now() - started < 2600;
      if (stillHere && app.url) {
        toast("App not installed — opening web version…");
        window.open(app.url, "_blank", "noopener");
      }
    }, 1600);
  }

  /* ==================== Divider Drag ==================== */
  function initDivider() {
    let st = null;
    divider.addEventListener("pointerdown", e => {
      e.preventDefault();
      divider.setPointerCapture(e.pointerId);
      const rect = splitContainer.getBoundingClientRect();
      st = {
        startX: e.clientX,
        startY: e.clientY,
        startSize: layout.leftSize,
        containerW: rect.width,
        containerH: rect.height
      };
    });
    divider.addEventListener("pointermove", e => {
      if (!st) return;
      let pct;
      if (layout.orientation === "horizontal") {
        const dx = e.clientX - st.startX;
        pct = st.startSize + (dx / st.containerW) * 100;
      } else {
        const dy = e.clientY - st.startY;
        pct = st.startSize + (dy / st.containerH) * 100;
      }
      layout.leftSize = clamp(pct, 15, 85);
      applyLayout();
    });
    const end = e => {
      if (st) { saveLayout(); st = null; }
      try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    divider.addEventListener("pointerup", end);
    divider.addEventListener("pointercancel", end);
  }

  /* ==================== Bubble Drag / Tap ==================== */
  function setBubblePos(x, y, persist = true) {
    const size = 56;
    x = clamp(x, 6, window.innerWidth  - size - 6);
    y = clamp(y, 6, window.innerHeight - size - 6);
    bubble.style.left = x + "px";
    bubble.style.top  = y + "px";
    bubble.style.right = "auto";
    bubble.style.bottom = "auto";
    if (persist) {
      try { localStorage.setItem(LS_BUBBLE, JSON.stringify({ x, y })); } catch (e) {}
    }
  }

  (function initBubblePos() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(LS_BUBBLE) || "null"); } catch (e) {}
    if (saved && typeof saved.x === "number") {
      setBubblePos(saved.x, saved.y, false);
    } else {
      setBubblePos(window.innerWidth - 72, window.innerHeight - 96, false);
    }
  })();

  let bDrag = null;
  bubble.addEventListener("pointerdown", e => {
    e.preventDefault();
    bubble.setPointerCapture(e.pointerId);
    const r = bubble.getBoundingClientRect();
    bDrag = { sx: e.clientX, sy: e.clientY, ox: r.left, oy: r.top, moved: false };
  });
  bubble.addEventListener("pointermove", e => {
    if (!bDrag) return;
    const dx = e.clientX - bDrag.sx, dy = e.clientY - bDrag.sy;
    if (!bDrag.moved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) bDrag.moved = true;
    if (bDrag.moved) setBubblePos(bDrag.ox + dx, bDrag.oy + dy, false);
  });
  bubble.addEventListener("pointerup", e => {
    if (bDrag) {
      if (bDrag.moved) {
        const r = bubble.getBoundingClientRect();
        setBubblePos(r.left, r.top, true);
      } else {
        overlay.classList.toggle("show");
      }
    }
    bDrag = null;
    try { bubble.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  bubble.addEventListener("pointercancel", () => { bDrag = null; });

  /* ==================== Event Bindings ==================== */
  // Top bar
  $("#btnSwap").addEventListener("click", swapPanes);
  $("#btnOrient").addEventListener("click", toggleOrientation);
  $("#btnAdd").addEventListener("click", () => openEditor(null));
  $("#btnClose").addEventListener("click", () => overlay.classList.remove("show"));

  // Pane change buttons (delegated)
  document.addEventListener("click", e => {
    const changeBtn = e.target.closest(".btn-change");
    if (changeBtn) {
      const side = changeBtn.dataset.side;
      openPicker(side);
      return;
    }
    const appBtn = e.target.closest(".btn-app");
    if (appBtn) {
      const side = appBtn.dataset.side;
      const appId = paneApps[side];
      const app = appId ? getApp(appId) : null;
      if (app) launchScheme(app);
      return;
    }
    const browserBtn = e.target.closest(".btn-browser");
    if (browserBtn) {
      const side = browserBtn.dataset.side;
      const appId = paneApps[side];
      const app = appId ? getApp(appId) : null;
      if (app && app.url) window.open(app.url, "_blank", "noopener");
      return;
    }
    // Choose app button inside empty pane
    const chooseBtn = e.target.closest(".choose-app");
    if (chooseBtn) {
      openPicker(chooseBtn.dataset.side);
    }
  });

  // Picker modal
  $("#pickCancel").addEventListener("click", closePicker);
  $("#pickModal").addEventListener("pointerdown", e => {
    if (e.target === $("#pickModal")) closePicker();
  });

  // Edit modal
  $("#editSave").addEventListener("click", saveEditor);
  $("#editCancel").addEventListener("click", closeEditor);
  $("#editDelete").addEventListener("click", deleteEditor);
  $("#editModal").addEventListener("pointerdown", e => {
    if (e.target === $("#editModal")) closeEditor();
  });
  $("#fName").addEventListener("keydown", e => { if (e.key === "Enter") saveEditor(); });

  // Keyboard shortcuts
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if ($("#editModal").classList.contains("show")) closeEditor();
      else if ($("#pickModal").classList.contains("show")) closePicker();
      else overlay.classList.remove("show");
    }
  });

  // Resize
  window.addEventListener("resize", () => {
    const r = bubble.getBoundingClientRect();
    setBubblePos(r.left, r.top, true);
  });

  /* ==================== Boot ==================== */
  renderPresets();
  applyLayout();
  renderAllPanes();
  initDivider();

  // Ensure left/right panes have correct flex
  paneLeft.style.flex = `0 0 ${layout.leftSize}%`;
  paneRight.style.flex = "1";
})();
</script>
</body>
</html>
