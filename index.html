<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera Split Screen · Filters</title>
<style>
  :root{
    --bg:#0b0f14;
    --panel:#161b22;
    --panel-2:#1a2029;
    --border:#2a3038;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#4f8ef7;
    --danger:#ef4444;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    height:100vh; height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    display:flex; flex-direction:column;
    background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ Top bar ============ */
  .topbar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    height:54px; padding:0 14px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#171d25,#12171e);
    z-index:60;
  }
  .brand{
    display:flex; align-items:center; gap:9px;
    font-weight:650; font-size:14px; letter-spacing:.2px;
    white-space:nowrap;
  }
  .brand .mark{
    width:20px; height:20px; border-radius:6px;
    background:linear-gradient(135deg,var(--accent),#8b5cf6);
    box-shadow:0 0 0 1px #ffffff14 inset;
  }
  .spacer{ flex:1 1 auto; }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    font:inherit; font-size:13px; color:var(--text);
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:7px 12px;
    cursor:pointer; white-space:nowrap;
    transition:background .15s ease, border-color .15s ease, transform .05s ease, opacity .15s ease;
  }
  .btn:hover{ background:#232b35; border-color:#3a424d; }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn .glyph{ font-size:14px; line-height:1; opacity:.9; }
  .btn.primary{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }
  .btn.primary:hover{ background:#3f7de6; border-color:#3f7de6; }

  /* ============ Stage ============ */
  .stage{
    flex:1 1 auto; min-height:0; min-width:0;
    display:grid; padding:10px;
  }
  .stage[data-layout="vertical"]{
    grid-template-columns: var(--a,50%) 12px minmax(0,1fr);
    grid-template-rows: minmax(0,1fr);
  }
  .stage[data-layout="horizontal"]{
    grid-template-columns: minmax(0,1fr);
    grid-template-rows: var(--a,50%) 12px minmax(0,1fr);
  }

  /* ============ Divider ============ */
  .divider{
    display:flex; align-items:center; justify-content:center;
    touch-action:none; outline:none; border-radius:99px;
  }
  .divider::before{
    content:"";
    background:var(--border); border-radius:99px;
    transition:background .15s ease;
  }
  .stage[data-layout="vertical"] .divider{ cursor:col-resize; }
  .stage[data-layout="vertical"] .divider::before{ width:4px; height:64px; }
  .stage[data-layout="horizontal"] .divider{ cursor:row-resize; }
  .stage[data-layout="horizontal"] .divider::before{ width:64px; height:4px; }

  .divider:hover::before,
  .divider:focus-visible::before,
  .divider.dragging::before{ background:var(--accent); }

  /* ============ Pane ============ */
  .pane{
    display:flex; flex-direction:column;
    min-width:0; min-height:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
  }

  .pane-bar{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:8px;
    background:var(--panel-2);
    border-bottom:1px solid var(--border);
  }

  .pane-title{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; font-weight:600; color:#b9c2cd;
    letter-spacing:.2px; white-space:nowrap;
    padding-left:4px;
  }
  .rec-dot{
    width:8px; height:8px; border-radius:50%;
    background:#3a424d;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .rec-dot.on{
    background:var(--danger);
    box-shadow:0 0 0 3px rgba(239,68,68,.2);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  .seg{
    display:flex; gap:2px; padding:2px;
    background:#0b0f14;
    border:1px solid var(--border);
    border-radius:9px;
    flex:0 0 auto;
  }
  .seg-btn{
    font:inherit; font-size:12px; font-weight:550;
    color:var(--muted); background:transparent;
    border:0; border-radius:7px;
    padding:5px 10px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .seg-btn:hover{ color:var(--text); }
  .seg-btn.on{ background:var(--accent); color:#fff; }

  .urlbar{ flex:1 1 auto; display:flex; gap:6px; min-width:0; }
  .url-input{
    flex:1 1 auto; min-width:0;
    font:inherit; font-size:13px; color:var(--text);
    background:#0b0f14;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 10px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .url-input::placeholder{ color:#5c6672; }
  .url-input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(79,142,247,.16);
  }
  .go{ padding:6px 12px; border-radius:8px; }

  .icon{
    width:30px; height:30px;
    display:grid; place-items:center;
    font:inherit; font-size:14px;
    color:var(--muted); background:transparent;
    border:1px solid transparent;
    border-radius:8px; cursor:pointer; flex:0 0 auto;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon:hover{ color:var(--text); background:#222a34; border-color:var(--border); }
  .icon.on{ color:#fff; background:var(--accent); border-color:var(--accent); }

  .select{
    font:inherit; font-size:12.5px; color:var(--text);
    background:#0b0f14;
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px; outline:none;
    max-width:170px; cursor:pointer;
  }
  .select:focus{ border-color:var(--accent); }

  .pane-body{
    position:relative;
    flex:1 1 auto; min-height:0;
    background:#05080b;
  }

  /* ============ Camera layers ============ */
  .cam-wrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:#05080b;
  }
  .cam-video{
    position:relative; z-index:1;
    width:100%; height:100%;
    object-fit:cover; display:block;
    background:#000;
  }
  .cam-video.mirror{ transform:scaleX(-1); }

  .cam-canvas{
    position:absolute; inset:0;
    z-index:2;
    pointer-events:none;
  }

  .cam-overlay{
    position:absolute; inset:0;
    z-index:3;
    display:flex; flex-direction:column; justify-content:space-between;
    pointer-events:none;
  }
  .cam-top{
    display:flex; justify-content:flex-end; gap:6px;
    padding:10px;
  }
  .cam-overlay .cam-btn{ pointer-events:auto; }

  .cam-bottom-group{
    display:flex; flex-direction:column; gap:10px;
    padding:0 0 14px;
    background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.36) 58%, transparent);
  }

  /* filter chips */
  .filter-strip{
    display:flex; gap:8px;
    padding:0 12px;
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .filter-strip::-webkit-scrollbar{ display:none; }

  .chip{
    flex:0 0 auto;
    display:inline-flex; align-items:center; gap:7px;
    height:38px; padding:0 14px;
    font:inherit; font-size:12.5px; font-weight:600;
    color:#fff;
    background:rgba(20,26,34,.72);
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;
    cursor:pointer; white-space:nowrap;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition:background .15s ease, border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .chip:hover{ background:rgba(38,47,58,.9); border-color:rgba(255,255,255,.28); }
  .chip:active{ transform:scale(.95); }
  .chip.on{
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 6px 18px -6px rgba(79,142,247,.75);
  }
  .chip .emoji{ font-size:15px; line-height:1; }

  /* capture button row */
  .cam-bottom{
    display:flex; align-items:center; justify-content:center;
    gap:14px; padding:0 12px;
  }

  .cam-btn{
    height:40px; min-width:40px;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    font:inherit; font-size:13px; font-weight:550;
    color:#fff;
    background:rgba(20,26,34,.72);
    border:1px solid rgba(255,255,255,.14);
    border-radius:11px;
    padding:0 14px;
    cursor:pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition:background .15s ease, border-color .15s ease, transform .05s ease, opacity .15s ease;
  }
  .cam-btn:hover{ background:rgba(38,47,58,.9); border-color:rgba(255,255,255,.28); }
  .cam-btn:active{ transform:translateY(1px); }
  .cam-btn.on{ background:var(--accent); border-color:var(--accent); }
  .cam-btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* big shutter */
  .shutter{
    width:66px; height:66px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.85);
    background:transparent;
    display:grid; place-items:center;
    cursor:pointer; padding:0;
    position:relative;
    transition: transform .1s ease, border-color .15s ease;
    pointer-events:auto;
  }
  .shutter::before{
    content:"";
    width:48px; height:48px; border-radius:50%;
    background:#fff;
    box-shadow: 0 4px 16px -4px rgba(0,0,0,.85);
    transition: background .15s ease, transform .1s ease;
  }
  .shutter:hover{ border-color:#fff; }
  .shutter:hover::before{ background:#ffe9b0; }
  .shutter:active{ transform:scale(.93); }
  .shutter:active::before{ transform:scale(.86); }
  .shutter:disabled{ opacity:.35; cursor:not-allowed; }

  /* status badge */
  .fx-status{
    position:absolute;
    top:10px; left:10px;
    z-index:5;
    display:none;
    align-items:center; gap:7px;
    padding:6px 12px;
    font-size:11.5px; font-weight:600;
    color:#fff;
    background:rgba(20,26,34,.8);
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    pointer-events:none;
  }
  .fx-status.show{ display:inline-flex; }
  .fx-status .spinner{
    width:12px; height:12px;
    border:2px solid rgba(255,255,255,.28);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* camera off / error state */
  .cam-state{
    position:absolute; inset:0;
    z-index:6;
    display:none;
    place-items:center; text-align:center;
    padding:26px;
    background:#05080b;
  }
  .cam-state.show{ display:grid; }
  .cam-state .cs-icon{ font-size:34px; margin-bottom:12px; opacity:.8; }
  .cam-state p{ margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.6; max-width:330px; }
  .cam-state .cs-err{ color:#fca5a5; }

  /* snapshot flash */
  .flash{
    position:absolute; inset:0;
    z-index:7;
    background:#fff; opacity:0;
    pointer-events:none;
  }
  .flash.fire{ animation:flash .42s ease-out; }
  @keyframes flash{ 0%{opacity:.92} 100%{opacity:0} }

  /* ============ Content pane ============ */
  .frame, .note, .placeholder{ display:none; }
  .frame{ width:100%; height:100%; border:0; background:#fff; }
  .note{
    width:100%; height:100%;
    border:0; outline:none; resize:none;
    padding:16px 18px;
    background:#0f141a; color:var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:13.5px; line-height:1.65;
  }
  .note::placeholder{ color:#4f5865; }

  .placeholder{
    position:absolute; inset:0;
    place-items:center; text-align:center;
    padding:28px; color:var(--muted);
    font-size:13px; line-height:1.6;
  }
  .placeholder .ph-icon{ font-size:26px; margin-bottom:10px; opacity:.8; }
  .placeholder p{ margin:0; }
  .placeholder .ph-sub{ margin-top:8px; font-size:12px; color:#5c6672; max-width:330px; }

  .pane.mode-web  .frame{ display:block; }
  .pane.mode-note .note{ display:block; }
  .pane.mode-note .urlbar,
  .pane.mode-note .pane-actions [data-act="reload"]{ display:none; }
  .pane-body.empty .frame{ display:none; }
  .pane-body.empty .placeholder{ display:grid; }

  /* ============ Snapshot modal ============ */
  .modal{
    position:fixed; inset:0;
    display:none; place-items:center; padding:20px;
    background:rgba(3,6,10,.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index:200;
  }
  .modal.show{ display:grid; }
  .modal-card{
    width:min(560px,100%);
    max-height:88vh;
    display:flex; flex-direction:column;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.95);
    animation:pop .22s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{ from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }
  .modal-head{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--border);
    font-size:13.5px; font-weight:600;
  }
  .modal-head .spacer{ flex:1; }
  .modal-img{
    width:100%; max-height:62vh;
    object-fit:contain; background:#000; display:block;
  }
  .modal-actions{
    display:flex; gap:8px; justify-content:flex-end;
    padding:12px 14px;
    border-top:1px solid var(--border);
    background:var(--panel-2);
  }

  /* ============ Responsive ============ */
  @media (max-width:720px){
    .btn .label{ display:none; }
    .btn{ padding:7px 10px; }
    .brand span{ display:none; }
    .topbar{ padding:0 10px; gap:6px; }
    .stage{ padding:8px; }
    .pane-bar{ gap:6px; padding:6px; }
    .seg-btn{ padding:5px 8px; }
    .select{ max-width:110px; }
    .cam-btn{ padding:0 11px; font-size:12px; }
    .chip{ height:34px; padding:0 12px; font-size:12px; }
    .shutter{ width:60px; height:60px; }
    .shutter::before{ width:44px; height:44px; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="mark"></div><span>Camera Split · Filters</span>
    </div>
    <div class="spacer"></div>
    <button class="btn" data-act="layout" title="Toggle layout">
      <span class="glyph">▥</span><span class="label">Side by side</span>
    </button>
    <button class="btn" data-act="swap" title="Swap panes">
      <span class="glyph">⇄</span><span class="label">Swap</span>
    </button>
    <button class="btn" data-act="snapshot" title="Take snapshot">
      <span class="glyph">◉</span><span class="label">Snapshot</span>
    </button>
    <button class="btn" data-act="reset" title="Reset">
      <span class="glyph">↺</span><span class="label">Reset</span>
    </button>
  </header>

  <main class="stage" id="stage" data-layout="vertical">

    <!-- ===================== CAMERA PANE ===================== -->
    <section class="pane" id="camPane">
      <div class="pane-bar">
        <div class="pane-title">
          <span class="rec-dot" id="recDot"></span>
          Camera
        </div>
        <select class="select" id="camSelect" title="Select camera"></select>
        <div class="spacer"></div>
        <button class="icon" id="camToggle" title="Start / stop camera">⏻</button>
      </div>

      <div class="pane-body" id="camBody">
        <div class="cam-wrap" id="camWrap">
          <video class="cam-video" id="video" playsinline autoplay muted></video>
          <canvas class="cam-canvas" id="fxCanvas"></canvas>
        </div>

        <div class="fx-status" id="fxStatus"></div>

        <div class="cam-overlay">
          <div class="cam-top">
            <button class="cam-btn" id="btnMirror" title="Mirror preview">⇋</button>
            <button class="cam-btn" id="btnFlip" title="Switch camera">🔄</button>
            <button class="cam-btn" id="btnFull" title="Fullscreen preview">⛶</button>
          </div>

          <div class="cam-bottom-group">
            <div class="filter-strip" id="filterStrip"></div>
            <div class="cam-bottom">
              <button class="shutter" id="btnSnap" title="Take snapshot"></button>
            </div>
          </div>
        </div>

        <div class="cam-state" id="camState">
          <div>
            <div class="cs-icon" id="csIcon">🎥</div>
            <p id="csText">Camera is off.</p>
            <button class="btn primary" id="csBtn">Start camera</button>
          </div>
        </div>

        <div class="flash" id="flash"></div>
      </div>
    </section>

    <!-- ===================== CONTENT PANE ===================== -->
    <section class="pane mode-web" id="contentPane">
      <div class="pane-bar">
        <div class="seg">
          <button type="button" class="seg-btn" data-mode="web">Web</button>
          <button type="button" class="seg-btn" data-mode="note">Note</button>
        </div>
        <form class="urlbar" id="urlForm" autocomplete="off">
          <input class="url-input" id="urlInput" type="text" list="url-presets"
                 placeholder="Enter a URL…" spellcheck="false">
          <button class="btn go" type="submit">Go</button>
        </form>
        <div class="pane-actions">
          <button type="button" class="icon" data-act="reload" title="Reload">⟳</button>
          <button type="button" class="icon" data-act="open" title="Open in new tab">↗</button>
        </div>
      </div>

      <div class="pane-body" id="contentBody">
        <iframe class="frame" id="frame" title="Web content" referrerpolicy="no-referrer"></iframe>
        <textarea class="note" id="note" spellcheck="false" placeholder="Type your notes here…"></textarea>
        <div class="placeholder">
          <div>
            <div class="ph-icon">🌐</div>
            <p>Enter a URL above to load a page here.</p>
            <p class="ph-sub">Some sites (Google, YouTube, X, banking…) block being embedded in a frame.</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <datalist id="url-presets">
    <option value="https://en.wikipedia.org/wiki/Main_Page"></option>
    <option value="https://example.com"></option>
    <option value="https://www.openstreetmap.org"></option>
    <option value="https://news.ycombinator.com"></option>
    <option value="https://developer.mozilla.org"></option>
  </datalist>

  <!-- ===================== SNAPSHOT MODAL ===================== -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-head">
        <span>◉</span><span>Snapshot</span>
        <span class="spacer"></span>
        <button class="icon" id="modalClose" title="Close">✕</button>
      </div>
      <img class="modal-img" id="modalImg" alt="Snapshot preview">
      <div class="modal-actions">
        <button class="btn" id="modalDiscard">Discard</button>
        <button class="btn primary" id="modalDownload">⬇ Download</button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  /* ============================================================
     Helpers
  ============================================================ */
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  const KEY = "camera-split-fx-v1";

  /* ============================================================
     Filters catalogue
  ============================================================ */
  const FILTERS = [
    { id: "none",   label: "None",       emoji: "🚫" },
    { id: "dog",    label: "Dog",        emoji: "🐶" },
    { id: "shades", label: "Shades",     emoji: "🕶️" },
    { id: "stache", label: "Mustache",   emoji: "👨" },
    { id: "crown",  label: "Crown",      emoji: "👑" },
    { id: "bunny",  label: "Bunny",      emoji: "🐰" },
    { id: "heart",  label: "Heart Eyes", emoji: "😍" },
    { id: "pirate", label: "Pirate",     emoji: "🏴☠️" }
  ];

  /* FaceMesh landmark indices */
  const LMK = {
    L_EYE_OUT: 33,  L_EYE_IN: 133,  L_EYE_TOP: 159, L_EYE_BOT: 145,
    R_EYE_OUT: 263, R_EYE_IN: 362,  R_EYE_TOP: 386, R_EYE_BOT: 374,
    NOSE: 1, NOSE_BRIDGE: 168,
    FOREHEAD: 10, CHIN: 152,
    L_CHEEK: 234, R_CHEEK: 454,
    MOUTH_L: 61, MOUTH_R: 291, MOUTH_TOP: 13, MOUTH_BOT: 14
  };

  /* ============================================================
     State
  ============================================================ */
  function defaults() {
    return {
      layout: window.matchMedia("(max-width: 760px)").matches ? "horizontal" : "vertical",
      ratio: 0.5,
      camFirst: true,
      mirrored: true,
      deviceId: "",
      filter: "none",
      content: {
        mode: "web",
        url: "https://en.wikipedia.org/wiki/Main_Page",
        note: ""
      }
    };
  }

  function load() {
    const d = defaults();
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return d;
      const p = JSON.parse(raw);
      return {
        layout: (p.layout === "horizontal" || p.layout === "vertical") ? p.layout : d.layout,
        ratio: Number.isFinite(+p.ratio) ? clamp(+p.ratio, 0.12, 0.88) : 0.5,
        camFirst: p.camFirst !== false,
        mirrored: p.mirrored !== false,
        deviceId: typeof p.deviceId === "string" ? p.deviceId : "",
        filter: FILTERS.some(f => f.id === p.filter) ? p.filter : "none",
        content: {
          mode: p.content && p.content.mode === "note" ? "note" : "web",
          url: p.content && typeof p.content.url === "string" ? p.content.url : d.content.url,
          note: p.content && typeof p.content.note === "string" ? p.content.note : ""
        }
      };
    } catch (e) { return d; }
  }

  let state = load();

  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    }, 280);
  }

  /* ============================================================
     DOM
  ============================================================ */
  const stage       = document.getElementById("stage");
  const camPane     = document.getElementById("camPane");
  const contentPane = document.getElementById("contentPane");
  const camWrap     = document.getElementById("camWrap");

  const video       = document.getElementById("video");
  const fxCanvas    = document.getElementById("fxCanvas");
  const fxCtx       = fxCanvas.getContext("2d");

  const recDot      = document.getElementById("recDot");
  const camSelect   = document.getElementById("camSelect");
  const camToggle   = document.getElementById("camToggle");
  const camState    = document.getElementById("camState");
  const csIcon      = document.getElementById("csIcon");
  const csText      = document.getElementById("csText");
  const csBtn       = document.getElementById("csBtn");
  const flash       = document.getElementById("flash");
  const fxStatus    = document.getElementById("fxStatus");
  const filterStrip = document.getElementById("filterStrip");

  const btnMirror   = document.getElementById("btnMirror");
  const btnFlip     = document.getElementById("btnFlip");
  const btnSnap     = document.getElementById("btnSnap");
  const btnFull     = document.getElementById("btnFull");

  const contentBody = document.getElementById("contentBody");
  const frame       = document.getElementById("frame");
  const note        = document.getElementById("note");
  const urlForm     = document.getElementById("urlForm");
  const urlInput    = document.getElementById("urlInput");

  const modal       = document.getElementById("modal");
  const modalImg    = document.getElementById("modalImg");

  const layoutBtn   = document.querySelector('[data-act="layout"]');
  const swapBtn     = document.querySelector('[data-act="swap"]');
  const snapTopBtn  = document.querySelector('[data-act="snapshot"]');
  const resetBtn    = document.querySelector('[data-act="reset"]');

  /* ============================================================
     Divider
  ============================================================ */
  const divider = document.createElement("div");
  divider.className = "divider";
  divider.tabIndex = 0;
  divider.setAttribute("role", "separator");
  divider.setAttribute("aria-label", "Resize panes");
  divider.title = "Drag to resize · double-click to reset";

  function mountPanes() {
    if (state.camFirst) {
      stage.appendChild(camPane); stage.appendChild(divider); stage.appendChild(contentPane);
    } else {
      stage.appendChild(contentPane); stage.appendChild(divider); stage.appendChild(camPane);
    }
  }

  function applyLayout() {
    stage.dataset.layout = state.layout;
    stage.style.setProperty("--a", (state.ratio * 100).toFixed(3) + "%");
    divider.setAttribute("aria-orientation", state.layout === "vertical" ? "vertical" : "horizontal");

    const vert = state.layout === "vertical";
    layoutBtn.querySelector(".glyph").textContent = vert ? "▥" : "▤";
    layoutBtn.querySelector(".label").textContent = vert ? "Side by side" : "Stacked";
    layoutBtn.title = vert ? "Switch to stacked layout" : "Switch to side-by-side layout";
  }

  let dragging = false;
  function setRatio(r) {
    state.ratio = clamp(r, 0.12, 0.88);
    stage.style.setProperty("--a", (state.ratio * 100).toFixed(3) + "%");
  }
  function ratioFromPointer(e) {
    const s = stage.getBoundingClientRect();
    const d = divider.getBoundingClientRect();
    if (state.layout === "vertical") {
      const avail = s.width - d.width;
      return (e.clientX - s.left - d.width / 2) / avail;
    }
    const avail = s.height - d.height;
    return (e.clientY - s.top - d.height / 2) / avail;
  }
  divider.addEventListener("pointerdown", e => {
    dragging = true;
    divider.setPointerCapture(e.pointerId);
    divider.classList.add("dragging");
    document.body.style.userSelect = "none";
    document.body.style.cursor = state.layout === "vertical" ? "col-resize" : "row-resize";
    e.preventDefault();
  });
  divider.addEventListener("pointermove", e => { if (dragging) setRatio(ratioFromPointer(e)); });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove("dragging");
    document.body.style.userSelect = "";
    document.body.style.cursor = "";
    save();
  }
  divider.addEventListener("pointerup", endDrag);
  divider.addEventListener("pointercancel", endDrag);
  divider.addEventListener("dblclick", () => { setRatio(0.5); save(); });
  divider.addEventListener("keydown", e => {
    const step = e.shiftKey ? 0.05 : 0.02;
    const fwd  = state.layout === "vertical" ? "ArrowRight" : "ArrowDown";
    const back = state.layout === "vertical" ? "ArrowLeft"  : "ArrowUp";
    if (e.key === fwd)        { setRatio(state.ratio + step); e.preventDefault(); save(); }
    else if (e.key === back)  { setRatio(state.ratio - step); e.preventDefault(); save(); }
    else if (e.key === "Home"){ setRatio(0.5); e.preventDefault(); save(); }
  });

  /* ============================================================
     CAMERA
  ============================================================ */
  let stream = null;
  let starting = false;
  let devices = [];

  function showState(icon, text, btnLabel, isError) {
    csIcon.textContent = icon;
    csText.textContent = text;
    csText.className = isError ? "cs-err" : "";
    csBtn.textContent = btnLabel || "Start camera";
    csBtn.style.display = btnLabel === null ? "none" : "";
    camState.classList.add("show");
  }
  function hideState() { camState.classList.remove("show"); }

  function setLive(on) {
    recDot.classList.toggle("on", on);
    camToggle.classList.toggle("on", on);
    camToggle.title = on ? "Stop camera" : "Start camera";
    btnSnap.disabled = !on;
    btnFlip.disabled = !on || devices.length < 2;
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    setLive(false);
  }

  function friendlyError(err) {
    const n = err && err.name;
    if (n === "NotAllowedError" || n === "SecurityError")
      return "Camera permission was denied. Allow access in your browser settings and try again.";
    if (n === "NotFoundError" || n === "DevicesNotFoundError")
      return "No camera was found on this device.";
    if (n === "NotReadableError" || n === "TrackStartError")
      return "The camera is already in use by another app or tab.";
    if (n === "OverconstrainedError")
      return "The selected camera does not support the requested settings.";
    return "Could not start the camera. " + (err && err.message ? err.message : "");
  }

  async function startCamera(deviceId) {
    if (starting) return;
    starting = true;
    hideState();

    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Media devices are not supported in this browser.");
      }

      stopCamera();
      lastLandmarks = null;

      const constraints = {
        audio: false,
        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "user" }
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;

      if (video.readyState < 1) {
        await new Promise(res => {
          const done = () => { video.removeEventListener("loadedmetadata", done); res(); };
          video.addEventListener("loadedmetadata", done);
          setTimeout(res, 1200);
        });
      }

      try { await video.play(); } catch (e) {}

      setLive(true);
      hideState();

      const track = stream.getVideoTracks()[0];
      const settings = track && track.getSettings ? track.getSettings() : {};
      if (settings.deviceId) { state.deviceId = settings.deviceId; save(); }

      await refreshDevices(settings.deviceId);
    } catch (err) {
      stopCamera();
      showState("🚫", friendlyError(err), "Try again", true);
      console.warn("[camera]", err);
    } finally {
      starting = false;
    }
  }

  async function refreshDevices(activeId) {
    try {
      const all = await navigator.mediaDevices.enumerateDevices();
      devices = all.filter(d => d.kind === "videoinput");
      camSelect.innerHTML = "";

      if (!devices.length) {
        const o = document.createElement("option");
        o.textContent = "No camera";
        camSelect.appendChild(o);
        camSelect.disabled = true;
        return;
      }

      camSelect.disabled = false;
      devices.forEach((d, i) => {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || ("Camera " + (i + 1));
        camSelect.appendChild(o);
      });

      const pick = activeId || state.deviceId;
      camSelect.value = (pick && devices.some(d => d.deviceId === pick))
        ? pick : devices[0].deviceId;

      setLive(!!stream);
    } catch (e) {
      camSelect.disabled = true;
    }
  }

  function toggleCamera() {
    if (stream) {
      stopCamera();
      showState("🎥", "Camera is off.", "Start camera", false);
      save();
    } else {
      startCamera(state.deviceId || "");
    }
  }

  function flipCamera() {
    if (!stream || devices.length < 2) return;
    let i = devices.findIndex(d => d.deviceId === camSelect.value);
    if (i === -1) i = 0;
    const next = devices[(i + 1) % devices.length];
    camSelect.value = next.deviceId;
    state.deviceId = next.deviceId;
    save();
    startCamera(next.deviceId);
  }

  function applyMirror() {
    video.classList.toggle("mirror", !!state.mirrored);
    btnMirror.classList.toggle("on", !!state.mirrored);
  }

  /* ============================================================
     FACE TRACKING (MediaPipe)
  ============================================================ */
  let faceLandmarker = null;
  let fxLoadFailed   = false;
  let fxLoading      = false;
  let lastLandmarks  = null;
  let lastDetectAt   = 0;

  async function initFaceTracking() {
    if (faceLandmarker || fxLoadFailed || fxLoading) return;
    if (state.filter === "none") return;      // lazy: only load when a filter is picked
    fxLoading = true;
    updateFxStatus();

    try {
      const vision = await import(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
      );

      const fileset = await vision.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      let landmarker;
      const baseOpts = {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
      };

      try {
        landmarker = await vision.FaceLandmarker.createFromOptions(fileset, {
          baseOptions: Object.assign({ delegate: "GPU" }, baseOpts),
          runningMode: "VIDEO",
          numFaces: 1
        });
      } catch (gpuErr) {
        console.warn("[filters] GPU delegate failed, falling back to CPU", gpuErr);
        landmarker = await vision.FaceLandmarker.createFromOptions(fileset, {
          baseOptions: Object.assign({ delegate: "CPU" }, baseOpts),
          runningMode: "VIDEO",
          numFaces: 1
        });
      }

      faceLandmarker = landmarker;
      console.log("[filters] Face tracking ready");
    } catch (err) {
      fxLoadFailed = true;
      console.warn("[filters] Face tracking unavailable:", err);
    } finally {
      fxLoading = false;
      updateFxStatus();
    }
  }

  function updateFxStatus() {
    if (state.filter === "none" || !stream) {
      fxStatus.classList.remove("show");
      return;
    }
    if (faceLandmarker) {
      fxStatus.classList.remove("show");
      return;
    }
    fxStatus.classList.add("show");
    fxStatus.innerHTML = fxLoadFailed
      ? "⚠️ Filters unavailable"
      : '<span class="spinner"></span> Loading face tracking…';
  }

  /* ============================================================
     Projection helpers
  ============================================================ */
  function makeProjector(vw, vh, tw, th, mirrored) {
    const scale = Math.max(tw / vw, th / vh);
    const dw = vw * scale, dh = vh * scale;
    const ox = (tw - dw) / 2, oy = (th - dh) / 2;
    return (lm) => {
      let x = lm.x * vw;
      const y = lm.y * vh;
      if (mirrored) x = vw - x;
      return { x: x * scale + ox, y: y * scale + oy };
    };
  }

  /* Canvas dimensions in CSS px (kept in sync with the wrap) */
  let fxW = 1, fxH = 1, fxDpr = 1;

  function resizeFx() {
    const rect = camWrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(rect.width));
    const h = Math.max(1, Math.round(rect.height));
    if (w === fxW && h === fxH && dpr === fxDpr) return;
    fxW = w; fxH = h; fxDpr = dpr;
    fxCanvas.width  = Math.round(w * dpr);
    fxCanvas.height = Math.round(h * dpr);
    fxCanvas.style.width  = w + "px";
    fxCanvas.style.height = h + "px";
  }

  /* ============================================================
     Drawing helpers
  ============================================================ */
  function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSparkle(ctx, cx, cy, r, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.2, r * 0.18);
    ctx.lineCap = "round";
    ctx.shadowColor = color;
    ctx.shadowBlur = r * 0.9;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.stroke();
    const d = r * 0.55;
    ctx.beginPath();
    ctx.moveTo(cx - d, cy - d); ctx.lineTo(cx + d, cy + d);
    ctx.moveTo(cx + d, cy - d); ctx.lineTo(cx - d, cy + d);
    ctx.stroke();
    ctx.restore();
  }

  /* ============================================================
     FILTER RENDERERS
     Every renderer receives (ctx, lm, P) where
       lm = array of 468 normalized landmarks
       P(i) -> { x, y } in canvas pixels
  ============================================================ */

  /* ---- 🕶️ Sunglasses ---- */
  function fxShades(ctx, lm, P) {
    const lc = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rc = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const c  = mid(lc, rc);
    const eyeDist = dist(lc, rc);
    const ang = Math.atan2(rc.y - lc.y, rc.x - lc.x);

    const lensW = eyeDist * 0.66;
    const lensH = lensW * 0.78;
    const gap   = eyeDist * 0.10;

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(ang);

    // bridge
    ctx.fillStyle = "#0a0a0f";
    ctx.fillRect(-gap, -lensH * 0.06, gap * 2, lensH * 0.13);

    const lensGrad = ctx.createLinearGradient(0, -lensH / 2, 0, lensH / 2);
    lensGrad.addColorStop(0,    "rgba(28,32,50,0.96)");
    lensGrad.addColorStop(0.42, "rgba(62,80,118,0.94)");
    lensGrad.addColorStop(1,    "rgba(8,10,20,0.96)");

    const drawLens = (cx, fill) => {
      roundRect(ctx, cx - lensW / 2, -lensH / 2, lensW, lensH, lensH * 0.34);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); } else ctx.stroke();
    };

    drawLens(-eyeDist / 2, lensGrad);
    drawLens( eyeDist / 2, lensGrad);

    // rims
    ctx.strokeStyle = "rgba(0,0,0,0.9)";
    ctx.lineWidth = Math.max(2, lensH * 0.085);
    drawLens(-eyeDist / 2);
    drawLens( eyeDist / 2);

    // shine
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    ctx.beginPath();
    ctx.ellipse(-eyeDist / 2 - lensW * 0.16, -lensH * 0.22, lensW * 0.2, lensH * 0.13, -0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse( eyeDist / 2 - lensW * 0.16, -lensH * 0.22, lensW * 0.2, lensH * 0.13, -0.42, 0, Math.PI * 2);
    ctx.fill();

    // arms
    ctx.strokeStyle = "#0a0a0f";
    ctx.lineWidth = Math.max(2, lensH * 0.1);
    ctx.beginPath();
    ctx.moveTo(-eyeDist / 2 - lensW / 2, -lensH * 0.1);
    ctx.lineTo(-eyeDist / 2 - lensW / 2 - eyeDist * 0.32, -lensH * 0.02);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo( eyeDist / 2 + lensW / 2, -lensH * 0.1);
    ctx.lineTo( eyeDist / 2 + lensW / 2 + eyeDist * 0.32, -lensH * 0.02);
    ctx.stroke();

    ctx.restore();
  }

  /* ---- 🐶 Dog ---- */
  function fxDog(ctx, lm, P) {
    const top   = P(LMK.FOREHEAD);
    const chin  = P(LMK.CHIN);
    const lc    = P(LMK.L_CHEEK);
    const rc    = P(LMK.R_CHEEK);
    const nose  = P(LMK.NOSE);
    const mouthB= P(LMK.MOUTH_BOT);

    const faceW = dist(lc, rc);
    const faceH = dist(top, chin);

    // ears
    const drawEar = (cx, cy, dir) => {
      const w = faceW * 0.32;
      const h = faceH * 0.54;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(dir * 0.28);

      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#8a5a30");
      g.addColorStop(1, "#43260f");
      ctx.fillStyle = g;

      ctx.beginPath();
      ctx.moveTo(-w * 0.14, 0);
      ctx.bezierCurveTo(-w * 0.72, h * 0.15, -w * 0.62, h * 0.86, -w * 0.08, h);
      ctx.bezierCurveTo( w * 0.36, h * 0.86,  w * 0.44, h * 0.2,  w * 0.16, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "rgba(50,22,8,0.55)";
      ctx.beginPath();
      ctx.moveTo(0, h * 0.13);
      ctx.bezierCurveTo(-w * 0.42, h * 0.26, -w * 0.36, h * 0.76, 0, h * 0.88);
      ctx.bezierCurveTo( w * 0.22, h * 0.74,  w * 0.24, h * 0.28, 0, h * 0.13);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    };

    const earY = top.y + faceH * 0.05;
    drawEar(lc.x + faceW * 0.05, earY, -1);
    drawEar(rc.x - faceW * 0.05, earY, +1);

    // nose
    const nx = nose.x;
    const ny = nose.y + faceH * 0.035;
    const nw = faceW * 0.17;
    const nh = nw * 0.74;

    ctx.save();
    ctx.translate(nx, ny);

    const ng = ctx.createRadialGradient(-nw * 0.16, -nh * 0.22, nh * 0.04, 0, 0, nw * 0.72);
    ng.addColorStop(0, "#55555e");
    ng.addColorStop(1, "#08080c");
    ctx.fillStyle = ng;

    ctx.beginPath();
    ctx.ellipse(0, 0, nw / 2, nh / 2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath();
    ctx.ellipse(-nw * 0.15, -nh * 0.2, nw * 0.11, nh * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // whisker dots
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    for (let s = -1; s <= 1; s += 2) {
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(
          nx + s * nw * 0.62,
          ny + (i - 1) * nh * 0.34 + nh * 0.12,
          Math.max(1, nw * 0.045), 0, Math.PI * 2
        );
        ctx.fill();
      }
    }

    // tongue
    const tW = faceW * 0.14;
    const tH = faceH * 0.14;
    ctx.fillStyle = "#ff5b7a";
    ctx.beginPath();
    ctx.ellipse(mouthB.x, mouthB.y + tH * 0.32, tW / 2, tH / 2, 0, 0, Math.PI);
    ctx.fill();
    ctx.strokeStyle = "rgba(150,20,50,0.7)";
    ctx.lineWidth = Math.max(1, tW * 0.06);
    ctx.beginPath();
    ctx.moveTo(mouthB.x, mouthB.y + tH * 0.32);
    ctx.lineTo(mouthB.x, mouthB.y + tH * 0.82);
    ctx.stroke();
  }

  /* ---- 👨 Mustache ---- */
  function fxStache(ctx, lm, P) {
    const ml = P(LMK.MOUTH_L);
    const mr = P(LMK.MOUTH_R);
    const c  = mid(ml, mr);
    const mouthW = dist(ml, mr);
    const ang = Math.atan2(mr.y - ml.y, mr.x - ml.x);

    const w = mouthW * 1.2;
    const h = mouthW * 0.36;

    ctx.save();
    ctx.translate(c.x, c.y - h * 0.5);
    ctx.rotate(ang);

    ctx.fillStyle = "#1a1210";
    ctx.beginPath();
    ctx.moveTo(0, -h * 0.05);
    // left wing
    ctx.bezierCurveTo(-w * 0.18, -h * 0.72, -w * 0.45, -h * 0.88, -w * 0.5, -h * 0.15);
    ctx.bezierCurveTo(-w * 0.53,  h * 0.38, -w * 0.34,  h * 0.45, -w * 0.2, h * 0.05);
    ctx.bezierCurveTo(-w * 0.12, -h * 0.16, -w * 0.06, -h * 0.06, 0, -h * 0.05);
    // right wing
    ctx.bezierCurveTo( w * 0.06, -h * 0.06,  w * 0.12, -h * 0.16,  w * 0.2, h * 0.05);
    ctx.bezierCurveTo( w * 0.34,  h * 0.45,  w * 0.53,  h * 0.38,  w * 0.5, -h * 0.15);
    ctx.bezierCurveTo( w * 0.45, -h * 0.88,  w * 0.18, -h * 0.72, 0, -h * 0.05);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "rgba(100,78,60,0.35)";
    ctx.beginPath();
    ctx.ellipse(-w * 0.26, -h * 0.38, w * 0.12, h * 0.1, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse( w * 0.26, -h * 0.38, w * 0.12, h * 0.1,  0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  /* ---- 👑 Crown ---- */
  function fxCrown(ctx, lm, P) {
    const top = P(LMK.FOREHEAD);
    const lc  = P(LMK.L_CHEEK);
    const rc  = P(LMK.R_CHEEK);
    const faceW = dist(lc, rc);
    const faceH = dist(top, P(LMK.CHIN));

    const lc2 = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rc2 = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const tilt = Math.atan2(rc2.y - lc2.y, rc2.x - lc2.x) * 0.6;

    const w = faceW * 0.9;
    const h = w * 0.42;
    const baseY = top.y - faceH * 0.02;

    ctx.save();
    ctx.translate(top.x, baseY);
    ctx.rotate(tilt);

    const x0 = -w / 2;

    // Crown silhouette
    ctx.beginPath();
    ctx.moveTo(x0, 0);
    ctx.lineTo(x0, -h * 0.16);
    for (let i = 0; i < 5; i++) {
      const sx = x0 + i * (w / 5);
      const ex = sx + w / 5;
      const peakH = -h * (i % 2 === 0 ? 1 : 0.74);
      ctx.lineTo(sx + w / 10, peakH);
      ctx.lineTo(ex, -h * 0.16);
    }
    ctx.lineTo(x0 + w, 0);
    ctx.closePath();

    const g = ctx.createLinearGradient(0, -h, 0, 0);
    g.addColorStop(0,    "#ffe98a");
    g.addColorStop(0.45, "#ffcb2e");
    g.addColorStop(1,    "#c98600");
    ctx.fillStyle = g;
    ctx.fill();

    ctx.strokeStyle = "#8a5c00";
    ctx.lineWidth = Math.max(1.5, w * 0.012);
    ctx.stroke();

    // band
    ctx.fillStyle = "#b8791a";
    ctx.fillRect(x0, -h * 0.16, w, h * 0.18);

    // jewels
    const jewels = ["#ff3b6b", "#4f8ef7", "#34d399", "#a78bfa", "#fbbf24"];
    for (let i = 0; i < 5; i++) {
      const jx = x0 + (i + 0.5) * (w / 5);
      ctx.fillStyle = jewels[i];
      ctx.beginPath();
      ctx.arc(jx, -h * 0.06, w * 0.028, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.65)";
      ctx.beginPath();
      ctx.arc(jx - w * 0.01, -h * 0.075, w * 0.009, 0, Math.PI * 2);
      ctx.fill();
    }

    // sparkles on tall spikes
    for (let i = 0; i < 3; i++) {
      const sx = x0 + (i * 2 + 0.5) * (w / 5);
      drawSparkle(ctx, sx, -h * 0.98, w * 0.032, "rgba(255,255,240,0.95)");
    }

    ctx.restore();
  }

  /* ---- 🐰 Bunny ---- */
  function fxBunny(ctx, lm, P) {
    const top = P(LMK.FOREHEAD);
    const lc  = P(LMK.L_CHEEK);
    const rc  = P(LMK.R_CHEEK);
    const faceW = dist(lc, rc);
    const faceH = dist(top, P(LMK.CHIN));

    const lc2 = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rc2 = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const ang = Math.atan2(rc2.y - lc2.y, rc2.x - lc2.x);
    const cx  = (lc2.x + rc2.x) / 2;

    const drawEar = (offsetX, tilt) => {
      const ew = faceW * 0.21;
      const eh = faceH * 0.9;

      ctx.save();
      ctx.translate(cx + offsetX, top.y + faceH * 0.02);
      ctx.rotate(ang + tilt);

      // white outer
      const g = ctx.createLinearGradient(0, 0, 0, -eh);
      g.addColorStop(0, "#f2eef6");
      g.addColorStop(1, "#ffffff");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, -eh / 2, ew / 2, eh / 2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(180,170,190,0.65)";
      ctx.lineWidth = Math.max(1, ew * 0.05);
      ctx.stroke();

      // pink inner
      ctx.fillStyle = "#ffb6c9";
      ctx.beginPath();
      ctx.ellipse(0, -eh / 2, ew * 0.28, eh * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    };

    const spread = faceW * 0.24;
    drawEar(-spread, -0.2);
    drawEar( spread,  0.2);
  }

  /* ---- 😍 Heart Eyes ---- */
  function fxHeart(ctx, lm, P) {
    const lEye = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rEye = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const eyeDist = dist(lEye, rEye);
    const base = eyeDist * 0.55;
    const t = performance.now() / 520;

    const drawHeart = (cx, cy, s, phase) => {
      s *= 1 + Math.sin(t + phase) * 0.12;

      ctx.save();
      ctx.translate(cx, cy - s * 0.45);
      ctx.shadowColor = "rgba(255,60,110,0.9)";
      ctx.shadowBlur = s * 0.55;

      const g = ctx.createLinearGradient(0, -s * 0.7, 0, s * 0.45);
      g.addColorStop(0, "#ff4d79");
      g.addColorStop(1, "#c9184a");
      ctx.fillStyle = g;

      const topCurve = s * 0.3;
      ctx.beginPath();
      ctx.moveTo(0, topCurve);
      ctx.bezierCurveTo(0, 0, -s / 2, 0, -s / 2, topCurve);
      ctx.bezierCurveTo(-s / 2, (s + topCurve) / 2, 0, (s + topCurve) / 2, 0, s);
      ctx.bezierCurveTo(0, (s + topCurve) / 2, s / 2, (s + topCurve) / 2, s / 2, topCurve);
      ctx.bezierCurveTo(s / 2, 0, 0, 0, 0, topCurve);
      ctx.closePath();
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.beginPath();
      ctx.ellipse(-s * 0.16, s * 0.28, s * 0.08, s * 0.06, -0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    };

    drawHeart(lEye.x, lEye.y, base, 0);
    drawHeart(rEye.x, rEye.y, base, Math.PI * 0.8);
  }

  /* ---- 🏴☠️ Pirate ---- */
  function fxPirate(ctx, lm, P) {
    const lEye = mid(P(LMK.L_EYE_OUT), P(LMK.L_EYE_IN));
    const rEye = mid(P(LMK.R_EYE_OUT), P(LMK.R_EYE_IN));
    const c    = mid(lEye, rEye);
    const eyeDist = dist(lEye, rEye);
    const ang = Math.atan2(rEye.y - lEye.y, rEye.x - lEye.x);

    // patch goes on whichever eye sits on the left of the screen
    const patchEye = lEye.x < rEye.x ? lEye : rEye;
    const size = eyeDist * 0.52;

    // strap across the head
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(ang);
    ctx.strokeStyle = "#0a0a0a";
    ctx.lineWidth = Math.max(3, eyeDist * 0.09);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-eyeDist * 1.05, -eyeDist * 0.04);
    ctx.lineTo( eyeDist * 1.05,  eyeDist * 0.07);
    ctx.stroke();
    ctx.restore();

    // the patch itself
    ctx.save();
    ctx.translate(patchEye.x, patchEye.y);
    ctx.rotate(ang);

    ctx.fillStyle = "#08080c";
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.74, size * 0.86, 0, 0, Math.PI * 2);
    ctx.fill();

    const g = ctx.createLinearGradient(-size * 0.5, -size * 0.5, size * 0.45, size * 0.45);
    g.addColorStop(0,   "rgba(90,90,105,0.6)");
    g.addColorStop(0.5, "rgba(20,20,26,0.2)");
    g.addColorStop(1,   "rgba(0,0,0,0.45)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.74, size * 0.86, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.lineWidth = Math.max(1, size * 0.06);
    ctx.stroke();

    ctx.restore();
  }

  /* ---- Dispatcher ---- */
  function drawFilterSet(ctx, lm, P) {
    switch (state.filter) {
      case "dog":    fxDog(ctx, lm, P);    break;
      case "shades": fxShades(ctx, lm, P); break;
      case "stache": fxStache(ctx, lm, P); break;
      case "crown":  fxCrown(ctx, lm, P);  break;
      case "bunny":  fxBunny(ctx, lm, P);  break;
      case "heart":  fxHeart(ctx, lm, P);  break;
      case "pirate": fxPirate(ctx, lm, P); break;
    }
  }

  /* ============================================================
     RENDER LOOP
  ============================================================ */
  let rafId = null;

  function loop() {
    rafId = requestAnimationFrame(loop);

    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;

    resizeFx();
    fxCtx.setTransform(fxDpr, 0, 0, fxDpr, 0, 0);
    fxCtx.clearRect(0, 0, fxW, fxH);

    if (state.filter === "none" || !stream) {
      lastLandmarks = null;
      return;
    }

    // Detection at ~30fps
    const now = performance.now();
    if (faceLandmarker && now - lastDetectAt > 28) {
      lastDetectAt = now;
      try {
        const res = faceLandmarker.detectForVideo(video, now);
        lastLandmarks = (res && res.faceLandmarks && res.faceLandmarks[0]) || null;
      } catch (e) {
        // video not ready / paused — keep previous landmarks
      }
    }

    if (lastLandmarks) {
      const project = makeProjector(vw, vh, fxW, fxH, !!state.mirrored);
      drawFilterSet(fxCtx, lastLandmarks, project);
    }
  }

  function startLoop() {
    if (rafId == null) rafId = requestAnimationFrame(loop);
  }
  function stopLoop() {
    if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
    fxCtx.setTransform(1, 0, 0, 1, 0, 0);
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }

  /* ============================================================
     FILTER PICKER
  ============================================================ */
  FILTERS.forEach(f => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.dataset.filter = f.id;
    btn.innerHTML = '<span class="emoji">' + f.emoji + "</span>" + f.label;
    btn.addEventListener("click", () => setFilter(f.id));
    filterStrip.appendChild(btn);
  });

  function setFilter(id) {
    state.filter = id;
    filterStrip.querySelectorAll(".chip").forEach(c =>
      c.classList.toggle("on", c.dataset.filter === id)
    );
    save();

    if (id === "none") {
      lastLandmarks = null;
      updateFxStatus();
      return;
    }

    updateFxStatus();
    initFaceTracking();
    startLoop();
  }

  /* ============================================================
     SNAPSHOT (composited with filters)
  ============================================================ */
  function capture() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!stream || !vw || !vh) return null;

    const out = document.createElement("canvas");
    out.width = vw;
    out.height = vh;
    const ctx = out.getContext("2d");

    // 1. draw the frame (mirrored to match the preview)
    ctx.save();
    if (state.mirrored) { ctx.translate(vw, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, vw, vh);
    ctx.restore();

    // 2. draw the filter at full video resolution
    if (state.filter !== "none" && lastLandmarks) {
      const project = makeProjector(vw, vh, vw, vh, !!state.mirrored);
      drawFilterSet(ctx, lastLandmarks, project);
    }

    return out.toDataURL("image/png");
  }

  function takeSnapshot() {
    const data = capture();
    if (!data) return;

    flash.classList.remove("fire");
    void flash.offsetWidth;
    flash.classList.add("fire");

    modalImg.src = data;
    modal.classList.add("show");
  }

  function closeModal() {
    modal.classList.remove("show");
    modalImg.src = "";
  }

  function downloadSnapshot() {
    const src = modalImg.src;
    if (!src) return;
    const a = document.createElement("a");
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    const stamp =
      d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "-" +
      pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
    a.href = src;
    a.download = "snapshot-" + stamp + ".png";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  /* ============================================================
     CONTENT PANE
  ============================================================ */
  function normalizeUrl(raw) {
    let v = (raw || "").trim();
    if (!v) return "";
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = "https://" + v.replace(/^\/+/, "");
    return v;
  }

  function renderContent() {
    const c = state.content;

    contentPane.classList.toggle("mode-web",  c.mode === "web");
    contentPane.classList.toggle("mode-note", c.mode === "note");

    contentPane.querySelectorAll(".seg-btn").forEach(b =>
      b.classList.toggle("on", b.dataset.mode === c.mode)
    );

    if (document.activeElement !== urlInput) urlInput.value = c.url || "";
    if (document.activeElement !== note)     note.value     = c.note || "";

    contentBody.classList.toggle("empty", c.mode === "web" && !c.url);

    if (c.mode === "web" && c.url && frame.dataset.src !== c.url) {
      frame.src = c.url;
      frame.dataset.src = c.url;
    }
  }

  contentPane.querySelectorAll(".seg-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.content.mode = btn.dataset.mode;
      renderContent();
      save();
      if (btn.dataset.mode === "note") note.focus();
    });
  });

  urlForm.addEventListener("submit", e => {
    e.preventDefault();
    const url = normalizeUrl(urlInput.value);
    if (!url) return;
    state.content.url = url;
    state.content.mode = "web";
    urlInput.value = url;
    renderContent();
    save();
  });

  contentPane.querySelector('[data-act="reload"]').addEventListener("click", () => {
    const c = state.content;
    if (c.mode !== "web" || !c.url) return;
    frame.dataset.src = "";
    frame.src = "about:blank";
    setTimeout(() => { frame.src = c.url; frame.dataset.src = c.url; }, 40);
  });

  contentPane.querySelector('[data-act="open"]').addEventListener("click", () => {
    const c = state.content;
    if (c.mode === "web" && c.url) window.open(c.url, "_blank", "noopener");
  });

  note.addEventListener("input", () => { state.content.note = note.value; save(); });

  /* ============================================================
     CAMERA CONTROLS
  ============================================================ */
  camToggle.addEventListener("click", toggleCamera);
  csBtn.addEventListener("click", () => startCamera(state.deviceId || ""));
  btnSnap.addEventListener("click", takeSnapshot);
  btnFlip.addEventListener("click", flipCamera);

  btnMirror.addEventListener("click", () => {
    state.mirrored = !state.mirrored;
    applyMirror();
    save();
  });

  camSelect.addEventListener("change", () => {
    state.deviceId = camSelect.value;
    save();
    startCamera(state.deviceId);
  });

  btnFull.addEventListener("click", () => {
    const el = camWrap;
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }
  });

  /* ============================================================
     MODAL
  ============================================================ */
  document.getElementById("modalClose").addEventListener("click", closeModal);
  document.getElementById("modalDiscard").addEventListener("click", closeModal);
  document.getElementById("modalDownload").addEventListener("click", downloadSnapshot);

  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && modal.classList.contains("show")) { closeModal(); return; }

    const tag = (document.activeElement && document.activeElement.tagName) || "";
    const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
    if (typing || modal.classList.contains("show")) return;

    if (e.code === "Space" || e.key.toLowerCase() === "s") {
      if (stream) { e.preventDefault(); takeSnapshot(); }
    }
  });

  /* ============================================================
     GLOBAL CONTROLS
  ============================================================ */
  layoutBtn.addEventListener("click", () => {
    state.layout = state.layout === "vertical" ? "horizontal" : "vertical";
    applyLayout();
    save();
  });

  swapBtn.addEventListener("click", () => {
    state.camFirst = !state.camFirst;
    mountPanes();
    save();
  });

  snapTopBtn.addEventListener("click", takeSnapshot);

  resetBtn.addEventListener("click", () => {
    state = defaults();
    applyMirror();
    setFilter("none");
    mountPanes();
    applyLayout();
    renderContent();
    save();
    startCamera(state.deviceId || "");
  });

  /* ============================================================
     LIFECYCLE
  ============================================================ */
  document.addEventListener("visibilitychange", () => {
    if (!stream) return;
    if (document.hidden) {
      video.pause();
      stopLoop();
    } else {
      video.play().catch(() => {});
      if (state.filter !== "none") startLoop();
    }
  });

  window.addEventListener("resize", () => { resizeFx(); });

  window.addEventListener("beforeunload", () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stopLoop();
  });

  /* ============================================================
     INIT
  ============================================================ */
  mountPanes();
  applyLayout();
  applyMirror();
  renderContent();
  setLive(false);

  // restore saved filter chip highlight
  filterStrip.querySelectorAll(".chip").forEach(c =>
    c.classList.toggle("on", c.dataset.filter === state.filter)
  );

  // Start camera, and kick off face tracking if a filter was saved
  startCamera(state.deviceId || "").then(() => {
    if (state.filter !== "none") {
      initFaceTracking();
      startLoop();
    }
    updateFxStatus();
  });

  startLoop();   // harmless while idle — it early-returns

})();
</script>
</body>
</html>
