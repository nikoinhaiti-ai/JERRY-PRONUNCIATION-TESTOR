<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Mobile Split Screen</title>
<style>
  :root{
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overscroll-behavior:none; }

  body{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:#0b0b0f;
    color:#fff;
    overflow:hidden;
    touch-action: manipulation;
  }

  /* ---------- Split layout ---------- */
  .split{
    display:flex;
    gap:8px;
    height:100dvh;              /* dynamic vh: handles mobile URL bar */
    padding-top:    calc(var(--safe-t) + 8px);
    padding-right:  calc(var(--safe-r) + 8px);
    padding-bottom: calc(var(--safe-b) + 78px);  /* room for dock */
    padding-left:   calc(var(--safe-l) + 8px);
  }

  /* Portrait phone  -> stack vertically
     Landscape / tablet -> side by side */
  @media (orientation: portrait){
    .split{ flex-direction: column; }
  }

  .pane{
    flex: 1 1 0;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    background:#15151c;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }

  .pane.left  { background: linear-gradient(135deg,#1e3a8a,#3b82f6); }
  .pane.right { background: linear-gradient(135deg,#7c2d12,#f97316); }

  .pane-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    background: rgba(0,0,0,.28);
    backdrop-filter: blur(6px);
    flex: 0 0 auto;
  }

  .pane-title{
    font-size: clamp(.7rem, 2.6vw, .9rem);
    font-weight:700;
    letter-spacing:.02em;
    text-transform:uppercase;
    opacity:.9;
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .mini{
    border:0;
    border-radius:8px;
    background: rgba(255,255,255,.18);
    color:#fff;
    font-size:.72rem;
    font-weight:600;
    padding:7px 10px;
    min-height:32px;
    cursor:pointer;
    transition: background .15s;
  }
  .mini:hover{ background: rgba(255,255,255,.3); }

  .pane-body{
    flex:1 1 auto;
    min-height:0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .pane-body iframe{
    width:100%;
    height:100%;
    border:0;
    background:#fff;
    display:block;
  }

  .placeholder{
    text-align:center;
    padding:16px;
    font-size: clamp(.85rem, 3.4vw, 1.1rem);
    font-weight:600;
    opacity:.85;
    line-height:1.5;
    user-select:none;
  }
  .placeholder small{
    display:block;
    margin-top:6px;
    font-weight:400;
    font-size:.75em;
    opacity:.75;
  }

  /* ---------- Bottom dock ---------- */
  .dock{
    position:fixed;
    left:50%;
    transform: translateX(-50%);
    bottom: calc(var(--safe-b) + 14px);
    z-index:20;
    display:flex;
    gap:10px;
    padding:8px;
    border-radius:999px;
    background: rgba(20,20,26,.82);
    backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    max-width: calc(100vw - 24px);
  }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:0;
    border-radius:999px;
    padding:12px 18px;
    min-height:46px;                 /* thumb-friendly */
    font-size:.85rem;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
    transition: transform .12s, background .15s;
  }
  .btn:active{ transform: scale(.96); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; }

  .btn.ghost{ background: rgba(255,255,255,.14); }
  .btn.ghost:hover{ background: rgba(255,255,255,.24); }

  .btn.rec{ background:#ef4444; }
  .btn.rec:hover{ background:#dc2626; }
  .btn.rec.recording{ background:#111; animation: pulse 1.6s infinite; }

  .btn .dot{
    width:11px; height:11px; border-radius:50%; background:#fff; flex:0 0 auto;
  }
  .btn.rec.recording .dot{ background:#ef4444; }

  @keyframes pulse{
    0%  { box-shadow:0 0 0 0 rgba(239,68,68,.7); }
    70% { box-shadow:0 0 0 14px rgba(239,68,68,0); }
    100%{ box-shadow:0 0 0 0 rgba(239,68,68,0); }
  }

  /* ---------- Status pill ---------- */
  .status{
    position:fixed;
    top: calc(var(--safe-t) + 12px);
    left:50%;
    transform: translateX(-50%);
    z-index:30;
    padding:8px 16px;
    border-radius:999px;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(8px);
    font-size:.78rem;
    font-weight:600;
    white-space:nowrap;
    display:none;
  }
  .status.show{ display:block; }

  /* Tiny screens: compact dock */
  @media (max-height: 380px){
    .dock{ padding:6px; gap:6px; }
    .btn{ padding:9px 14px; min-height:40px; font-size:.78rem; }
  }
</style>
</head>
<body>

  <div class="split" id="split">
    <section class="pane left">
      <header class="pane-head">
        <span class="pane-title">Pane A</span>
        <button class="mini" data-load="left">Load URL</button>
        <button class="mini" data-clear="left">Clear</button>
      </header>
      <div class="pane-body" id="body-left">
        <div class="placeholder">
          Pane A<small>Tap “Load URL” to embed a site</small>
        </div>
      </div>
    </section>

    <section class="pane right">
      <header class="pane-head">
        <span class="pane-title">Pane B</span>
        <button class="mini" data-load="right">Load URL</button>
        <button class="mini" data-clear="right">Clear</button>
      </header>
      <div class="pane-body" id="body-right">
        <div class="placeholder">
          Pane B<small>Tap “Load URL” to embed a site</small>
        </div>
      </div>
    </section>
  </div>

  <div class="status" id="status">Recording…</div>

  <div class="dock">
    <button class="btn ghost" id="fsBtn">⛶ Fullscreen</button>
    <button class="btn rec" id="recBtn">
      <span class="dot"></span><span id="recText">Record</span>
    </button>
  </div>

  <!-- ffmpeg.wasm (used only for webm -> mp4 conversion on desktop) -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

  <script>
  /* =========================================================
     1. Embed a website in a pane
     ========================================================= */
  const panes = {
    left:  document.getElementById("body-left"),
    right: document.getElementById("body-right"),
  };

  document.querySelectorAll("[data-load]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const side = btn.dataset.load;
      const raw = prompt("Enter a website URL:", "https://example.com");
      if (!raw) return;

      let url = raw.trim();
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;

      panes[side].innerHTML =
        `<iframe src="${url}" allow="fullscreen; autoplay; clipboard-write"
                 sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`;
    });
  });

  document.querySelectorAll("[data-clear]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const side = btn.dataset.clear;
      const label = side === "left" ? "Pane A" : "Pane B";
      panes[side].innerHTML =
        `<div class="placeholder">${label}<small>Tap “Load URL” to embed a site</small></div>`;
    });
  });

  /* =========================================================
     2. Fullscreen toggle (useful on phone)
     ========================================================= */
  const fsBtn = document.getElementById("fsBtn");
  const splitEl = document.getElementById("split");

  fsBtn.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        const el = splitEl.requestFullscreen
          ? splitEl
          : document.documentElement;
        await el.requestFullscreen({ navigationUI: "hide" });
      } else {
        await document.exitFullscreen();
      }
    } catch {
      alert("Fullscreen isn't supported in this browser.");
    }
  });

  document.addEventListener("fullscreenchange", () => {
    fsBtn.textContent = document.fullscreenElement ? "⛶ Exit" : "⛶ Fullscreen";
  });

  /* =========================================================
     3. Screen recorder (desktop browsers; MP4 output)
     ========================================================= */
  const { FFmpeg }  = FFmpegWASM;
  const { fetchFile } = FFmpegUtil;

  const recBtn  = document.getElementById("recBtn");
  const recText = document.getElementById("recText");
  const statusEl = document.getElementById("status");

  let mediaRecorder = null;
  let chunks = [];
  let stream = null;
  let ffmpeg = null;

  const supportsRecording =
    !!navigator.mediaDevices?.getDisplayMedia &&
    typeof window.MediaRecorder !== "undefined";

  if (!supportsRecording) {
    recBtn.disabled = true;
    recText.textContent = "No recording";
    recBtn.title = "Screen recording isn't available on this device/browser.";
  }

  function pickMimeType() {
    const list = [
      "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
      "video/mp4",
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm",
    ];
    for (const t of list) {
      if (MediaRecorder.isTypeSupported(t)) return t;
    }
    return "";
  }

  async function toBlobURL(url, mime) {
    const res = await fetch(url);
    const buf = await res.arrayBuffer();
    return URL.createObjectURL(new Blob([buf], { type: mime }));
  }

  async function loadFFmpeg() {
    if (ffmpeg) return ffmpeg;
    setStatus("Loading MP4 converter…");
    ffmpeg = new FFmpeg();
    const base = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
    await ffmpeg.load({
      coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, "text/javascript"),
      wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, "application/wasm"),
    });
    return ffmpeg;
  }

  async function convertToMp4(webmBlob) {
    const ff = await loadFFmpeg();
    setStatus("Converting to MP4…");
    await ff.writeFile("in.webm", await fetchFile(webmBlob));
    await ff.exec([
      "-i","in.webm",
      "-c:v","libx264","-preset","ultrafast","-crf","23",
      "-c:a","aac","-b:a","128k",
      "-movflags","+faststart",
      "out.mp4",
    ]);
    const data = await ff.readFile("out.mp4");
    await ff.deleteFile("in.webm");
    await ff.deleteFile("out.mp4");
    return new Blob([data.buffer], { type: "video/mp4" });
  }

  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function setStatus(text) {
    statusEl.textContent = text;
    statusEl.classList.add("show");
  }
  function clearStatus() {
    statusEl.classList.remove("show");
  }

  if (supportsRecording) {
    recBtn.addEventListener("click", async () => {
      /* --- STOP --- */
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      try {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always", frameRate: 30 },
          audio: true,
        });

        const mime = pickMimeType();
        mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
        chunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size) chunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          const used = mediaRecorder.mimeType || mime || "video/webm";
          const raw = new Blob(chunks, { type: used });

          stream.getTracks().forEach((t) => t.stop());
          recBtn.disabled = true;
          recText.textContent = "Processing…";

          try {
            const mp4 = used.includes("mp4")
              ? new Blob([raw], { type: "video/mp4" })
              : await convertToMp4(raw);
            download(mp4, `screen-${Date.now()}.mp4`);
          } catch (err) {
            console.error(err);
            alert("MP4 conversion failed — saving WebM instead.");
            download(raw, `screen-${Date.now()}.webm`);
          } finally {
            recBtn.disabled = false;
            recText.textContent = "Record";
            recBtn.classList.remove("recording");
            clearStatus();
            mediaRecorder = null;
          }
        };

        stream.getVideoTracks()[0].onended = () => {
          if (mediaRecorder?.state === "recording") mediaRecorder.stop();
        };

        mediaRecorder.start(1000);
        recText.textContent = "Stop";
        recBtn.classList.add("recording");
        setStatus("Recording…");

      } catch (err) {
        console.error(err);
        alert("Could not start recording. Permission denied or unsupported.");
      }
    });
  }
  </script>
</body>
</html>
