<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Overlay Launcher</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 15% -10%,#1b2233 0%,#0b0d12 62%),#0b0d12;
    color:#e9edf5;overflow:hidden;overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;
  }

  /* ---------- Floating bubble ---------- */
  #bubble{
    position:fixed;width:56px;height:56px;border-radius:50%;
    display:grid;place-items:center;font-size:24px;z-index:99999;
    background:linear-gradient(145deg,#FFFC00,#ffd400);
    color:#111;border:2px solid rgba(255,255,255,.35);
    box-shadow:0 10px 30px rgba(255,252,0,.22),0 6px 18px rgba(0,0,0,.55);
    cursor:grab;touch-action:none;
    transition:transform .12s ease;
  }
  #bubble:active{transform:scale(.93);cursor:grabbing}
  #bubble .badge{
    position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;
    border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;
    display:grid;place-items:center;border:2px solid #0b0d12;
  }
  #bubble .badge:empty{display:none}

  /* ---------- Launcher panel ---------- */
  #panel{
    position:fixed;z-index:99998;width:min(92vw,340px);display:none;
    background:rgba(18,21,28,.94);
    -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.11);border-radius:22px;
    padding:14px;box-shadow:0 26px 70px rgba(0,0,0,.65);
  }
  #panel.show{display:block;animation:pop .16s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}

  .p-head{display:flex;align-items:center;gap:8px;margin:2px 4px 12px}
  .p-head strong{font-size:15px;letter-spacing:.2px}
  .p-head .sub{font-size:10.5px;opacity:.5;margin-left:auto}
  .p-head .tilebtn{
    width:28px;height:28px;border-radius:9px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);color:#cfd8e6;font-size:13px;cursor:pointer;
    display:grid;place-items:center;margin-left:6px;
  }
  .p-head .tilebtn:hover{background:rgba(255,255,255,.16)}

  .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
  .tile{
    appearance:none;border:0;background:transparent;color:inherit;font:inherit;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:6px 2px;border-radius:14px;cursor:pointer;
  }
  .tile .ico{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
    font-size:22px;line-height:1;transition:transform .12s ease;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.4);
  }
  .tile:active .ico{transform:scale(.92)}
  .tile .lbl{font-size:10.5px;opacity:.78;max-width:66px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .tile.add .ico{
    background:rgba(255,255,255,.06);
    border:1px dashed rgba(255,255,255,.32);color:#cbd5e1;font-size:20px;
    box-shadow:none;
  }
  .p-foot{
    margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);
    font-size:10px;line-height:1.45;opacity:.45;
  }

  /* ---------- Floating windows ---------- */
  .win{
    position:fixed;z-index:1000;display:flex;flex-direction:column;
    min-width:220px;min-height:150px;
    background:#12151c;border:1px solid rgba(255,255,255,.13);
    border-radius:16px;overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.72);
  }
  .win.min{height:auto!important}
  .win.min .win-body,.win.min .win-foot,.win.min .win-resize{display:none}

  .win-head{
    height:42px;flex:0 0 42px;display:flex;align-items:center;gap:8px;
    padding:0 8px;background:rgba(255,255,255,.055);
    border-bottom:1px solid rgba(255,255,255,.07);
    cursor:grab;touch-action:none;user-select:none;
  }
  .win-head:active{cursor:grabbing}
  .win-head .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .win-head .ttl{flex:1;font-size:12.5px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;opacity:.92}
  .win-head .acts{display:flex;gap:4px}
  .win-head button{
    width:27px;height:27px;border-radius:9px;border:0;cursor:pointer;
    background:rgba(255,255,255,.08);color:#dbe3ef;font-size:12.5px;
    display:grid;place-items:center;padding:0;
  }
  .win-head button:hover{background:rgba(255,255,255,.2)}
  .win-head button[data-a="close"]:hover{background:#ef4444;color:#fff}

  .win-body{flex:1;position:relative;background:#0b0d12;overflow:hidden}
  .win-body iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .win-body .empty{
    position:absolute;inset:0;display:grid;place-items:center;text-align:center;
    font-size:12px;opacity:.5;padding:20px;line-height:1.6;
  }
  .win-foot{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:6px 9px;font-size:10px;color:#9aa6b8;
    background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.07);
  }
  .win-foot span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .win-foot button{
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);
    color:#dbe3ef;font:inherit;font-size:10px;padding:3px 8px;border-radius:7px;
    cursor:pointer;white-space:nowrap;
  }
  .win-foot button:hover{background:rgba(255,255,255,.18)}

  .win-resize{
    position:absolute;right:0;bottom:0;width:22px;height:22px;
    cursor:nwse-resize;touch-action:none;z-index:6;
  }
  .win-resize::after{
    content:'';position:absolute;right:5px;bottom:5px;width:9px;height:9px;
    border-right:2px solid rgba(255,255,255,.45);
    border-bottom:2px solid rgba(255,255,255,.45);
    border-radius:0 0 3px 0;
  }

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:100000;display:none;
    background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:16px;
  }
  .modal.show{display:flex}
  .sheet{
    width:min(96vw,400px);max-height:88vh;overflow:auto;
    background:#141821;border:1px solid rgba(255,255,255,.12);
    border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.75);
    animation:pop .18s cubic-bezier(.2,.9,.3,1.3);
  }
  .sheet h3{margin:0 0 16px;font-size:16px}
  .sheet label{display:block;font-size:11px;opacity:.62;margin-bottom:11px}
  .sheet input{
    display:block;width:100%;margin-top:5px;padding:10px 12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
    border-radius:11px;color:#eef2f8;font:inherit;font-size:13px;outline:none;
  }
  .sheet input:focus{border-color:rgba(255,252,0,.55);
    box-shadow:0 0 0 3px rgba(255,252,0,.1)}
  .sheet input[type=color]{
    padding:3px;height:40px;cursor:pointer;background:rgba(255,255,255,.06);
  }
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 16px}
  .chip{
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);
    color:#dbe3ef;font:inherit;font-size:11px;padding:6px 10px;border-radius:20px;
    cursor:pointer;
  }
  .chip:hover{background:rgba(255,255,255,.16)}
  .row{display:flex;gap:8px;align-items:center;margin-top:4px}
  .row .spacer{flex:1}
  .row button{
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);
    color:#e6ecf5;font:inherit;font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:12px;cursor:pointer;
  }
  .row button.primary{background:#FFFC00;color:#141414;border-color:#FFFC00}
  .row button.danger{background:transparent;border-color:rgba(239,68,68,.5);color:#ff8080}
  .row button:hover{filter:brightness(1.12)}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    z-index:100001;padding:11px 18px;border-radius:14px;
    background:rgba(24,28,38,.96);border:1px solid rgba(255,255,255,.14);
    font-size:12.5px;box-shadow:0 14px 40px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transition:.25s ease;max-width:88vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

  <!-- Floating launcher bubble -->
  <div id="bubble" title="Open app launcher">📱<span class="badge" id="badge"></span></div>

  <!-- App launcher panel -->
  <div id="panel">
    <div class="p-head">
      <strong>My apps</strong>
      <span class="sub">tap · hold to edit</span>
      <button class="tilebtn" id="btnTile" title="Tile all windows">▦</button>
    </div>
    <div class="apps" id="grid"></div>
    <div class="p-foot">
      Tip: open two apps, then hit ▦ to split them on screen at once.
    </div>
  </div>

  <!-- Add / edit app modal -->
  <div class="modal" id="modal">
    <div class="sheet">
      <h3 id="mTitle">Add app</h3>
      <label>Name<input id="fName" placeholder="Snapchat" autocomplete="off"></label>
      <label>Icon (emoji)<input id="fEmoji" placeholder="👻" maxlength="4" autocomplete="off"></label>
      <label>Colour<input id="fColor" type="color" value="#FFFC00"></label>
      <label>Web URL<input id="fUrl" placeholder="https://web.snapchat.com/" inputmode="url" autocomplete="off"></label>
      <label>App link / deep link <span style="opacity:.6">(optional)</span>
        <input id="fScheme" placeholder="snapchat://" autocomplete="off"></label>
      <div class="presets" id="presets"></div>
      <div class="row">
        <button id="mDelete" class="danger" style="display:none">Delete</button>
        <span class="spacer"></span>
        <button id="mCancel">Cancel</button>
        <button id="mSave" class="primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
(() => {
  "use strict";

  /* ==================== Storage & defaults ==================== */
  const LS_APPS = "overlayLauncher.apps.v1";
  const LS_POS  = "overlayLauncher.bubble.v1";

  const DEFAULT_APPS = [{
    id: "snapchat",
    name: "Snapchat",
    emoji: "👻",
    color: "#FFFC00",
    url: "https://web.snapchat.com/",
    scheme: "snapchat://"
  }];

  const PRESETS = [
    { name:"Instagram", emoji:"📸", color:"#E1306C", url:"https://www.instagram.com/",   scheme:"instagram://app" },
    { name:"WhatsApp",  emoji:"💬", color:"#25D366", url:"https://web.whatsapp.com/",    scheme:"whatsapp://" },
    { name:"YouTube",   emoji:"▶️", color:"#FF0000", url:"https://m.youtube.com/",       scheme:"vnd.youtube://" },
    { name:"TikTok",    emoji:"🎵", color:"#111111", url:"https://www.tiktok.com/",      scheme:"snssdk1233://" },
    { name:"Discord",   emoji:"🎮", color:"#5865F2", url:"https://discord.com/app",      scheme:"discord://" },
    { name:"Maps",      emoji:"🗺️", color:"#4285F4", url:"https://maps.google.com/",     scheme:"" },
    { name:"Reddit",    emoji:"👽", color:"#FF4500", url:"https://www.reddit.com/",      scheme:"reddit://" },
    { name:"X",         emoji:"𝕏",  color:"#000000", url:"https://x.com/",               scheme:"twitter://" }
  ];

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const uid = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  let apps = loadApps();
  let openWins = [];
  let zTop = 1000;

  function loadApps() {
    try {
      const raw = localStorage.getItem(LS_APPS);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_APPS));
  }
  function saveApps() {
    try { localStorage.setItem(LS_APPS, JSON.stringify(apps)); } catch (e) {}
  }

  /* ==================== Elements ==================== */
  const bubble = $("#bubble");
  const badge  = $("#badge");
  const panel  = $("#panel");
  const grid   = $("#grid");
  const modal  = $("#modal");
  const toastEl = $("#toast");

  /* ==================== Toast ==================== */
  let toastTimer;
  function toast(msg, ms = 2200) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
  }

  /* ==================== Launcher panel ==================== */
  function renderApps() {
    grid.innerHTML = "";

    apps.forEach(app => {
      const t = document.createElement("button");
      t.className = "tile";
      t.type = "button";
      t.innerHTML =
        `<span class="ico" style="background:${esc(app.color || "#334155")}">${esc(app.emoji || "📱")}</span>` +
        `<span class="lbl">${esc(app.name)}</span>`;

      let lpTimer = null, longPressed = false;

      t.addEventListener("pointerdown", () => {
        longPressed = false;
        lpTimer = setTimeout(() => {
          longPressed = true;
          if (navigator.vibrate) navigator.vibrate(15);
          openModal(app);
        }, 600);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
        t.addEventListener(ev, () => { clearTimeout(lpTimer); lpTimer = null; }));

      t.addEventListener("click", e => {
        if (longPressed) { longPressed = false; e.preventDefault(); return; }
        openApp(app);
      });
      t.addEventListener("contextmenu", e => { e.preventDefault(); openModal(app); });

      grid.appendChild(t);
    });

    // "Add app" tile
    const add = document.createElement("button");
    add.className = "tile add";
    add.type = "button";
    add.innerHTML = `<span class="ico">＋</span><span class="lbl">Add app</span>`;
    add.addEventListener("click", () => openModal(null));
    grid.appendChild(add);
  }

  function positionPanel() {
    panel.style.visibility = "hidden";
    panel.classList.add("show");

    const b = bubble.getBoundingClientRect();
    const pw = panel.offsetWidth, ph = panel.offsetHeight;

    let left = b.left + b.width / 2 - pw / 2;
    let top  = b.top - ph - 14;
    if (top < 8) top = b.bottom + 14;

    left = clamp(left, 10, window.innerWidth - pw - 10);
    top  = clamp(top, 10, window.innerHeight - ph - 10);

    panel.style.left = left + "px";
    panel.style.top  = top + "px";
    panel.style.visibility = "";
  }

  function openPanel()  { positionPanel(); }
  function closePanel() { panel.classList.remove("show"); }
  function togglePanel(){ panel.classList.contains("show") ? closePanel() : openPanel(); }

  /* ==================== App windows ==================== */
  function openApp(app) {
    const existing = openWins.find(w => w.appId === app.id);
    if (existing) {
      existing.el.classList.remove("min");
      focusWin(existing);
      closePanel();
      return;
    }
    createWindow(app);
    closePanel();
  }

  function focusWin(win) { win.el.style.zIndex = ++zTop; }

  function createWindow(app) {
    const el = document.createElement("div");
    el.className = "win";

    const vw = window.innerWidth, vh = window.innerHeight;
    const w = Math.min(430, vw - 20);
    const h = Math.min(640, vh - 120);
    const n = openWins.length;
    const left = clamp(16 + n * 26, 8, Math.max(8, vw - w - 8));
    const top  = clamp(64 + n * 26, 8, Math.max(8, vh - h - 8));

    el.style.width  = w + "px";
    el.style.height = h + "px";
    el.style.left   = left + "px";
    el.style.top    = top + "px";
    el.style.zIndex = ++zTop;

    const body = app.url
      ? `<iframe src="${esc(app.url)}"
                 allow="camera;microphone;clipboard-write;fullscreen;autoplay;encrypted-media"
                 referrerpolicy="no-referrer"
                 loading="lazy"></iframe>`
      : `<div class="empty">No web URL set for this app.<br>Use 📲 to launch the installed app.</div>`;

    el.innerHTML = `
      <div class="win-head">
        <span class="dot" style="background:${esc(app.color || "#64748b")}"></span>
        <span class="ttl">${esc(app.name)}</span>
        <div class="acts">
          ${app.scheme ? `<button data-a="app" title="Open in installed app">📲</button>` : ""}
          <button data-a="tab" title="Open in browser">↗</button>
          <button data-a="min" title="Minimise">–</button>
          <button data-a="close" title="Close">✕</button>
        </div>
      </div>
      <div class="win-body">${body}</div>
      <div class="win-foot">
        <span>Blank page? Many sites block embedding.</span>
        ${app.scheme ? `<button data-a="app2">Open app</button>` : ""}
        <button data-a="tab2">Browser</button>
      </div>
      <div class="win-resize" title="Resize"></div>
    `;

    document.body.appendChild(el);

    const winObj = { appId: app.id, app, el };
    openWins.push(winObj);
    updateBadge();

    // Header actions
    el.addEventListener("click", e => {
      const btn = e.target.closest("button[data-a]");
      if (!btn) return;
      const a = btn.dataset.a;
      if (a === "close")      closeWin(winObj);
      else if (a === "min")   el.classList.toggle("min");
      else if (a === "tab" || a === "tab2") {
        const target = app.url || app.scheme;
        if (target) window.open(target, "_blank", "noopener");
      }
      else if (a === "app" || a === "app2") launchScheme(app);
    });

    // Bring to front on any interaction
    el.addEventListener("pointerdown", () => focusWin(winObj), true);

    // Drag + resize
    makeDraggable(el, el.querySelector(".win-head"));
    makeResizable(el, el.querySelector(".win-resize"));
  }

  function closeWin(win) {
    win.el.remove();
    openWins = openWins.filter(w => w !== win);
    updateBadge();
  }

  function updateBadge() {
    badge.textContent = openWins.length > 1 ? String(openWins.length) : "";
  }

  /* ==================== Drag & resize ==================== */
  function makeDraggable(el, handle) {
    let st = null;
    handle.addEventListener("pointerdown", e => {
      if (e.target.closest("button")) return;
      e.preventDefault();
      handle.setPointerCapture(e.pointerId);
      const r = el.getBoundingClientRect();
      st = { sx: e.clientX, sy: e.clientY, ox: r.left, oy: r.top };
      focusWinByEl(el);
    });
    handle.addEventListener("pointermove", e => {
      if (!st) return;
      const x = clamp(st.ox + e.clientX - st.sx, 0, window.innerWidth  - 70);
      const y = clamp(st.oy + e.clientY - st.sy, 0, window.innerHeight - 46);
      el.style.left = x + "px";
      el.style.top  = y + "px";
    });
    const end = e => {
      st = null;
      try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  }

  function focusWinByEl(el) {
    const win = openWins.find(w => w.el === el);
    if (win) focusWin(win);
  }

  function makeResizable(el, handle) {
    let st = null;
    handle.addEventListener("pointerdown", e => {
      e.preventDefault();
      e.stopPropagation();
      handle.setPointerCapture(e.pointerId);
      const r = el.getBoundingClientRect();
      st = { sx: e.clientX, sy: e.clientY, w: r.width, h: r.height };
      focusWinByEl(el);
    });
    handle.addEventListener("pointermove", e => {
      if (!st) return;
      const maxW = window.innerWidth  - el.offsetLeft - 6;
      const maxH = window.innerHeight - el.offsetTop  - 6;
      const w = clamp(st.w + e.clientX - st.sx, 220, maxW);
      const h = clamp(st.h + e.clientY - st.sy, 150, maxH);
      el.style.width  = w + "px";
      el.style.height = h + "px";
    });
    const end = e => {
      st = null;
      try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
    };
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  }

  /* ==================== Tile windows (split view) ==================== */
  function tileWindows() {
    const n = openWins.length;
    if (!n) { toast("Open an app first"); return; }
    const cols = Math.ceil(Math.sqrt(n));
    const rows = Math.ceil(n / cols);
    const gap = 8;
    const w = (window.innerWidth  - gap * (cols + 1)) / cols;
    const h = (window.innerHeight - gap * (rows + 1)) / rows;

    openWins.forEach((win, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      win.el.classList.remove("min");
      win.el.style.left   = (gap + c * (w + gap)) + "px";
      win.el.style.top    = (gap + r * (h + gap)) + "px";
      win.el.style.width  = w + "px";
      win.el.style.height = h + "px";
    });
    closePanel();
    toast(n + " apps side by side");
  }

  /* ==================== Deep link launching ==================== */
  function launchScheme(app) {
    if (!app.scheme) { toast("No app link set for " + app.name); return; }

    const started = Date.now();
    const ifr = document.createElement("iframe");
    ifr.style.cssText = "display:none;width:0;height:0;border:0";
    document.body.appendChild(ifr);
    try { ifr.src = app.scheme; } catch (e) { ifr.src = app.scheme; }
    setTimeout(() => ifr.remove(), 1400);

    setTimeout(() => {
      const stillHere = document.visibilityState === "visible" &&
                        Date.now() - started < 2600;
      if (stillHere && app.url) {
        toast("App not installed — opening web version…");
        window.open(app.url, "_blank", "noopener");
      }
    }, 1600);
  }

  /* ==================== Add / edit modal ==================== */
  let editingId = null;

  function renderPresets() {
    const box = $("#presets");
    box.innerHTML = "";
    PRESETS.forEach(p => {
      const c = document.createElement("button");
      c.type = "button";
      c.className = "chip";
      c.textContent = p.emoji + " " + p.name;
      c.addEventListener("click", () => {
        $("#fName").value   = p.name;
        $("#fEmoji").value  = p.emoji;
        $("#fColor").value  = /^#[0-9a-f]{6}$/i.test(p.color) ? p.color : "#334155";
        $("#fUrl").value    = p.url;
        $("#fScheme").value = p.scheme;
      });
      box.appendChild(c);
    });
  }

  function openModal(app) {
    editingId = app ? app.id : null;
    $("#mTitle").textContent  = app ? "Edit app" : "Add app";
    $("#mName").value   = app ? app.name   : "";
    $("#fEmoji").value  = app ? (app.emoji || "") : "";
    $("#fColor").value  = app && /^#[0-9a-f]{6}$/i.test(app.color || "")
                            ? app.color : "#FFFC00";
    $("#fUrl").value    = app ? (app.url    || "") : "";
    $("#fScheme").value = app ? (app.scheme || "") : "";
    $("#mDelete").style.display = app ? "" : "none";
    modal.classList.add("show");
    closePanel();
    setTimeout(() => $("#fName").focus(), 60);
  }

  function closeModal() {
    modal.classList.remove("show");
    editingId = null;
  }

  function saveModal() {
    const name = $("#fName").value.trim();
    if (!name) { toast("Give the app a name"); $("#fName").focus(); return; }

    let url = $("#fUrl").value.trim();
    if (url && !/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;

    const data = {
      name,
      emoji:  $("#fEmoji").value.trim() || "📱",
      color:  $("#fColor").value,
      url,
      scheme: $("#fScheme").value.trim()
    };

    if (editingId) {
      const i = apps.findIndex(a => a.id === editingId);
      if (i > -1) {
        apps[i] = Object.assign({}, apps[i], data);
        // refresh any open window for this app
        const win = openWins.find(w => w.appId === editingId);
        if (win) { closeWin(win); createWindow(apps[i]); }
      }
    } else {
      apps.push(Object.assign({ id: uid() }, data));
    }

    saveApps();
    renderApps();
    closeModal();
    toast(editingId ? "App updated" : name + " added");
  }

  function deleteApp() {
    if (!editingId) return;
    const app = apps.find(a => a.id === editingId);
    if (!app) return;
    if (!confirm(`Remove "${app.name}" from your launcher?`)) return;

    apps = apps.filter(a => a.id !== editingId);
    const win = openWins.find(w => w.appId === editingId);
    if (win) closeWin(win);

    saveApps();
    renderApps();
    closeModal();
    toast("Removed");
  }

  /* ==================== Bubble drag / tap ==================== */
  function setBubblePos(x, y, persist = true) {
    const size = 56;
    x = clamp(x, 6, window.innerWidth  - size - 6);
    y = clamp(y, 6, window.innerHeight - size - 6);
    bubble.style.left = x + "px";
    bubble.style.top  = y + "px";
    bubble.style.right = "auto";
    bubble.style.bottom = "auto";
    if (persist) {
      try { localStorage.setItem(LS_POS, JSON.stringify({ x, y })); } catch (e) {}
    }
  }

  (function initBubblePos() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(LS_POS) || "null"); } catch (e) {}
    if (saved && typeof saved.x === "number") {
      setBubblePos(saved.x, saved.y, false);
    } else {
      setBubblePos(window.innerWidth - 72, window.innerHeight - 96, false);
    }
  })();

  let bDrag = null;
  bubble.addEventListener("pointerdown", e => {
    e.preventDefault();
    bubble.setPointerCapture(e.pointerId);
    const r = bubble.getBoundingClientRect();
    bDrag = { sx: e.clientX, sy: e.clientY, ox: r.left, oy: r.top, moved: false };
  });
  bubble.addEventListener("pointermove", e => {
    if (!bDrag) return;
    const dx = e.clientX - bDrag.sx, dy = e.clientY - bDrag.sy;
    if (!bDrag.moved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) bDrag.moved = true;
    if (bDrag.moved) setBubblePos(bDrag.ox + dx, bDrag.oy + dy, false);
  });
  bubble.addEventListener("pointerup", e => {
    if (bDrag) {
      if (bDrag.moved) {
        const r = bubble.getBoundingClientRect();
        setBubblePos(r.left, r.top, true);
      } else {
        togglePanel();
      }
    }
    bDrag = null;
    try { bubble.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  bubble.addEventListener("pointercancel", () => { bDrag = null; });

  /* ==================== Global events ==================== */
  document.addEventListener("pointerdown", e => {
    if (panel.contains(e.target) || bubble.contains(e.target)) return;
    if (modal.contains(e.target)) return;
    closePanel();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (modal.classList.contains("show")) closeModal();
      else closePanel();
    }
  });

  window.addEventListener("resize", () => {
    const r = bubble.getBoundingClientRect();
    setBubblePos(r.left, r.top, true);
    if (panel.classList.contains("show")) positionPanel();
  });

  $("#btnTile").addEventListener("click", tileWindows);
  $("#mSave").addEventListener("click", saveModal);
  $("#mCancel").addEventListener("click", closeModal);
  $("#mDelete").addEventListener("click", deleteApp);
  modal.addEventListener("pointerdown", e => { if (e.target === modal) closeModal(); });
  $("#fName").addEventListener("keydown", e => { if (e.key === "Enter") saveModal(); });

  /* ==================== Boot ==================== */
  renderApps();
  renderPresets();
})();
</script>
</body>
</html>
